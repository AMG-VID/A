<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدير البقالة</title>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Tajawal'; background:#f0f7f0; padding:20px; }
    .container { max-width:700px; margin:auto; background:#fff; padding:20px; border-radius:20px; }
    input, button { width:100%; padding:12px; margin:10px 0; border-radius:20px; border:1px solid #ccc; }
    button { background:#2e7d32; color:#fff; border:none; cursor:pointer; }
    button:hover { background:#1b5e20; }
    .error { color:red; }
  </style>
</head>

<body>

<div class="container">

  <div id="loginScreen">
    <h2>تسجيل الدخول</h2>
    <input id="userId" placeholder="ID">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">دخول</button>
    <p class="error" id="error"></p>
  </div>

  <div id="app" style="display:none;">
    <h2>Dashboard</h2>
    <button onclick="logout()">خروج</button>
  </div>

</div>

<script>
  // Firebase Config (حطيت اللي انت بعته)
  const firebaseConfig = {
    apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
    authDomain: "bakkala-system.firebaseapp.com",
    projectId: "bakkala-system",
    storageBucket: "bakkala-system.firebasestorage.app",
    messagingSenderId: "807660158854",
    appId: "1:807660158854:web:c3690293a27185f07fb607",
    measurementId: "G-6H51EXR563"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  const loginScreen = document.getElementById("loginScreen");
  const app = document.getElementById("app");
  const error = document.getElementById("error");

  function login() {
    const userId = document.getElementById("userId").value.trim();
    const password = document.getElementById("password").value;

    if (!userId || !password) {
      error.innerText = "اكتب البيانات";
      return;
    }

    const email = userId + "@bkalla.com";

    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        loginScreen.style.display = "none";
        app.style.display = "block";
        error.innerText = "";
      })
      .catch(err => {
        error.innerText = "بيانات غلط أو المستخدم مش موجود";
      });
  }

  function logout() {
    auth.signOut().then(() => {
      loginScreen.style.display = "block";
      app.style.display = "none";
    });
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      loginScreen.style.display = "none";
      app.style.display = "block";
    }
  });
</script>

</body>
</html>
