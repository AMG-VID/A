// ======================= PWA =======================
(function setupPWA() {
    const manifestObj = {
        "name": "فاتورة موسي",
        "short_name": "فاتورة موسي",
        "start_url": ".",
        "display": "standalone",
        "theme_color": "#4c1d95",
        "background_color": "#eef2ff",
        "icons": [{ "src": "Icon.png", "sizes": "any", "type": "image/jpeg" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    let manifestLink = document.querySelector('link[rel="manifest"]');
    if (!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
    manifestLink.href = manifestURL;
    const swCode = `const CACHE_NAME='fatora-v10';const urlsToCache=['./','./index.html','Icon.png','https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap','https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css','https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js','https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js','https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js'];self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(urlsToCache))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.map(k=>{if(k!==CACHE_NAME)return caches.delete(k)})))));`;
    const swBlob = new Blob([swCode], {type:'application/javascript'});
    const swURL = URL.createObjectURL(swBlob);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register(swURL).catch(e=>console.warn(e));
})();

let idbReady = false, dbCache;
const openDB = async () => {
    if (!window.idb) return;
    dbCache = await idb.openDB('FatoraMousaOffline', 6, {
        upgrade(db) {
            if (!db.objectStoreNames.contains('pending')) db.createObjectStore('pending', { autoIncrement: true });
            if (!db.objectStoreNames.contains('cache')) db.createObjectStore('cache', { keyPath: 'key' });
        }
    });
    idbReady = true;
};
openDB();

async function cacheData(key, data) { if (idbReady && dbCache) await dbCache.put('cache', { key, data, timestamp: Date.now() }); }
async function getCachedData(key) { if (idbReady && dbCache) { const res = await dbCache.get('cache', key); return res?.data; } return null; }
async function addPendingOp(op) { if (idbReady && dbCache) await dbCache.add('pending', op); }
async function getPendingOps() { if (idbReady && dbCache) return await dbCache.getAll('pending'); return []; }
async function clearPendingOps() { if (idbReady && dbCache) await dbCache.clear('pending'); }

let currentUserAuth=null, userData=null, currentStoreId=null, currentRole=null, isAdminGlobal=false;
let allProducts=[], allCustomers=[], allSuppliers=[], allInvoicesCache=[], allMissingProducts=[], allOffers=[];
let lastReceiptData=null, isSyncing=false;

async function loadFromCacheThenSync() {
    allProducts = await getCachedData('products') || [];
    allCustomers = await getCachedData('customers') || [];
    allSuppliers = await getCachedData('suppliers') || [];
    allInvoicesCache = await getCachedData('invoices') || [];
    allMissingProducts = await getCachedData('missingProducts') || [];
    allOffers = await getCachedData('offers') || [];
}
loadFromCacheThenSync();

async function refreshFromFirestore() {
    if (!currentStoreId || isAdminGlobal) return;
    try {
        const [prodSnap, custSnap, suppSnap, invSnap, missingSnap, offersSnap] = await Promise.all([
            getProductsCol().get(), getCustomersCol().get(), getSuppliersCol().get(),
            getInvoicesCol().get(), getMissingProductsCol().get(), getOffersCol().get()
        ]);
        allProducts = prodSnap.docs.map(d=>({id:d.id,...d.data()}));
        allCustomers = custSnap.docs.map(d=>({id:d.id,...d.data()}));
        allSuppliers = suppSnap.docs.map(d=>({id:d.id,...d.data()}));
        allInvoicesCache = invSnap.docs.map(d=>({id:d.id,...d.data()}));
        allMissingProducts = missingSnap.docs.map(d=>({id:d.id,...d.data()}));
        allOffers = offersSnap.docs.map(d=>({id:d.id,...d.data()}));
        await Promise.all([
            cacheData('products', allProducts), cacheData('customers', allCustomers),
            cacheData('suppliers', allSuppliers), cacheData('invoices', allInvoicesCache),
            cacheData('missingProducts', allMissingProducts), cacheData('offers', allOffers)
        ]);
        if (document.getElementById('productsListArea')) renderProductsList();
        if (document.getElementById('salesLogList')) filterAndDisplayInvoices();
        if (document.getElementById('otherContent')) loadOtherSubContent();
        if (document.getElementById('customersListDiv')) renderCustomersTable();
        if (document.getElementById('invoicesList')) applyInvoicesFilters();
    } catch(e) { console.warn(e); }
}

function showFlash(id,txt,err=false){
    let el=document.getElementById(id);
    if(!el){ el=document.createElement('div'); el.className='flash'; const t=document.getElementById('tabContent')||document.getElementById('dashboard'); if(t) t.prepend(el); else document.getElementById('app')?.prepend(el); }
    el.innerText=txt; el.style.backgroundColor=err?'#ffe0e0':'#e0f2fe'; el.style.color=err?'#b91c1c':'#065f46';
    setTimeout(()=>el.remove(),3000);
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
function formatDate(ts){ return ts?.toDate ? ts.toDate().toLocaleString('ar-EG') : new Date(ts).toLocaleString('ar-EG'); }
function getPaymentMethodArabic(method) {
    if (method === 'cash') return 'كاش';
    if (method === 'visa') return 'فيزا';
    if (method === 'credit') return 'آجل';
    return method;
}
function getCurrentOfferPrice(productId, originalPrice) {
    const now = new Date();
    const activeOffer = allOffers.find(o => o.productId === productId && o.startDate && o.endDate && o.startDate <= now && o.endDate >= now);
    return activeOffer ? activeOffer.offerPrice : originalPrice;
}

function getStoreRef(){ return db.collection('stores').doc(currentStoreId); }
function getProductsCol(){ return getStoreRef().collection('products'); }
function getCustomersCol(){ return getStoreRef().collection('customers'); }
function getSuppliersCol(){ return getStoreRef().collection('suppliers'); }
function getInvoicesCol(){ return getStoreRef().collection('invoices'); }
function getCountersCol(){ return getStoreRef().collection('counters'); }
function getMissingProductsCol(){ return getStoreRef().collection('missingProducts'); }
function getOffersCol(){ return getStoreRef().collection('offers'); }

async function ensureStoreDocument(sid,sname){
    const ref=db.collection('stores').doc(sid); const doc=await ref.get();
    if(!doc.exists) await ref.set({ name:sname, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
    return ref;
}
async function ensureUserDocument(uid,email){
    const userRef=db.collection('users').doc(uid); const doc=await userRef.get();
    if(doc.exists){
        if(doc.data().isActive===false) throw new Error('الحساب معطل');
        const data=doc.data();
        await ensureStoreDocument(data.storeId, data.storeName||'محل تجاري');
        return data;
    }
    let storeName = `محل ${email.split('@')[0]}`;
    let storeIdBase = storeName.replace(/\s/g, '').replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '');
    let storeId = `store_${storeIdBase}`;
    const existing = await db.collection('stores').doc(storeId).get();
    if(existing.exists) storeId = `store_${storeIdBase}_${Date.now()}`;
    await ensureStoreDocument(storeId, storeName);
    const newUser = { email, role:'owner', storeId, storeName, isActive:true, createdAt:firebase.firestore.FieldValue.serverTimestamp() };
    await userRef.set(newUser);
    return newUser;
}

async function getNextInvoiceNumber() {
    const today = new Date(); today.setHours(0,0,0,0);
    const counterRef = getCountersCol().doc(`daily_${today.toISOString().split('T')[0]}`);
    const snap=await counterRef.get();
    let n=1;
    if(snap.exists){ n=snap.data().current+1; await counterRef.update({current:firebase.firestore.FieldValue.increment(1)}); }
    else await counterRef.set({current:1, date:firebase.firestore.Timestamp.fromDate(today)});
    return n;
}
async function loadStoreData(){ if(isAdminGlobal||!currentStoreId) return; await refreshFromFirestore(); }
async function ensureInvoicesCache(){ return allInvoicesCache; }

async function syncPendingOps() {
    if(!navigator.onLine||isSyncing) return;
    isSyncing=true;
    const pending=await getPendingOps();
    if(pending.length===0){ isSyncing=false; return; }
    for(let op of pending){
        try{
            if(op.type==='addInvoice'){
                await getInvoicesCol().add(op.data);
                for(let item of op.data.items){
                    const prodRef=getProductsCol().doc(item.productId);
                    const prodDoc=await prodRef.get();
                    if(prodDoc.exists) await prodRef.update({qty:prodDoc.data().qty-item.quantity});
                }
                if(op.data.customerId && op.data.paymentMethod==='credit' && op.data.debtAdded>0){
                    const custRef=getCustomersCol().doc(op.data.customerId);
                    const custDoc=await custRef.get();
                    await custRef.update({debt:(custDoc.data().debt||0)+op.data.debtAdded});
                }
            } else if(op.type==='addProduct') await getProductsCol().add(op.data);
            else if(op.type==='cancelInvoice'){
                const invRef=getInvoicesCol().doc(op.invoiceId);
                await invRef.update({cancelled:true});
                for(let item of op.items){
                    const prodRef=getProductsCol().doc(item.productId);
                    const prodDoc=await prodRef.get();
                    if(prodDoc.exists) await prodRef.update({qty:(prodDoc.data().qty||0)+item.quantity});
                }
                if(op.customerId && op.debtRemoved>0){
                    const custRef=getCustomersCol().doc(op.customerId);
                    await custRef.update({debt:firebase.firestore.FieldValue.increment(-op.debtRemoved)});
                }
            } else if(op.type==='addMissingProduct') await getMissingProductsCol().add(op.data);
            else if(op.type==='deleteMissingProduct') await getMissingProductsCol().doc(op.missingId).delete();
            else if(op.type==='addOffer') await getOffersCol().add(op.data);
            else if(op.type==='deleteOffer') await getOffersCol().doc(op.offerId).delete();
        }catch(e){ console.warn(e); }
    }
    await clearPendingOps();
    await refreshFromFirestore();
    if(document.getElementById('salesLogList')) filterAndDisplayInvoices();
    if(document.getElementById('otherContent')) loadOtherSubContent();
    showFlash('tabContent','✅ تمت المزامنة مع السحابة',false);
    isSyncing=false;
}
window.addEventListener('online', async () => {
    document.getElementById('statusBar').innerHTML = '🌐 متصل - جاري المزامنة...';
    await syncPendingOps();
    document.getElementById('statusBar').innerHTML = '🌐 متصل';
    setTimeout(() => { if(document.getElementById('statusBar').innerHTML === '🌐 متصل') document.getElementById('statusBar').style.backgroundColor = '#d1fae5'; }, 2000);
});
window.addEventListener('offline', () => {
    document.getElementById('statusBar').innerHTML = '📡 غير متصل - سيتم حفظ البيانات محلياً';
    document.getElementById('statusBar').style.backgroundColor = '#fee2e2';
});
function isOnline() { return navigator.onLine; }
function manualSync() { if(navigator.onLine) syncPendingOps(); else showFlash('tabContent','لا يوجد اتصال بالإنترنت',true); }

function buildTabs(){
    const cont=document.getElementById('navTabs');
    let tabs=isAdminGlobal?[{id:'adminPanel',name:'📊 لوحة التحكم'}]:[
        {id:'pos',name:'💰 نقطة البيع'},{id:'products',name:'📦 المنتجات'},
        {id:'customers',name:'👥 العملاء'},{id:'suppliers',name:'🏭 الموردين'},
        {id:'salesLog',name:'📋 سجل المبيعات'},{id:'invoices',name:'📄 الفواتير'},
        {id:'other',name:'📦 أخرى'}
    ];
    cont.innerHTML=tabs.map(t=>`<button class="nav-btn" data-tab="${t.id}">${t.name}</button>`).join('');
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));
    if(tabs.length) switchTab(tabs[0].id);
}
async function switchTab(tabId){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    const ab=document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
    if(ab) ab.classList.add('active');
    const cont=document.getElementById('tabContent');
    if(isAdminGlobal){ cont.innerHTML='<div class="flash">لوحة المشرف قيد التطوير</div>'; return; }
    await loadStoreData();
    if(tabId==='pos') await renderPosTab(cont);
    else if(tabId==='products') await renderProductsTab(cont);
    else if(tabId==='customers') await renderCustomersTab(cont);
    else if(tabId==='suppliers') await renderSuppliersTab(cont);
    else if(tabId==='salesLog') await renderSalesLogTab(cont);
    else if(tabId==='invoices') await renderInvoicesTab(cont);
    else if(tabId==='other') await renderOtherTab(cont);
}

    container.innerHTML=`
        <div style="background:#f8fafc; border-radius:32px; padding:20px;">

                <select id="discountType"><option value="fixed">قيمة ثابتة</option><option value="percent">نسبة %</option></select>
                <button onclick="applyDiscount()" class="btn-sm" style="background:#10b981;">تطبيق خصم</button>
            </div>
            <div class="pos-row">
                <input type="number" id="paidAmount" placeholder="المدفوع" oninput="updateChange()">
                <input type="text" id="changeAmount" placeholder="الباقي" readonly>
            </div>

            <button onclick="confirmSale()" style="background:#10b981;">إتمام البيع</button>
            <div id="posFlash"></div>
            <div id="printReceiptArea" style="margin-top:10px; display:none;"><button onclick="printLastReceipt()" style="background:#22c55e;">🖨️ طباعة الفاتورة</button></div>
        </div>`;
    const sel=document.getElementById('productSelect');
    sel.innerHTML=allProducts.map(p=>`<option value="${p.id}" data-price="${p.priceRetail||p.price}">${p.name} - ${getCurrentOfferPrice(p.id, p.priceRetail||p.price)} ج.م (متوفر ${p.qty})</option>`).join('');
    if(!allProducts.length) sel.innerHTML='<option>لا توجد منتجات</option>';
    window.searchProductLive=()=>{
        let val=document.getElementById('searchProduct').value;
        let filtered=allProducts.filter(p=>(p.barcode&&p.barcode.includes(val))||p.name.includes(val));
        let s=document.getElementById('productSelect');
        s.innerHTML=filtered.map(p=>`<option value="${p.id}" data-price="${getCurrentOfferPrice(p.id, p.priceRetail||p.price)}">${p.name} - ${getCurrentOfferPrice(p.id, p.priceRetail||p.price)} ج.م (متوفر ${p.qty})</option>`).join('');
        if(!filtered.length) s.innerHTML='<option>لا يوجد</option>';
    };
    window.filterCustomers=()=>{
        let val=document.getElementById('searchCustomer').value.toLowerCase();
        let filtered=allCustomers.filter(c=>c.name.toLowerCase().includes(val));
        let opts=`<option value="">بدون عميل</option>`+filtered.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
        document.getElementById('customerId').innerHTML=opts;
    };
    window.addToCart=()=>{
        let pid=document.getElementById('productSelect').value;
        if(!pid||pid==='لا يوجد') return;
        let qty=parseInt(document.getElementById('cartQty').value);
        if(qty<=0) return;
        let prod=allProducts.find(p=>p.id===pid);
        let offerPrice = getCurrentOfferPrice(pid, prod.priceRetail);
        if(!prod||prod.qty<qty){ showFlash('posFlash','كمية غير متوفرة',true); return; }
        let existing=cart.find(i=>i.id===pid);
        if(existing) existing.qty+=qty;
        else cart.push({id:pid,name:prod.name,price:offerPrice,qty});
        renderCart();
    };
    window.renderCart=()=>{
        let cd=document.getElementById('cartItems');
        let total=0;
        let h=`<h4>السلة</h4>`;
        cart.forEach((item,idx)=>{
            total+=item.price*item.qty;
            h+=`<div class="card" style="padding:10px;">${item.name} x ${item.qty} = ${(item.price*item.qty).toFixed(2)} ج.م <button class="btn-sm btn-danger" onclick="removeFromCart(${idx})">حذف</button></div>`;
        });
        cd.innerHTML=h;
        document.getElementById('totalAmount').innerHTML=`الإجمالي: ${total.toFixed(2)} ج.م`;
        updateChange();
    };
    window.removeFromCart=(idx)=>{ cart.splice(idx,1); renderCart(); };
    window.updateChange=()=>{
        let t=cart.reduce((s,i)=>s+(i.price*i.qty),0);
        let discountVal=parseFloat(document.getElementById('discountValue').value)||0;
        let discountType=document.getElementById('discountType').value;
        let discount=discountType==='percent'? (t*discountVal/100) : discountVal;
        let afterDiscount=Math.max(0, t-discount);
        let paid=parseFloat(document.getElementById('paidAmount').value)||0;
        document.getElementById('changeAmount').value=(paid>afterDiscount)?(paid-afterDiscount).toFixed(2):0;
        document.getElementById('totalAmount').innerHTML=`الإجمالي: ${afterDiscount.toFixed(2)} ج.م (بعد الخصم)`;
    };
    window.applyDiscount=()=>{ updateChange(); };
    renderCart();
}

async function confirmSale(){
    if(cart.length===0) return showFlash('posFlash','السلة فارغة',true);
    let cid=document.getElementById('customerId').value||null;
    let pm=document.getElementById('paymentMethod').value;
    let paid=parseFloat(document.getElementById('paidAmount').value)||0;
    let totalBefore=cart.reduce((s,i)=>s+(i.price*i.qty),0);
    let discountVal=parseFloat(document.getElementById('discountValue').value)||0;
    let discountType=document.getElementById('discountType').value;
    let discountAmount=discountType==='percent'? (totalBefore*discountVal/100) : discountVal;
    let total=Math.max(0, totalBefore-discountAmount);
    let finalMethod=pm, change=0, debtAdded=0;
    if(cid && paid<total){ finalMethod='credit'; debtAdded=total-paid; paid=total; change=0; showFlash('posFlash',`سيتم إضافة ${debtAdded} ج.م كدين`,false); }
    else if(finalMethod!=='credit' && paid<total) return showFlash('posFlash','المدفوع أقل من الإجمالي',true);
    else if(finalMethod!=='credit'){ change=paid-total; if(change<0) return showFlash('posFlash','المدفوع أقل',true); }
    try{
        for(let item of cart){
            let prodRef=getProductsCol().doc(item.id);
            let prodSnap=await prodRef.get();
            if(!prodSnap.exists || prodSnap.data().qty < item.qty) throw new Error(`المنتج ${item.name} غير متوفر`);
        }
        const invoiceNumber = await getNextInvoiceNumber();
        const invoiceData = {
            invoiceNumber, items: cart.map(i=>({productId:i.id,productName:i.name,quantity:i.qty,unitPrice:i.price,total:i.price*i.qty})),
            total, discountAmount, discountType: discountType==='percent'?'percent':'fixed', discountValue:discountVal,
            paymentMethod: finalMethod, customerId: cid, paidAmount: paid, changeAmount: change,
            userId: currentUserAuth.uid, cancelled: false, date: firebase.firestore.FieldValue.serverTimestamp(), debtAdded
        };
        if(!isOnline()){
            await addPendingOp({type:'addInvoice',data:invoiceData});
            for(let item of cart){
                let prod=allProducts.find(p=>p.id===item.id);
                if(prod) prod.qty-=item.qty;
            }
            if(cid && debtAdded>0){
                let cust=allCustomers.find(c=>c.id===cid);
                if(cust) cust.debt=(cust.debt||0)+debtAdded;
            }
            await cacheData('products',allProducts); await cacheData('customers',allCustomers);
            showFlash('posFlash','تم حفظ البيع محلياً',false);
            lastReceiptData={cartItems:[...cart],total,method:finalMethod,customerId:cid,change,debtAdded,invoiceNumber,discountAmount};
            document.getElementById('printReceiptArea').style.display='block';
            cart=[]; renderCart();
            return;
        }
        const batch=db.batch();
        for(let item of cart) batch.update(getProductsCol().doc(item.id),{qty:firebase.firestore.FieldValue.increment(-item.qty)});
        const invoiceRef=getInvoicesCol().doc();
        batch.set(invoiceRef,invoiceData);
        if(cid && debtAdded>0) batch.update(getCustomersCol().doc(cid),{debt:firebase.firestore.FieldValue.increment(debtAdded)});
        await batch.commit();
        showFlash('posFlash',`✅ بيع ناجح بقيمة ${total} ج.م`,false);
        lastReceiptData={cartItems:[...cart],total,method:finalMethod,customerId:cid,change,debtAdded,invoiceNumber,discountAmount};
        document.getElementById('printReceiptArea').style.display='block';
        await refreshFromFirestore();
        const sel=document.getElementById('productSelect'); if(sel) sel.innerHTML=allProducts.map(p=>`<option value="${p.id}" data-price="${getCurrentOfferPrice(p.id, p.priceRetail||p.price)}">${p.name} - ${getCurrentOfferPrice(p.id, p.priceRetail||p.price)} ج.م (متوفر ${p.qty})</option>`).join('');
        cart=[]; renderCart();
    }catch(err){ showFlash('posFlash',err.message,true); }
}

function filterAndDisplayInvoices(){

    if(invoiceSearchNumber.trim()!==''){ const num=parseInt(invoiceSearchNumber); if(!isNaN(num)) filtered=filtered.filter(f=>f.invoiceNumber===num); }
    filtered.sort((a,b)=>(b.date?.toDate()||0)-(a.date?.toDate()||0));
    const cont=document.getElementById('salesLogList'); if(!cont) return;
    if(!filtered.length){ cont.innerHTML='<p>⚠️ لا توجد فواتير</p>'; return; }

    for(let inv of filtered){
        let canc=inv.cancelled===true;
        let cust=inv.customerId?allCustomers.find(c=>c.id===inv.customerId):null;

window.showTop10Weekly=()=>{

window.cancelInvoice=async(invoiceId)=>{
    if(!confirm('إلغاء الفاتورة؟ سيتم إعادة الكميات للمخزون وخصم الدين إن وجد.')) return;
    try{
        const invRef=getInvoicesCol().doc(invoiceId);
        const invDoc=await invRef.get();
        if(!invDoc.exists||invDoc.data().cancelled) throw new Error();
        const inv=invDoc.data();
        if(!isOnline()){
            await addPendingOp({type:'cancelInvoice',invoiceId,items:inv.items,customerId:inv.customerId,debtRemoved:inv.debtAdded||0});
            for(let item of inv.items){ let prod=allProducts.find(p=>p.id===item.productId); if(prod) prod.qty+=item.quantity; }
            if(inv.customerId && inv.paymentMethod==='credit' && inv.debtAdded){ let cust=allCustomers.find(c=>c.id===inv.customerId); if(cust) cust.debt=Math.max(0,(cust.debt||0)-inv.debtAdded); }
            await cacheData('products',allProducts); await cacheData('customers',allCustomers);
            const idx=allInvoicesCache.findIndex(i=>i.id===invoiceId);
            if(idx!==-1) allInvoicesCache[idx].cancelled=true;
            await cacheData('invoices',allInvoicesCache);
            filterAndDisplayInvoices();
            showFlash('salesLogList','تم الإلغاء محلياً',false);
            return;
        }
        const batch=db.batch();
        for(let item of inv.items) batch.update(getProductsCol().doc(item.productId),{qty:firebase.firestore.FieldValue.increment(item.quantity)});
        if(inv.customerId && inv.paymentMethod==='credit' && inv.debtAdded) batch.update(getCustomersCol().doc(inv.customerId),{debt:firebase.firestore.FieldValue.increment(-inv.debtAdded)});
        batch.update(invRef,{cancelled:true});
        await batch.commit();
        const idx=allInvoicesCache.findIndex(i=>i.id===invoiceId);
        if(idx!==-1) allInvoicesCache[idx].cancelled=true;
        await cacheData('invoices',allInvoicesCache);
        filterAndDisplayInvoices();
        showFlash('salesLogList','تم إلغاء الفاتورة',false);
    }catch(err){ showFlash('salesLogList',err.message,true); }
};

    let maxQty = parseInt(document.getElementById('filterMaxQty')?.value);
    if(search) filtered = filtered.filter(p=>p.name.toLowerCase().includes(search)||(p.barcode&&p.barcode.toLowerCase().includes(search)));
    if(!isNaN(minQty)) filtered = filtered.filter(p=>p.qty >= minQty);
    if(!isNaN(maxQty)) filtered = filtered.filter(p=>p.qty <= maxQty);
    const container = document.getElementById('filteredProductsList');

async function renderDaySalesWithStats(container, dayType){
    await ensureInvoicesCache();
    const now=new Date(); let start,end,dayName; const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    if(dayType==='today'){ start=new Date(now.getFullYear(),now.getMonth(),now.getDate()); end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1); dayName=days[now.getDay()]; container.innerHTML=`<h3>📆 مبيعات اليوم (${dayName})</h3><div id="daySalesList"></div><div id="dayStats"></div>`; }
    else{ start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1); end=new Date(now.getFullYear(),now.getMonth(),now.getDate()); let yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1); dayName=days[yest.getDay()]; container.innerHTML=`<h3>📆 مبيعات الأمس (${dayName})</h3><div id="daySalesList"></div><div id="dayStats"></div>`; }
    const filtered=allInvoicesCache.filter(inv=>!inv.cancelled && inv.date && inv.date.toDate()>=start && inv.date.toDate()<end);
    const listDiv=document.getElementById('daySalesList'); if(!filtered.length){ listDiv.innerHTML='<p>لا توجد مبيعات</p>'; document.getElementById('dayStats').innerHTML=''; return; }
    let totalSales=0,totalProfit=0,html='';
    for(let inv of filtered){
        totalSales+=inv.total;
        for(let it of inv.items){
            const prod=allProducts.find(p=>p.id===it.productId);
            const cost=prod?.cost||0;
            totalProfit+=it.total-(cost*it.quantity);
        }
        html+=`<div class="card">فاتورة ${inv.invoiceNumber} - ${inv.total.toFixed(2)} ج.م</div>`;
    }
    listDiv.innerHTML=html;
    document.getElementById('dayStats').innerHTML=`<div class="card"><strong>📊 إجمالي المبيعات: ${totalSales.toFixed(2)} ج.م</strong><br><strong>💰 إجمالي الأرباح: ${totalProfit.toFixed(2)} ج.م</strong></div>`;
}
async function renderReportsInside(container){
    await loadStoreData(); await ensureInvoicesCache();
    let profit=0, ps={};
    for(let inv of allInvoicesCache){
        if(inv.cancelled) continue;
        for(let it of inv.items){
            const prod=allProducts.find(p=>p.id===it.productId);
            const cost=prod?.cost||0;
            profit+=it.total-(cost*it.quantity);
            ps[it.productName]=(ps[it.productName]||0)+it.quantity;
        }
    }
    let best=Object.keys(ps).length?Object.keys(ps).reduce((a,b)=>ps[a]>ps[b]?a:b):'لا يوجد';
    let low=allProducts.filter(p=>p.qty<=(p.lowStockAlert||0)).map(p=>p.name).join(', ')||'لا يوجد';
    container.innerHTML=`<div class="grid-2"><div class="stat-card">💰 إجمالي الأرباح: ${profit.toFixed(2)} ج.م</div><div class="stat-card">🏆 الأكثر مبيعاً: ${best}</div><div class="stat-card">⚠️ منتجات منخفضة المخزون: ${low}</div></div><button class="btn-secondary" onclick="renderReportsInside(document.getElementById('otherContent'))">تحديث</button>`;
}
window.changePassword=async()=>{
    const old=document.getElementById('oldPassword').value, new1=document.getElementById('newPassword1').value, new2=document.getElementById('newPassword2').value, msg=document.getElementById('passwordMsg');
    if(!old||!new1||!new2){ msg.style.display='block'; msg.innerText='املأ الحقول'; setTimeout(()=>msg.style.display='none',3000); return; }
    if(new1!==new2){ msg.style.display='block'; msg.innerText='غير متطابقة'; setTimeout(()=>msg.style.display='none',3000); return; }
    if(new1.length<6){ msg.style.display='block'; msg.innerText='6 أحرف كحد أدنى'; setTimeout(()=>msg.style.display='none',3000); return; }
    const user=auth.currentUser;
    try{
        const cred=firebase.auth.EmailAuthProvider.credential(user.email,old);
        await user.reauthenticateWithCredential(cred);
        await user.updatePassword(new1);
        msg.style.display='block'; msg.style.backgroundColor='#d1fae5'; msg.innerText='✅ تم التغيير'; setTimeout(()=>msg.style.display='none',3000);
    }catch(e){ msg.style.display='block'; msg.innerText=e.code==='auth/wrong-password'?'كلمة المرور القديمة خاطئة':'حدث خطأ'; setTimeout(()=>msg.style.display='none',3000); }
};

// ========== تسجيل الدخول ==========
async function handleSignedInUser(user){
    try{
        const info=await ensureUserDocument(user.uid,user.email);
        currentUserAuth=user; userData=info; currentStoreId=info.storeId; currentRole=info.role; isAdminGlobal=(currentRole==='admin');
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('dashboard').style.display='block';
        document.getElementById('storeTitle').innerHTML=`<i class="fas fa-store"></i> ${info.storeName||'المحل'}`;
        if(!isAdminGlobal) await loadStoreData();
        await ensureInvoicesCache(); await ensureMissingProductsCache();
        buildTabs();
        if(!navigator.onLine) document.getElementById('statusBar').innerHTML='📡 غير متصل';
        else document.getElementById('statusBar').innerHTML='🌐 متصل';
        setTimeout(()=>syncPendingOps(),1000);
    }catch(e){ console.error(e); await auth.signOut(); location.reload(); }
}
async function loginUser(){
    const id=document.getElementById('loginId').value.trim();
    const pwd=document.getElementById('loginPassword').value;
    if(!id||!pwd){ document.getElementById('loginError').innerText='أدخل ID وكلمة المرور'; return; }
    const email=id+"@bkalla.com";
    try{ const cred=await auth.signInWithEmailAndPassword(email,pwd); await handleSignedInUser(cred.user); }
    catch(e){ document.getElementById('loginError').innerText='فشل الدخول'; }
}
window.logoutUser=async()=>{ await auth.signOut(); location.reload(); };
auth.onAuthStateChanged(async(u)=>{ if(u) await handleSignedInUser(u); else{ document.getElementById('loginScreen').style.display='flex'; document.getElementById('dashboard').style.display='none'; } });
</script>
