<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يلا بينا افلام وبس || AMG-VID</title>
    <style>
        :root { --bg-orange: #ff6600; --primary-red: #cc0000; --caution-yellow: #ffcc00; }
        body { background-color: var(--bg-orange); font-family: sans-serif; margin: 0; text-align: center; }
        header { background: #000; padding: 20px; border-bottom: 4px solid var(--caution-yellow); }
        .logo { max-width: 150px; border: 2px solid #fff; }
        
        /* شبكة الأفلام */
        .movies-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; padding: 20px; 
        }
        
        .movie-card { 
            background: #000; border-radius: 10px; overflow: hidden; 
            border: 2px solid var(--caution-yellow); transition: 0.3s;
        }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; }
        .movie-info { padding: 10px; color: #fff; }
        .play-link { 
            background: var(--primary-red); color: #fff; padding: 8px 15px; 
            text-decoration: none; border-radius: 5px; display: block; margin-top: 5px;
        }
        .badge { background: var(--bg-orange); color: #000; padding: 2px 5px; font-size: 0.7rem; border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <img src="AMG.VID.png" alt="AMG-VID" class="logo">
        <h1 style="color:white">أحدث الأفلام والمسلسلات</h1>
    </header>

    <div class="movies-grid">
        <!-- MOVIES_START -->
        <!-- لا تلمس هذا الجزء، الروبوت سيضع الأفلام هنا تلقائياً -->
        <!-- MOVIES_END -->
    </div>

    <footer style="background:#000; color:#fff; padding:20px; margin-top:40px;">
        جميع الحقوق محفوظة لـ AMG-VID &copy; 2099
    </footer>

</body>
</html>
