<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>نظام إدارة المحلات المتكامل | Multi-Tenant POS</title>
  <!-- Firebase Compat (نفس الكود الذي أرسلته) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background: linear-gradient(145deg, #eef2ff, #e0e7ff); padding: 20px; min-height: 100vh; }
    .container { max-width: 1400px; margin: auto; background: rgba(255,255,255,0.96); border-radius: 40px; padding: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.1); }
    .login-box { text-align: center; padding: 40px 20px; max-width: 420px; margin: auto; }
    h1, h2, h3 { color: #4c1d95; }
    input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 30px; border: 1px solid #cbd5e1; font-size: 15px; transition:0.2s; }
    input:focus, select:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.2); outline: none; }
    button { width: 100%; padding: 12px; border: none; border-radius: 30px; background: linear-gradient(95deg, #2563eb, #8b5cf6); color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition:0.2s; }
    button:active { transform: scale(0.97); }
    .btn-secondary { background: #f97316; }
    .btn-danger { background: #dc2626; }
    .btn-sm { width: auto; padding: 6px 14px; margin: 3px; }
    .top-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; background: #f1f5f9; padding: 8px; border-radius: 60px; }
    .nav-btn { background: transparent; color: #334155; width: auto; padding: 8px 20px; border-radius: 40px; font-weight: 600; }
    .nav-btn.active { background: #4f46e5; color: white; box-shadow: 0 6px 12px rgba(79,70,229,0.3); }
    .card { background: white; padding: 15px; border-radius: 24px; margin: 12px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-right: 5px solid #8b5cf6; }
    .product-info { flex: 1; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 18px; }
    .stat-card { background: #f9fafb; padding: 18px; border-radius: 28px; text-align: center; border: 1px solid #e2e8f0; }
    .low-stock { background: #fee2e2; border-right-color: #ef4444; }
    .pos-row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin: 12px 0; }
    .pos-row > * { flex: 1; }
    .flash { padding: 12px; border-radius: 30px; margin: 10px 0; background: #e6f7e6; color: #166534; }
    .badge { background: #eef2ff; padding: 4px 12px; border-radius: 30px; font-size: 13px; }
    @media (max-width:700px) { .container { padding: 15px; } }
    .icon-btn { background: none; color: #4f46e5; width: auto; font-size: 18px; }
    img.product-img { width: 45px; height: 45px; object-fit: cover; border-radius: 12px; margin-left: 8px; }
  </style>
</head>
<body>
<div class="container" id="app">
  <!-- شاشة الدخول -->
  <div id="loginScreen">
    <div class="login-box">
      <h1><i class="fas fa-chalkboard-user"></i> نظام إدارة المحلات</h1>
      <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="off">
      <input type="password" id="loginPassword" placeholder="كلمة المرور">
      <button onclick="loginUser()">دخول</button>
      <div id="loginError" class="error" style="color:#dc2626; margin-top:12px;"></div>
    </div>
  </div>
  <!-- لوحة التحكم الرئيسية -->
  <div id="dashboard" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:15px;">
      <h2 id="storeTitle"><i class="fas fa-store"></i> المتحكم</h2>
      <button onclick="logoutUser()" class="btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
    <div class="top-nav" id="navTabs"></div>
    <div id="tabContent"></div>
  </div>
</div>

<script>
  // ====================== كود Firebase (كما هو في ملفك الأصلي) ==================
  const firebaseConfig = {
    apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
    authDomain: "bakkala-system.firebaseapp.com",
    projectId: "bakkala-system",
    storageBucket: "bakkala-system.firebasestorage.app",
    messagingSenderId: "807660158854",
    appId: "1:807660158854:web:c3690293a27185f07fb607"
  };
  // =========================================================================
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // متغيرات الجلسة
  let currentUserAuth = null;
  let userData = null;        // role, storeId, storeName, isActive
  let currentStoreId = null;
  let currentRole = null;
  let isAdminGlobal = false;

  // بيانات helper
  let allProducts = [];
  let allCustomers = [];
  let allSuppliers = [];

  // ======================= دوال مساعدة عامة =========================
  function showFlash(containerId, text, isError = false) {
    let el = document.getElementById(containerId);
    if(!el) {
      el = document.createElement('div');
      el.className = 'flash';
      const target = document.getElementById('tabContent');
      if(target) target.prepend(el);
      else document.getElementById('dashboard')?.prepend(el);
    }
    el.innerText = text;
    el.style.backgroundColor = isError ? '#ffe0e0' : '#e0f2fe';
    el.style.color = isError ? '#b91c1c' : '#065f46';
    setTimeout(() => el.remove(), 3500);
  }

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  // تحميل بيانات المستخدم من Firestore
  async function fetchUserData(uid) {
    const snap = await db.collection('users').doc(uid).get();
    if(!snap.exists) throw new Error('لا توجد صلاحيات للمستخدم');
    const data = snap.data();
    if(data.isActive === false) throw new Error('هذا الحساب معطل، تواصل مع المدير');
    return data;
  }

  // جلب البيانات الأساسية للمحل
  async function loadStoreData() {
    if(isAdminGlobal) return;
    if(!currentStoreId) return;
    const [prodSnap, custSnap, suppSnap] = await Promise.all([
      db.collection('products').where('storeId', '==', currentStoreId).get(),
      db.collection('customers').where('storeId', '==', currentStoreId).get(),
      db.collection('suppliers').where('storeId', '==', currentStoreId).get()
    ]);
    allProducts = prodSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    allCustomers = custSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    allSuppliers = suppSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  // بناء قائمة التبويبات حسب الدور
  function buildTabs() {
    const tabsContainer = document.getElementById('navTabs');
    let tabs = [];
    if(isAdminGlobal) {
      tabs = [{id:'adminPanel', name:'📊 لوحة التحكم'}, {id:'manageStores', name:'🏪 إدارة المحلات'}];
    } else {
      tabs = [
        {id:'pos', name:'💰 نقطة البيع'},
        {id:'products', name:'📦 المنتجات'},
        {id:'customers', name:'👥 العملاء'},
        {id:'suppliers', name:'🏭 الموردين'},
        {id:'purchaseInvoices', name:'📥 فواتير الشراء'},
        {id:'inventory', name:'📦 المخزون والحركات'},
        {id:'reports', name:'📈 التقارير'}
      ];
    }
    tabsContainer.innerHTML = tabs.map(t => `<button class="nav-btn" data-tab="${t.id}">${t.name}</button>`).join('');
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    if(tabs.length) switchTab(tabs[0].id);
  }

  async function switchTab(tabId) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
    if(activeBtn) activeBtn.classList.add('active');
    const container = document.getElementById('tabContent');
    if(isAdminGlobal) {
      if(tabId === 'adminPanel') await renderAdminDashboard(container);
      else if(tabId === 'manageStores') await renderManageStores(container);
    } else {
      await loadStoreData(); // تحديث البيانات قبل كل تبويب
      if(tabId === 'pos') await renderPosTab(container);
      else if(tabId === 'products') await renderProductsTab(container);
      else if(tabId === 'customers') await renderCustomersTab(container);
      else if(tabId === 'suppliers') await renderSuppliersTab(container);
      else if(tabId === 'purchaseInvoices') await renderPurchaseInvoicesTab(container);
      else if(tabId === 'inventory') await renderInventoryTab(container);
      else if(tabId === 'reports') await renderReportsTab(container);
      else container.innerHTML = '<div class="flash">جاري التحميل...</div>';
    }
  }

  // ========================== لوحة تحكم المشرف ==========================
  async function renderAdminDashboard(container) {
    container.innerHTML = '<div class="flash">جمع بيانات المحلات...</div>';
    const usersSnap = await db.collection('users').where('role', 'in', ['owner','manager','cashier']).get();
    let storesMap = new Map();
    for(const doc of usersSnap.docs) {
      const data = doc.data();
      const sid = data.storeId;
      if(!sid) continue;
      if(!storesMap.has(sid)) storesMap.set(sid, { storeName: data.storeName || sid, users: [], totalSales: 0 });
      storesMap.get(sid).users.push({ uid: doc.id, email: data.email, role: data.role, isActive: data.isActive });
    }
    // حساب إجمالي المبيعات لكل متجر
    for(let [sid, store] of storesMap.entries()) {
      const salesSnap = await db.collection('sales').where('storeId', '==', sid).get();
      let total = 0;
      salesSnap.docs.forEach(d => total += d.data().total || 0);
      store.totalSales = total;
    }
    let html = `<h3><i class="fas fa-chart-line"></i> نظرة عامة على المحلات</h3><div class="grid-2">`;
    for(let [sid, store] of storesMap.entries()) {
      html += `<div class="stat-card"><strong>🏬 ${escapeHtml(store.storeName)}</strong><br>💰 إجمالي المبيعات: ${store.totalSales.toFixed(2)} ج.م<br>👥 مستخدمين: ${store.users.length}<br>
      <button class="btn-sm" onclick="toggleStoreStatus('${sid}')">تعطيل/تفعيل المحل</button></div>`;
    }
    html += `</div>`;
    container.innerHTML = html;
  }

  async function renderManageStores(container) {
    const usersSnap = await db.collection('users').get();
    let stores = {};
    usersSnap.docs.forEach(doc => {
      const data = doc.data();
      if(data.role === 'admin') return;
      const sid = data.storeId;
      if(sid) {
        if(!stores[sid]) stores[sid] = { name: data.storeName || sid, users: [] };
        stores[sid].users.push({ uid: doc.id, email: data.email, role: data.role, active: data.isActive });
      }
    });
    let html = `<h3>🔧 إدارة المستخدمين والمحلات</h3>`;
    for(let [sid, store] of Object.entries(stores)) {
      html += `<div class="card"><strong>🏪 ${escapeHtml(store.name)}</strong><div>`;
      store.users.forEach(u => {
        html += `<div class="badge" style="margin:5px;">${u.email} (${u.role}) ${u.active ? '✅' : '❌'}
        <button class="btn-sm icon-btn" onclick="toggleUserStatus('${u.uid}')">🔄 تبديل الحالة</button></div>`;
      });
      html += `</div></div>`;
    }
    container.innerHTML = html;
  }

  window.toggleUserStatus = async (uid) => {
    const ref = db.collection('users').doc(uid);
    const doc = await ref.get();
    const newStatus = !doc.data().isActive;
    await ref.update({ isActive: newStatus });
    showFlash('tabContent', `تم ${newStatus ? 'تفعيل' : 'تعطيل'} المستخدم`, false);
    if(isAdminGlobal) await renderManageStores(document.getElementById('tabContent'));
  };
  window.toggleStoreStatus = async (storeId) => { alert('يمكن تعطيل المستخدمين بدل المحل'); };

  // ========================== نقطة البيع (POS) ==========================
  let cart = []; // لتمكين سلة متعددة المنتجات
  async function renderPosTab(container) {
    cart = [];
    let customersOpt = `<option value="">بدون عميل</option>` + allCustomers.map(c => `<option value="${c.id}" data-debt="${c.debt||0}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
    container.innerHTML = `
      <div style="background:#f8fafc; border-radius:32px; padding:20px;">
        <h3><i class="fas fa-cash-register"></i> بيع سريع (باركود/اسم)</h3>
        <div class="pos-row">
          <input type="text" id="searchProductInput" placeholder="🔍 باركود أو اسم المنتج" oninput="searchProductLive(this.value)">
          <select id="productSelect" onchange="addToCartFromSelect()"><option>اختر منتج</option></select>
          <input type="number" id="cartQuantity" placeholder="الكمية" value="1" style="width:100px;">
          <button onclick="addToCartFromSelect()" class="btn-sm" style="width:auto;">➕ أضف للسلة</button>
        </div>
        <div id="cartItems"></div>
        <div class="pos-row">
          <select id="customerId">${customersOpt}</select>
          <select id="paymentMethod"><option value="cash">كاش</option><option value="visa">فيزا</option><option value="credit">آجل</option></select>
          <input type="number" id="paidAmount" placeholder="المدفوع" oninput="calculateChangeTotal()">
          <input type="text" id="changeAmount" placeholder="الباقي" readonly>
        </div>
        <div style="font-size:24px; font-weight:bold;" id="totalAmount">الإجمالي: 0 ج.م</div>
        <button onclick="confirmSale()" style="background:#10b981; margin-top:10px;"><i class="fas fa-check-circle"></i> إتمام البيع</button>
        <div id="posFlash"></div>
      </div>
    `;
    window.searchProductLive = (val) => {
      const filtered = allProducts.filter(p => (p.barcode && p.barcode.includes(val)) || p.name.includes(val));
      const select = document.getElementById('productSelect');
      select.innerHTML = filtered.map(p => `<option value="${p.id}" data-price="${p.priceRetail||p.price}" data-name="${escapeHtml(p.name)}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('');
      if(filtered.length===0) select.innerHTML = '<option>لا يوجد</option>';
    };
    window.addToCartFromSelect = () => {
      const select = document.getElementById('productSelect');
      const prodId = select.value;
      if(!prodId || prodId === 'لا يوجد') return;
      const qty = parseInt(document.getElementById('cartQuantity').value);
      if(qty<=0) return;
      const product = allProducts.find(p=>p.id===prodId);
      if(!product || product.qty < qty) { showFlash('posFlash', 'كمية غير متوفرة', true); return; }
      const existing = cart.find(item => item.id === prodId);
      if(existing) existing.qty += qty;
      else cart.push({ id: prodId, name: product.name, price: product.priceRetail||product.price, qty });
      renderCart();
    };
    window.renderCart = () => {
      const cartDiv = document.getElementById('cartItems');
      let total = 0;
      let html = `<h4>السلة الحالية</h4>`;
      cart.forEach((item, idx) => {
        total += item.price * item.qty;
        html += `<div class="card" style="padding:10px;">${item.name} x ${item.qty} = ${(item.price*item.qty).toFixed(2)} ج.م <button class="btn-sm btn-danger" onclick="removeFromCart(${idx})">حذف</button></div>`;
      });
      cartDiv.innerHTML = html;
      document.getElementById('totalAmount').innerHTML = `الإجمالي: ${total.toFixed(2)} ج.م`;
      calculateChangeTotal();
    };
    window.removeFromCart = (idx) => { cart.splice(idx,1); renderCart(); };
    window.calculateChangeTotal = () => {
      let total = cart.reduce((s,i)=> s + (i.price*i.qty),0);
      let paid = parseFloat(document.getElementById('paidAmount').value) || 0;
      let change = paid - total;
      document.getElementById('changeAmount').value = change > 0 ? change.toFixed(2) : 0;
    };
    renderCart();
  }

  async function confirmSale() {
    if(cart.length === 0) return showFlash('posFlash', 'السلة فارغة', true);
    const paymentMethod = document.getElementById('paymentMethod').value;
    const customerId = document.getElementById('customerId').value || null;
    const paidAmount = parseFloat(document.getElementById('paidAmount').value) || 0;
    let totalAmount = cart.reduce((s,i)=> s + (i.price*i.qty),0);
    if(paymentMethod !== 'credit' && paidAmount < totalAmount) return showFlash('posFlash', 'المدفوع أقل من الإجمالي', true);
    let change = (paymentMethod !== 'credit') ? paidAmount - totalAmount : 0;
    try {
      await db.runTransaction(async (t) => {
        // تحديث كميات المنتجات
        for(let item of cart) {
          const prodRef = db.collection('products').doc(item.id);
          const prodSnap = await t.get(prodRef);
          if(prodSnap.data().qty < item.qty) throw new Error(`المنتج ${item.name} نفدت كميته`);
          t.update(prodRef, { qty: prodSnap.data().qty - item.qty });
        }
        // تسجيل المبيعات لكل منتج (أو يمكن تجميعها في فاتورة واحدة)
        for(let item of cart) {
          const saleRef = db.collection('sales').doc();
          t.set(saleRef, {
            productId: item.id, productName: item.name, quantity: item.qty, unitPrice: item.price,
            total: item.price * item.qty, paymentMethod, customerId, paidAmount, changeAmount: change,
            storeId: currentStoreId, userId: currentUserAuth.uid, date: firebase.firestore.FieldValue.serverTimestamp()
          });
          // حركة مخزنية
          const invRef = db.collection('inventoryTransactions').doc();
          t.set(invRef, { type: 'sale', productId: item.id, quantity: -item.qty, storeId: currentStoreId, date: firebase.firestore.FieldValue.serverTimestamp() });
        }
        // تحديث دين العميل إذا كان آجل
        if(customerId && paymentMethod === 'credit') {
          const custRef = db.collection('customers').doc(customerId);
          const custSnap = await t.get(custRef);
          let newDebt = (custSnap.data().debt||0) + totalAmount;
          t.update(custRef, { debt: newDebt });
        }
      });
      showFlash('posFlash', `✅ بيع ناجح بقيمة ${totalAmount} ج.م`, false);
      printReceipt(cart, totalAmount, paymentMethod, customerId, change);
      await loadStoreData();
      renderPosTab(document.getElementById('tabContent'));
    } catch(e) { showFlash('posFlash', e.message, true); }
  }

  function printReceipt(cartItems, total, method, customerId, change) {
    let win = window.open();
    let customerName = "نقدي";
    if(customerId) {
      let cust = allCustomers.find(c=>c.id===customerId);
      if(cust) customerName = cust.name;
    }
    win.document.write(`
      <html dir="rtl"><head><style>body{font-family:Tajawal; padding:20px;} table{width:100%; border-collapse:collapse;} th,td{border-bottom:1px solid #ccc; padding:8px;}</style></head>
      <body><h2>فاتورة شراء</h2><p>العميل: ${customerName}</p><p>التاريخ: ${new Date().toLocaleString('ar-EG')}</p>
      <table><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>
      ${cartItems.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.price}</td><td>${(i.qty*i.price).toFixed(2)}</td></tr>`).join('')}
    </table><h3>الإجمالي: ${total.toFixed(2)} ج.م</h3><p>طريقة الدفع: ${method}</p><p>الباقي: ${change>0?change.toFixed(2):0}</p>
      <button onclick="window.print()">🖨️ طباعة</button></body></html>
    `);
  }

  // ========================== إدارة المنتجات ==========================
  async function renderProductsTab(container) {
    await loadStoreData();
    let canEdit = (currentRole === 'owner' || currentRole === 'manager');
    let html = `
      <h3>➕ إضافة منتج جديد</h3>
      <div class="grid-2">
        <input id="prodName" placeholder="اسم المنتج*"> <input id="prodBarcode" placeholder="باركود">
        <input id="prodPriceRetail" type="number" placeholder="سعر القطاعي"> <input id="prodPriceWholesale" type="number" placeholder="سعر الجملة">
        <input id="prodCost" type="number" placeholder="سعر الشراء (للأرباح)"> <select id="prodUnit"><option>قطعة</option><option>كيلو</option></select>
        <input id="prodQty" type="number" placeholder="الكمية"> <input id="prodLowStock" type="number" placeholder="حد التنبيه">
        <input id="prodImage" placeholder="رابط الصورة (اختياري)"> <button onclick="addNewProduct()">إضافة منتج</button>
      </div>
      <h3>📋 جميع المنتجات</h3><div id="productsListArea"></div>
    `;
    container.innerHTML = html;
    renderProductsList();
  }

  async function renderProductsList() {
    const area = document.getElementById('productsListArea');
    if(!area) return;
    let html = '';
    for(let p of allProducts) {
      let lowClass = (p.qty <= (p.lowStockAlert||0)) ? 'low-stock' : '';
      let canEdit = (currentRole === 'owner' || currentRole === 'manager');
      html += `<div class="card ${lowClass}">
        <div class="product-info">
          ${p.imageUrl ? `<img class="product-img" src="${p.imageUrl}">` : ''}
          <strong>${escapeHtml(p.name)}</strong> (باركود: ${p.barcode||'-'})<br>
          قطاعي: ${p.priceRetail} | جملة: ${p.priceWholesale} | الشراء: ${p.cost||0}<br>
          الكمية: ${p.qty} ${p.unit} | التنبيه: ${p.lowStockAlert||0}
        </div>
        ${canEdit ? `<div><button class="btn-sm" onclick="editProduct('${p.id}')">✏️</button>
        <button class="btn-sm btn-danger" onclick="deleteProductById('${p.id}')">🗑️</button></div>` : ''}
      </div>`;
    }
    area.innerHTML = html || '<p>لا توجد منتجات حتى الآن</p>';
  }

  window.addNewProduct = async () => {
    let name = document.getElementById('prodName').value.trim();
    if(!name) return showFlash('productsListArea','الاسم مطلوب',true);
    let data = {
      name, barcode: document.getElementById('prodBarcode').value, storeId: currentStoreId,
      priceRetail: parseFloat(document.getElementById('prodPriceRetail').value) || 0,
      priceWholesale: parseFloat(document.getElementById('prodPriceWholesale').value) || 0,
      cost: parseFloat(document.getElementById('prodCost').value) || 0,
      unit: document.getElementById('prodUnit').value, qty: parseInt(document.getElementById('prodQty').value)||0,
      lowStockAlert: parseInt(document.getElementById('prodLowStock').value)||0,
      imageUrl: document.getElementById('prodImage').value, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection('products').add(data);
    showFlash('productsListArea','تمت الإضافة');
    renderProductsTab(document.getElementById('tabContent'));
  };
  window.deleteProductById = async (id) => {
    if(!confirm('حذف المنتج نهائياً؟')) return;
    await db.collection('products').doc(id).delete();
    renderProductsTab(document.getElementById('tabContent'));
  };
  window.editProduct = async (id) => {
    let newName = prompt('اسم جديد');
    if(!newName) return;
    let newPrice = parseFloat(prompt('سعر قطاعي جديد'));
    let newQty = parseInt(prompt('الكمية الجديدة'));
    await db.collection('products').doc(id).update({ name: newName, priceRetail: newPrice, qty: newQty });
    renderProductsTab(document.getElementById('tabContent'));
  };

  // ========================== العملاء والموردين ==========================
  async function renderCustomersTab(container) {
    await loadStoreData();
    container.innerHTML = `
      <h3>👤 إضافة عميل</h3><div class="pos-row"><input id="custName" placeholder="الاسم"><input id="custPhone" placeholder="الهاتف"><button onclick="addCustomer()">إضافة</button></div>
      <h3>قائمة العملاء</h3><div id="customersListDiv"></div>
    `;
    const listDiv = document.getElementById('customersListDiv');
    listDiv.innerHTML = allCustomers.map(c => `<div class="card"><strong>${escapeHtml(c.name)}</strong> - هاتف: ${c.phone||'-'} | دين: ${c.debt||0} ج.م 
    <button class="btn-sm" onclick="recordPayment('${c.id}')">تسديد</button> <button class="btn-sm" onclick="showCustomerPurchases('${c.id}')">سجل مشتريات</button></div>`).join('');
  }
  window.addCustomer = async () => {
    let name = document.getElementById('custName').value.trim();
    if(!name) return;
    await db.collection('customers').add({ name, phone: document.getElementById('custPhone').value, storeId: currentStoreId, debt: 0 });
    renderCustomersTab(document.getElementById('tabContent'));
  };
  window.recordPayment = async (custId) => {
    let amount = parseFloat(prompt('المبلغ المسدد'));
    if(isNaN(amount)) return;
    const custRef = db.collection('customers').doc(custId);
    const doc = await custRef.get();
    let newDebt = (doc.data().debt||0) - amount;
    await custRef.update({ debt: newDebt < 0 ? 0 : newDebt });
    renderCustomersTab(document.getElementById('tabContent'));
  };
  window.showCustomerPurchases = async (custId) => {
    const salesSnap = await db.collection('sales').where('customerId','==',custId).where('storeId','==',currentStoreId).orderBy('date','desc').limit(10).get();
    let msg = 'آخر 10 مشتريات:\n';
    salesSnap.docs.forEach(d => { let s=d.data(); msg+=`${s.productName} x ${s.quantity} = ${s.total} ج.م\n`; });
    alert(msg);
  };
  // الموردين
  async function renderSuppliersTab(container) {
    await loadStoreData();
    container.innerHTML = `<h3>🏭 إدارة الموردين</h3><div class="pos-row"><input id="supName" placeholder="اسم المورد"><input id="supPhone" placeholder="الهاتف"><button onclick="addSupplier()">إضافة</button></div>
    <div id="suppliersList"></div>`;
    const listDiv = document.getElementById('suppliersList');
    listDiv.innerHTML = allSuppliers.map(s => `<div class="card"><strong>${escapeHtml(s.name)}</strong> - هاتف: ${s.phone||'-'} | مديونية: ${s.debt||0} ج.م
    <button class="btn-sm" onclick="paySupplier('${s.id}')">تسديد</button></div>`).join('');
  }
  window.addSupplier = async () => {
    let name = document.getElementById('supName').value.trim();
    if(!name) return;
    await db.collection('suppliers').add({ name, phone: document.getElementById('supPhone').value, storeId: currentStoreId, debt: 0 });
    renderSuppliersTab(document.getElementById('tabContent'));
  };
  window.paySupplier = async (supId) => {
    let amount = parseFloat(prompt('المبلغ المدفوع للمورد'));
    if(!amount) return;
    const supRef = db.collection('suppliers').doc(supId);
    const doc = await supRef.get();
    let newDebt = (doc.data().debt||0) - amount;
    await supRef.update({ debt: newDebt<0?0:newDebt });
    renderSuppliersTab(document.getElementById('tabContent'));
  };
  // فواتير الشراء
  async function renderPurchaseInvoicesTab(container) {
    await loadStoreData();
    container.innerHTML = `<h3>➕ إضافة فاتورة شراء</h3><div><select id="invoiceSupplier"><option>اختر مورد</option>${allSuppliers.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select>
    <div id="purchaseItemsArea"><div class="pos-row"><input placeholder="اسم المنتج" id="pName"><input placeholder="الكمية" id="pQty" type="number"><input placeholder="سعر الشراء" id="pPrice"><button onclick="addPurchaseItem()">إضافة منتج</button></div></div>
    <div id="purchaseItemsList"></div><button onclick="savePurchaseInvoice()">حفظ الفاتورة</button></div><h3>📃 فواتير سابقة</h3><div id="previousInvoices"></div>`;
    window.purchaseTempItems = [];
    window.addPurchaseItem = () => {
      let name = document.getElementById('pName').value.trim();
      let qty = parseInt(document.getElementById('pQty').value);
      let price = parseFloat(document.getElementById('pPrice').value);
      if(!name || qty<=0 || price<=0) return;
      purchaseTempItems.push({ name, qty, price });
      refreshPurchaseList();
      document.getElementById('pName').value='';
    };
    window.refreshPurchaseList = () => {
      let listDiv = document.getElementById('purchaseItemsList');
      listDiv.innerHTML = purchaseTempItems.map((it,i)=>`<div class="card">${it.name} x ${it.qty} بسعر ${it.price} = ${(it.qty*it.price).toFixed(2)} <button class="btn-sm" onclick="removePurchaseItem(${i})">❌</button></div>`).join('');
    };
    window.removePurchaseItem = (idx) => { purchaseTempItems.splice(idx,1); refreshPurchaseList(); };
    window.savePurchaseInvoice = async () => {
      let supplierId = document.getElementById('invoiceSupplier').value;
      if(!supplierId || purchaseTempItems.length===0) return alert('اختر مورد وأضف منتجات');
      let total = purchaseTempItems.reduce((s,i)=> s + (i.qty*i.price),0);
      let invoiceRef = db.collection('purchaseInvoices').doc();
      await db.runTransaction(async (t) => {
        t.set(invoiceRef, { supplierId, items: purchaseTempItems, total, date: firebase.firestore.FieldValue.serverTimestamp(), storeId: currentStoreId });
        for(let item of purchaseTempItems) {
          // البحث عن منتج موجود بنفس الاسم في نفس المتجر
          let existing = allProducts.find(p => p.name === item.name);
          if(existing) {
            let newQty = existing.qty + item.qty;
            let newCost = (existing.cost*existing.qty + item.price*item.qty)/(existing.qty+item.qty);
            t.update(db.collection('products').doc(existing.id), { qty: newQty, cost: newCost });
          } else {
            let newProdRef = db.collection('products').doc();
            t.set(newProdRef, { name: item.name, qty: item.qty, cost: item.price, priceRetail: item.price*1.3, priceWholesale: item.price*1.1, storeId: currentStoreId, unit: 'قطعة' });
          }
          // تسجيل حركة وارد
          let invRef = db.collection('inventoryTransactions').doc();
          t.set(invRef, { type: 'purchase', productName: item.name, quantity: item.qty, storeId: currentStoreId, date: firebase.firestore.FieldValue.serverTimestamp() });
        }
        // تحديث دين المورد
        const supRef = db.collection('suppliers').doc(supplierId);
        const supSnap = await t.get(supRef);
        let newDebt = (supSnap.data().debt||0) + total;
        t.update(supRef, { debt: newDebt });
      });
      alert('تمت فاتورة الشراء والمخزون');
      renderPurchaseInvoicesTab(document.getElementById('tabContent'));
    };
    // عرض الفواتير السابقة
    const invSnap = await db.collection('purchaseInvoices').where('storeId','==',currentStoreId).orderBy('date','desc').limit(20).get();
    let invHtml = '';
    invSnap.docs.forEach(d => { let inv = d.data(); invHtml += `<div class="card">مورد: ${inv.supplierId} - الإجمالي: ${inv.total} ج.م - التاريخ: ${inv.date?.toDate().toLocaleString()}</div>`; });
    document.getElementById('previousInvoices').innerHTML = invHtml || '<p>لا توجد فواتير</p>';
  }
  // المخزون
  async function renderInventoryTab(container) {
    const invSnap = await db.collection('inventoryTransactions').where('storeId','==',currentStoreId).orderBy('date','desc').limit(100).get();
    let html = `<h3>📦 حركات المخزون (وارد/صادر)</h3>`;
    invSnap.docs.forEach(d => {
      let t = d.data();
      html += `<div class="card">${t.type === 'purchase' ? '➕ شراء' : '➖ بيع'} | المنتج: ${t.productName||t.productId} | الكمية: ${t.quantity} | ${t.date?.toDate().toLocaleString()}</div>`;
    });
    container.innerHTML = html;
  }
  // التقارير الذكية
  async function renderReportsTab(container) {
    await loadStoreData();
    // حساب الأرباح من المبيعات (بناءً على cost)
    const salesSnap = await db.collection('sales').where('storeId','==',currentStoreId).get();
    let totalProfit = 0;
    let productSalesCount = {};
    for(const doc of salesSnap.docs) {
      let sale = doc.data();
      let product = allProducts.find(p=>p.id===sale.productId);
      let cost = product?.cost || 0;
      let profit = sale.total - (cost * sale.quantity);
      totalProfit += profit;
      productSalesCount[sale.productName] = (productSalesCount[sale.productName] || 0) + sale.quantity;
    }
    let bestProduct = Object.keys(productSalesCount).reduce((a,b)=> productSalesCount[a] > productSalesCount[b] ? a : b, 'لا يوجد');
    let lowProducts = allProducts.filter(p=>p.qty <= (p.lowStockAlert||0)).map(p=>p.name).join(', ');
    container.innerHTML = `<div class="grid-2">
      <div class="stat-card">💰 إجمالي الأرباح: ${totalProfit.toFixed(2)} ج.م</div>
      <div class="stat-card">🏆 أفضل منتج مبيعاً: ${bestProduct}</div>
      <div class="stat-card">⚠️ منتجات منخفضة المخزون: ${lowProducts || 'لا يوجد'}</div>
      <div class="stat-card">📦 إجمالي المنتجات: ${allProducts.length}</div>
    </div><button class="btn-secondary" onclick="renderReportsTab(document.getElementById('tabContent'))">تحديث</button>`;
  }

  // ========================== إدارة الجلسة والدخول ==========================
  async function loginUser() {
    const email = document.getElementById('loginEmail').value;
    const pwd = document.getElementById('loginPassword').value;
    try {
      const cred = await auth.signInWithEmailAndPassword(email, pwd);
      const user = cred.user;
      const userInfo = await fetchUserData(user.uid);
      currentUserAuth = user;
      userData = userInfo;
      currentStoreId = userInfo.storeId;
      currentRole = userInfo.role;
      isAdminGlobal = (currentRole === 'admin');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('storeTitle').innerHTML = `<i class="fas fa-store"></i> ${userInfo.storeName || 'المحل'} (${currentRole})`;
      if(!isAdminGlobal) await loadStoreData();
      buildTabs();
    } catch(e) {
      document.getElementById('loginError').innerText = e.message;
    }
  }
  window.logoutUser = async () => { await auth.signOut(); location.reload(); };
  auth.onAuthStateChanged((u) => {
    if(!u) { document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('dashboard').style.display = 'none'; }
  });
</script>
