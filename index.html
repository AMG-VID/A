<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة البقالة الذكي</title>
  
  <!-- Firebase SDKs (نسخة التوافق لسهولة التعامل) -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    /* التنسيقات الخاصة بك مع تحسينات بسيطة */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background: #f0f7f0; padding: 20px; color: #333; }
    .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; padding: 24px; min-height: 500px; }
    
    /* شاشة الدخول */
    .login-box { text-align: center; padding: 40px 20px; }
    .login-box h1 { color: #2e7d32; margin-bottom: 40px; font-size: 32px; }
    .input-group { margin-bottom: 24px; }
    .input-group input { width: 100%; padding: 16px; border: 1px solid #c8e6c9; border-radius: 48px; font-size: 18px; text-align: center; }
    
    button { background: #2e7d32; color: white; border: none; padding: 14px 28px; border-radius: 48px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; }
    button:hover { background: #1b5e20; }
    .error-msg { color: #d32f2f; margin-top: 16px; font-size: 15px; font-weight: bold; }

    /* لوحة التحكم */
    .top-nav { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    .nav-btn { background: #e8f5e9; color: #2e7d32; padding: 10px 20px; border-radius: 20px; font-size: 14px; flex: 1; }
    .nav-btn.active { background: #2e7d32; color: white; }
    .logout-btn { background: #ffebee; color: #c62828; width: auto; font-size: 14px; padding: 8px 15px; }

    /* النماذج والبطاقات */
    .form-add { background: #f9fff9; padding: 20px; border-radius: 20px; border: 1px solid #c8e6c9; margin-bottom: 20px; }
    .form-add input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; }
    .card { background: white; border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .product-info b { color: #2e7d32; font-size: 18px; }
    .qty-badge { background: #2e7d32; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <!-- شاشة الدخول -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>📍 مدير البقالة الذكي</h1>
      <div class="input-group">
        <input type="text" id="userId" placeholder="أدخل رقم المعرف (ID) مثلاً: 100">
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="كلمة المرور">
      </div>
      <button id="loginBtn">تسجيل الدخول للنظام</button>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <!-- لوحة التحكم (مخفية في البداية) -->
  <div id="dashboard" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3>مرحباً بك في لوحة التحكم</h3>
      <button id="logoutBtn" class="logout-btn">تسجيل خروج</button>
    </div>
    
    <div class="top-nav">
      <button class="nav-btn active" id="btnProducts" onclick="showTab('products')">📦 السلع</button>
      <button class="nav-btn" id="btnSales" onclick="showTab('sales')">💰 المبيعات</button>
      <button class="nav-btn" id="btnReports" onclick="showTab('reports')">📊 التقارير</button>
    </div>

    <!-- تبويب المنتجات -->
    <div id="tabProducts">
      <div class="form-add">
        <h4 style="margin-bottom:10px">➕ إضافة منتج جديد</h4>
        <input type="text" id="prodName" placeholder="اسم السلعة">
        <input type="number" id="prodPrice" placeholder="سعر البيع">
        <input type="number" id="prodQty" placeholder="الكمية المتوفرة">
        <button id="addProductBtn">حفظ في قاعدة البيانات</button>
      </div>
      
      <div id="productsList">
        <p style="text-align:center; color:#999;">جاري تحميل المنتجات...</p>
      </div>
    </div>

    <!-- تبويبات فارغة حالياً -->
    <div id="tabSales" style="display:none;"><h3>سجل المبيعات قريباً...</h3></div>
    <div id="tabReports" style="display:none;"><h3>التقارير الإحصائية قريباً...</h3></div>
  </div>
</div>

<script>
  // 1. إعدادات Firebase الخاصة بمشروعك (نظام باكالا)
  const firebaseConfig = {
    apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
    authDomain: "://firebaseapp.com",
    projectId: "bakkala-system",
    storageBucket: "bakkala-system.firebasestorage.app",
    messagingSenderId: "807660158854",
    appId: "1:807660158854:web:c3690293a27185f07fb607"
  };

  // تهيئة الخدمات
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // --- وظيفة تسجيل الدخول ---
  document.getElementById('loginBtn').onclick = () => {
    const id = document.getElementById('userId').value;
    const pass = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');

    if(!id || !pass) {
      errorDiv.innerText = "أدخل الـ ID والباسورد يا هندسة";
      return;
    }

    // تحويل الـ ID لإيميل وهمي (بناءً على ما سجلته في Firebase)
    const email = id + "@bakkala.com"; 

    auth.signInWithEmailAndPassword(email, pass)
      .then(() => {
        errorDiv.innerText = "";
        console.log("تم الدخول!");
      })
      .catch((error) => {
        errorDiv.innerText = "خطأ: المعرف أو الباسورد غلط، أو لسه مضافش!";
      });
  };

  // --- مراقبة حالة المستخدم (دخول/خروج) ---
  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadProducts(user.uid); // تحميل بيانات هذا التاجر فقط
    } else {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  // --- إضافة منتج لقاعدة البيانات ---
  document.getElementById('addProductBtn').onclick = () => {
    const user = auth.currentUser;
    const name = document.getElementById('prodName').value;
    const price = document.getElementById('prodPrice').value;
    const qty = document.getElementById('prodQty').value;

    if(name && price && qty) {
      // حفظ المنتج تحت "مجلد" اليوزر الحالي (عشان كل واحد يشوف بياناته بس)
      db.collection("users").doc(user.uid).collection("products").add({
        name: name,
        price: parseFloat(price),
        qty: parseInt(qty),
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        // مسح الحقول بعد الإضافة
        document.getElementById('prodName').value = "";
        document.getElementById('prodPrice').value = "";
        document.getElementById('prodQty').value = "";
      });
    } else {
      alert("كمل بيانات المنتج الأول!");
    }
  };

  // --- جلب وعرض المنتجات في الوقت الفعلي (Real-time) ---
  function loadProducts(uid) {
    db.collection("users").doc(uid).collection("products").orderBy("timestamp", "desc")
      .onSnapshot(snapshot => {
        let html = "";
        snapshot.forEach(doc => {
          const item = doc.data();
          html += `
            <div class="card">
              <div class="product-info">
                <b>${item.name}</b><br>
                <small>السعر: ${item.price} ج.م</small>
              </div>
              <div class="qty-badge">الكمية: ${item.qty}</div>
            </div>
          `;
        });
        document.getElementById('productsList').innerHTML = html || "<p style='text-align:center'>لا يوجد سلع مضافة بعد</p>";
      });
  }

  // --- التنقل بين التبويبات ---
  window.showTab = function(tabName) {
    document.getElementById('tabProducts').style.display = tabName === 'products' ? 'block' : 'none';
    document.getElementById('tabSales').style.display = tabName === 'sales' ? 'block' : 'none';
    document.getElementById('tabReports').style.display = tabName === 'reports' ? 'block' : 'none';
    
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
  }

  // تسجيل الخروج
  document.getElementById('logoutBtn').onclick = () => auth.signOut();
</script>

</body>
</html>
