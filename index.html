<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مدير البقالة - نظام SaaS متطور</title>

  <!-- Firebase Compat ONLY -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal'; }
    body { background:#f0f7f0; padding:20px; }

    .container {
      max-width:700px;
      margin:auto;
      background:white;
      border-radius:30px;
      padding:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.05);
    }

    .login-box { text-align:center; padding:40px 20px; }
    .login-box h1 { color:#2e7d32; margin-bottom:30px; }

    input {
      width:100%;
      padding:14px;
      margin:10px 0;
      border-radius:30px;
      border:1px solid #c8e6c9;
      font-size:16px;
    }

    button {
      width:100%;
      padding:14px;
      border:none;
      border-radius:30px;
      background:#2e7d32;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover { background:#1b5e20; }

    .error { color:red; margin-top:10px; }

    .top-nav {
      display:flex;
      justify-content:center;
      gap:10px;
      margin-bottom:20px;
    }

    .nav-btn {
      padding:10px 20px;
      border-radius:30px;
      border:none;
      background:#eee;
      cursor:pointer;
    }

    .nav-btn.active { background:#2e7d32; color:white; }

    .card {
      background:#fff;
      padding:15px;
      border-radius:20px;
      margin:10px 0;
      box-shadow:0 3px 10px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>📍 مدير البقالة</h1>

      <input id="userId" placeholder="ID">
      <input id="password" type="password" placeholder="Password">

      <button onclick="login()">تسجيل الدخول</button>
      <div class="error" id="error"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none;">

    <div class="top-nav">
      <button class="nav-btn active">📦 المنتجات</button>
      <button class="nav-btn">💰 المبيعات</button>
      <button class="nav-btn">📊 التقارير</button>
    </div>

    <h3>إضافة منتج</h3>

    <input id="pname" placeholder="اسم المنتج">
    <input id="pprice" type="number" placeholder="سعر البيع">
    <input id="pqty" type="number" placeholder="الكمية">

    <button onclick="addProduct()">إضافة</button>

    <h3 style="margin-top:20px;">المنتجات</h3>
    <div id="products"></div>

    <button style="margin-top:20px;background:#999" onclick="logout()">تسجيل خروج</button>

  </div>

</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
    authDomain: "bakkala-system.firebaseapp.com",
    projectId: "bakkala-system",
    storageBucket: "bakkala-system.firebasestorage.app",
    messagingSenderId: "807660158854",
    appId: "1:807660158854:web:c3690293a27185f07fb607"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;

  // LOGIN
  function login() {
    const id = document.getElementById("userId").value.trim();
    const pass = document.getElementById("password").value;

    if (!id || !pass) return;

    const email = id + "@bkalla.com";

    auth.signInWithEmailAndPassword(email, pass)
      .then(res => {
        currentUser = res.user;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadProducts();
      })
      .catch(err => {
        document.getElementById("error").innerText = "بيانات غلط";
      });
  }

  // LOGOUT
  function logout() {
    auth.signOut().then(() => {
      location.reload();
    });
  }

  // ADD PRODUCT
  function addProduct() {
    const name = document.getElementById("pname").value;
    const price = document.getElementById("pprice").value;
    const qty = document.getElementById("pqty").value;

    if (!name) return;

    db.collection("products").add({
      name,
      price,
      qty,
      userId: currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    loadProducts();
  }

  // LOAD PRODUCTS
  function loadProducts() {
    db.collection("products")
      .where("userId", "==", currentUser.uid)
      .get()
      .then(snapshot => {
        let html = "";

        snapshot.forEach(doc => {
          const p = doc.data();

          html += `
            <div class="card">
              <h4>${p.name}</h4>
              <p>💰 ${p.price}</p>
              <p>📦 ${p.qty}</p>
            </div>
          `;
        });

        document.getElementById("products").innerHTML = html;
      });
  }

  // AUTO LOGIN CHECK
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadProducts();
    }
  });

</script>

</body>
</html>
