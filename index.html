<script>
/* =====================================================================
   PWA  –  Service Worker  (Offline-First, Cache Everything)
   ===================================================================== */
(function setupPWA() {
    const manifestObj = {
        "name": "ManaraTech", "short_name": "ManaraTech", "start_url": ".",
        "display": "standalone", "theme_color": "#4c1d95", "background_color": "#eef2ff",
        "icons": [{ "src": "Icon.png", "sizes": "any", "type": "image/jpeg" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    let manifestLink = document.querySelector('link[rel="manifest"]');
    if (!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
    manifestLink.href = manifestURL;

    /* Service Worker – Cache-First with Network Fallback */
    const swCode = `
const CACHE_NAME = 'manara-v5';
const STATIC_URLS = [
    './', './index.html', 'Icon.png',
    'https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap',
    'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css',
    'https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js',
    'https://cdn.jsdelivr.net/npm/idb@8.0.0/build/umd.js'
];

self.addEventListener('install', e => {
    e.waitUntil(
        caches.open(CACHE_NAME)
            .then(c => c.addAll(STATIC_URLS))
            .catch(() => {})
    );
    self.skipWaiting();
});

self.addEventListener('activate', e => {
    e.waitUntil(
        caches.keys().then(keys =>
            Promise.all(keys.map(k => { if (k !== CACHE_NAME) return caches.delete(k); }))
        )
    );
    self.clients.claim();
});

/* Cache-First Strategy: serve from cache instantly, update in background */
self.addEventListener('fetch', e => {
    const req = e.request;
    if (req.method !== 'GET') return;

    /* Firebase API calls – Network first, cache fallback, never block */
    if (req.url.includes('firestore.googleapis.com') || req.url.includes('googleapis.com')) {
        e.respondWith(
            fetch(req).catch(() => caches.match(req))
        );
        return;
    }

    /* Static assets – Cache first, network fallback */
    e.respondWith(
        caches.match(req).then(cached => {
            const fetchPromise = fetch(req).then(res => {
                if (res && res.status === 200) {
                    const clone = res.clone();
                    caches.open(CACHE_NAME).then(c => c.put(req, clone));
                }
                return res;
            }).catch(() => null);
            return cached || fetchPromise || caches.match('./');
        })
    );
});`;

    const swBlob = new Blob([swCode], {type:'application/javascript'});
    const swURL = URL.createObjectURL(swBlob);
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(swURL).catch(e => console.warn('SW:', e));
    }
})();

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
});
window.addEventListener('appinstalled', () => { deferredPrompt = null; });

/* =====================================================================
   FIREBASE
   ===================================================================== */
const firebaseConfig = {
    apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
    authDomain: "bakkala-system.firebaseapp.com",
    projectId: "bakkala-system",
    storageBucket: "bakkala-system.firebasestorage.app",
    messagingSenderId: "807660158854",
    appId: "1:807660158854:web:c3690293a27185f07fb607"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* Enable offline persistence – unlimited cache */
db.enablePersistence({ synchronizeTabs: true }).catch(e => {
    if (e.code === 'failed-precondition') console.warn('Persistence: multi-tab');
    else if (e.code === 'unimplemented') console.warn('Persistence: not supported');
});

/* Firestore settings for offline */
db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });

const QUERY_LIMITS = { products:15000, customers:1000, suppliers:500, invoices:500, missingProducts:200, supplierProducts:200 };

/* =====================================================================
   IndexedDB  –  Local Storage Layer
   ===================================================================== */
let idbReady = false, dbCache;

const openDB = async () => {
    if (!window.idb) return;
    dbCache = await idb.openDB('FatoraMousaOffline', 12, {
        upgrade(db, oldVer) {
            if (!db.objectStoreNames.contains('pending'))
                db.createObjectStore('pending', { autoIncrement: true, keyPath: '__id' });
            if (!db.objectStoreNames.contains('cache'))
                db.createObjectStore('cache', { keyPath: 'key' });
            if (!db.objectStoreNames.contains('localInvoices'))
                db.createObjectStore('localInvoices', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('localCounters'))
                db.createObjectStore('localCounters', { keyPath: 'key' });
        }
    });
    idbReady = true;
};
openDB();

/* ---- Generic cache helpers ---- */
async function cacheData(key, data) {
    if (!idbReady || !dbCache) return;
    try { await dbCache.put('cache', { key, data, timestamp: Date.now() }); } catch(e) {}
}
async function getCachedData(key) {
    if (!idbReady || !dbCache) return null;
    try { const res = await dbCache.get('cache', key); return res?.data ?? null; } catch(e) { return null; }
}

/* ---- Pending operations queue ---- */
async function addPendingOp(op) {
    if (!idbReady || !dbCache) return;
    /* remove __id so autoIncrement works */
    const { __id, ...clean } = op;
    try { await dbCache.add('pending', clean); } catch(e) {}
    updateStatusBar();
}
async function getPendingOps() {
    if (!idbReady || !dbCache) return [];
    try { return await dbCache.getAll('pending'); } catch(e) { return []; }
}
async function clearPendingOps() {
    if (!idbReady || !dbCache) return;
    try { await dbCache.clear('pending'); } catch(e) {}
}
async function deletePendingOp(id) {
    if (!idbReady || !dbCache) return;
    try { await dbCache.delete('pending', id); } catch(e) {}
}

/* ---- Local invoice counter (works fully offline for months) ---- */
async function getLocalInvoiceCounter() {
    if (!idbReady || !dbCache) return Date.now();
    try {
        const today = new Date().toISOString().split('T')[0];
        const key = `inv_${today}`;
        let rec = await dbCache.get('localCounters', key).catch(() => null);
        if (!rec) rec = { key, current: 0 };
        rec.current += 1;
        await dbCache.put('localCounters', rec);
        return rec.current;
    } catch(e) { return Date.now(); }
}

/* =====================================================================
   State
   ===================================================================== */
let currentUserAuth=null, userData=null, currentStoreId=null, currentRole=null, isAdminGlobal=false;
let allProducts=[], allCustomers=[], allSuppliers=[], allInvoicesCache=[], allMissingProducts=[];

}
loadFromCacheThenSync();

let lastRefreshTime = 0;
const REFRESH_COOLDOWN = 5 * 60 * 1000;

/* =====================================================================
   Firestore helpers
   ===================================================================== */
function getStoreRef(){ return db.collection('stores').doc(currentStoreId); }
function getProductsCol(){ return getStoreRef().collection('products'); }
function getCustomersCol(){ return getStoreRef().collection('customers'); }
function getSuppliersCol(){ return getStoreRef().collection('suppliers'); }
function getInvoicesCol(){ return getStoreRef().collection('invoices'); }
function getCountersCol(){ return getStoreRef().collection('counters'); }
function getMissingProductsCol(){ return getStoreRef().collection('missingProducts'); }

/* =====================================================================
   Status Bar
   ===================================================================== */
async function updateStatusBar() {
    const bar    = document.getElementById('statusBar');
    const text   = document.getElementById('statusBarText');
    const pcount = document.getElementById('statusBarPendingCount');
    if (!bar || !text) return;

    const pending = await getPendingOps();
    const count   = pending.length;

    if (isSyncing) {
        bar.className = 'status-bar syncing';
        text.textContent = '🔄 جاري المزامنة...';
    } else if (!navigator.onLine) {
        bar.className = 'status-bar offline';
        text.textContent = '🔴 بدون إنترنت – البيع يعمل محلياً';
    } else if (count > 0) {
        bar.className = 'status-bar pending';
        text.textContent = '🟡 متصل – يوجد عمليات معلقة';
    } else {
        bar.className = 'status-bar online';
        text.textContent = '🟢 متصل بالإنترنت';
    }
    pcount.textContent = count > 0 ? `📦 ${count} عملية معلقة` : '';
}

/* =====================================================================
   Refresh from Firestore
   ===================================================================== */
async function refreshFromFirestore(showLoading=true) {
    if (!currentStoreId || isAdminGlobal) return;
    try {
        const loadingBar = document.getElementById('productsLoadingBar');
        if (showLoading && loadingBar) {
            loadingBar.style.display='flex';
            loadingBar.innerHTML='<span class="search-spinner"></span> جاري تحميل المنتجات...';
        }

        let allFetchedProducts=[], lastDoc=null, keepFetching=true;
        while (keepFetching) {
            let query = getProductsCol().orderBy(firebase.firestore.FieldPath.documentId()).limit(500);
            if (lastDoc) query = query.startAfter(lastDoc);
            const snap = await query.get({ source: 'server' }).catch(() => query.get());
            if (snap.empty) break;
            allFetchedProducts = allFetchedProducts.concat(snap.docs.map(d=>({id:d.id,...d.data()})));
            lastDoc = snap.docs[snap.docs.length-1];
            if (showLoading && loadingBar)
                loadingBar.innerHTML=`<span class="search-spinner"></span> تحميل... ${allFetchedProducts.length} منتج`;
            if (snap.docs.length < 500 || allFetchedProducts.length >= QUERY_LIMITS.products) keepFetching=false;
        }
        if (showLoading && loadingBar) loadingBar.style.display='none';

        const [custSnap,suppSnap,invSnap,missingSnap] = await Promise.all([
            getCustomersCol().limit(QUERY_LIMITS.customers).get(),
            getSuppliersCol().limit(QUERY_LIMITS.suppliers).get(),
            getInvoicesCol().orderBy('date','desc').limit(QUERY_LIMITS.invoices).get(),
            getMissingProductsCol().limit(QUERY_LIMITS.missingProducts).get()
        ]);

        allProducts        = allFetchedProducts;
        allCustomers       = custSnap.docs.map(d=>({id:d.id,...d.data()}));
        allSuppliers       = suppSnap.docs.map(d=>({id:d.id,...d.data()}));
        allInvoicesCache   = invSnap.docs.map(d=>({id:d.id,...d.data()}));
        allMissingProducts = missingSnap.docs.map(d=>({id:d.id,...d.data()}));
        missingProductsLoaded = true;

        await Promise.all([
            cacheData('products',allProducts),
            cacheData('customers',allCustomers),
            cacheData('suppliers',allSuppliers),
            cacheData('invoices',allInvoicesCache),
            cacheData('missingProducts',allMissingProducts)
        ]);

        if (document.getElementById('productsListArea')) renderProductsTable();
        if (document.getElementById('salesLogList')) filterAndDisplayInvoices();
        if (document.getElementById('otherContent')) loadOtherSubContent();
        if (document.getElementById('customersListDiv')) renderCustomersTable();
        if (document.getElementById('invoicesList')) applyInvoicesFilters();
    } catch(e) {
        console.warn('refreshFromFirestore:', e);
    }
}

async function loadStoreData(forceRefresh=false) {
    if (isAdminGlobal || !currentStoreId) return;
    const now = Date.now();
    if (!forceRefresh && allProducts.length>0 && (now-lastRefreshTime)<REFRESH_COOLDOWN) return;
    await refreshFromFirestore(true);
    lastRefreshTime = now;
}

/* =====================================================================
   Sync pending operations when online
   ===================================================================== */
async function syncPendingOps() {
    if (!navigator.onLine || isSyncing) return;
    const pending = await getPendingOps();
    if (pending.length === 0) { updateStatusBar(); return; }

    isSyncing = true;
    updateStatusBar();

    for (let op of pending) {
        try {
            if (op.type === 'addInvoice') {
                /* Build a clean copy without temp fields */
                const invData = { ...op.data };
                delete invData.__localId;
                /* Fix serverTimestamp if it was stored as a plain object */
                invData.date = firebase.firestore.FieldValue.serverTimestamp();

                await getInvoicesCol().add(invData);

                /* Update product quantities */
                const batch = db.batch();
                for (let item of invData.items) {
                    batch.update(getProductsCol().doc(item.productId),
                        {qty: firebase.firestore.FieldValue.increment(-item.quantity)});
                }
                await batch.commit();

                if (invData.customerId && invData.paymentMethod==='credit' && invData.debtAdded>0)
                    await getCustomersCol().doc(invData.customerId)
                        .update({debt: firebase.firestore.FieldValue.increment(invData.debtAdded)});

            } else if (op.type === 'addProduct') {
                const docRef = await getProductsCol().add({...op.data, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
                const idx = allProducts.findIndex(p=>p.id===op.__localId);
                if (idx !== -1) allProducts[idx].id = docRef.id;
                await cacheData('products', allProducts);

            } else if (op.type === 'cancelInvoice') {
                const invRef = getInvoicesCol().doc(op.invoiceId);
                const batch = db.batch();
                batch.update(invRef, {cancelled: true});
                for (let item of op.items)
                    batch.update(getProductsCol().doc(item.productId),
                        {qty: firebase.firestore.FieldValue.increment(item.quantity)});
                if (op.customerId && op.debtRemoved>0)
                    batch.update(getCustomersCol().doc(op.customerId),
                        {debt: firebase.firestore.FieldValue.increment(-op.debtRemoved)});
                await batch.commit();

            } else if (op.type === 'addMissingProduct') {
                await getMissingProductsCol().add({...op.data, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
            } else if (op.type === 'deleteMissingProduct') {
                await getMissingProductsCol().doc(op.missingId).delete();
            } else if (op.type === 'updateProduct') {
                await getProductsCol().doc(op.productId).update(op.data);
            } else if (op.type === 'deleteProduct') {
                await getProductsCol().doc(op.productId).delete();
            } else if (op.type === 'addCustomer') {
                const docRef = await getCustomersCol().add(op.data);
                const idx = allCustomers.findIndex(c=>c.id===op.__localId);
                if (idx !== -1) allCustomers[idx].id = docRef.id;
                await cacheData('customers', allCustomers);
            } else if (op.type === 'updateCustomer') {
                await getCustomersCol().doc(op.customerId).update(op.data);
            } else if (op.type === 'deleteCustomer') {
                await getCustomersCol().doc(op.customerId).delete();
            } else if (op.type === 'recordPayment') {
                await getCustomersCol().doc(op.customerId)
                    .update({debt: firebase.firestore.FieldValue.increment(-op.amount)});
            } else if (op.type === 'addSupplier') {
                await getSuppliersCol().add(op.data);
            } else if (op.type === 'updateSupplier') {
                await getSuppliersCol().doc(op.supplierId).update(op.data);
            } else if (op.type === 'deleteSupplier') {
                await getSuppliersCol().doc(op.supplierId).delete();
            }

            /* Delete the op after success */
            if (op.__id !== undefined) await deletePendingOp(op.__id);

        } catch(e) {
            console.warn('syncOp failed:', op.type, e);
        }
    }

    await clearPendingOps(); /* clear remainder */
    isSyncing = false;
    await refreshFromFirestore(false);
    updateStatusBar();

    if (document.getElementById('salesLogList')) filterAndDisplayInvoices();
    if (document.getElementById('otherContent')) loadOtherSubContent();
}

});

/* =====================================================================
   Invoice counter – hybrid (online uses Firestore tx, offline uses IDB)
   ===================================================================== */
async function getNextInvoiceNumber() {
    if (!isOnline()) return getLocalInvoiceCounter();
    try {
        const today = new Date(); today.setHours(0,0,0,0);
        const counterRef = getCountersCol().doc(`daily_${today.toISOString().split('T')[0]}`);
        return await db.runTransaction(async (tx) => {
            const snap = await tx.get(counterRef);
            let n = 1;
            if (snap.exists) {
                n = snap.data().current + 1;
                tx.update(counterRef, {current: firebase.firestore.FieldValue.increment(1)});
            } else {
                tx.set(counterRef, {current:1, date: firebase.firestore.Timestamp.fromDate(today)});
            }
            return n;
        });
    } catch(e) {
        return getLocalInvoiceCounter();
    }
}

async function ensureStoreDocument(sid,sname){
    const ref=db.collection('stores').doc(sid);
    const doc=await ref.get().catch(()=>({exists:false}));
    if(!doc.exists) await ref.set({name:sname,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
    return ref;
}
async function ensureUserDocument(uid,email){
    const userRef=db.collection('users').doc(uid);
    const doc=await userRef.get();
    if(doc.exists){
        if(doc.data().isActive===false) throw new Error('الحساب معطل');
        const data=doc.data();
        await ensureStoreDocument(data.storeId,data.storeName||'محل تجاري').catch(()=>{});
        return data;
    }
    let storeName=`محل ${email.split('@')[0]}`;
    let storeIdBase=storeName.replace(/\s/g,'').replace(/[^a-zA-Z0-9\u0600-\u06FF]/g,'');
    let storeId=`store_${storeIdBase}`;
    const existing=await db.collection('stores').doc(storeId).get().catch(()=>({exists:false}));
    if(existing.exists) storeId=`store_${storeIdBase}_${Date.now()}`;
    await ensureStoreDocument(storeId,storeName).catch(()=>{});
    const newUser={email,role:'owner',storeId,storeName,isActive:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    await userRef.set(newUser);
    return newUser;
}

        : '<span class="offline-badge">🔴 وضع أوفلاين – البيع يعمل محلياً</span>';

    container.innerHTML=`
    <div style="background:#f8fafc;border-radius:32px;padding:20px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
            <h3>💰 نقطة البيع السريعة</h3>

        <div class="pos-row">
            <input type="text" id="searchProduct" placeholder="🔍 باركود أو اسم" oninput="searchProductLive()">
            <select id="productSelect"><option>اختر منتج</option></select>
            <input type="number" id="cartQty" placeholder="الكمية" value="1" min="1">
            <button onclick="addToCart()" class="btn-sm">➕ أضف للسلة</button>
        </div>

        <div class="pos-row">
            <input type="text" id="searchCustomer" placeholder="🔍 بحث عن عميل" oninput="filterCustomers()">
            <select id="customerId">${custOpt}</select>
            <select id="paymentMethod"><option value="cash">كاش</option><option value="visa">فيزا</option><option value="credit">آجل</option></select>
        </div>
        <div class="pos-row">
            <input type="number" id="discountValue" placeholder="قيمة الخصم" value="0" step="0.01">
            <select id="discountType"><option value="fixed">قيمة ثابتة</option><option value="percent">نسبة %</option></select>
            <button onclick="applyDiscount()" class="btn-sm" style="background:#10b981;">تطبيق خصم</button>
        </div>
        <div class="pos-row">
            <input type="number" id="paidAmount" placeholder="المدفوع" oninput="updateChange()">
            <input type="text" id="changeAmount" placeholder="الباقي" readonly>
        </div>
        <div style="font-size:24px;font-weight:bold;" id="totalAmount">الإجمالي: 0 ج.م</div>
        <button onclick="confirmSale()" style="background:#10b981;">إتمام البيع</button>
        <div id="posFlash"></div>
        <div id="printReceiptArea" style="margin-top:10px;display:none;">
            <button onclick="printLastReceipt()" style="background:#22c55e;">🖨️ طباعة الفاتورة</button>
        </div>
    </div>`;

    refreshProductsForPos();

    window.searchProductLive = () => refreshProductsForPos();

    window.filterCustomers = () => {
        const val = document.getElementById('searchCustomer').value.toLowerCase();
        const filtered = allCustomers.filter(c=>c.name.toLowerCase().includes(val));
        document.getElementById('customerId').innerHTML =
            `<option value="">بدون عميل</option>` +
            filtered.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
    };

    window.addToCart = () => {
        const pid = document.getElementById('productSelect').value;
        if(!pid || pid==='لا يوجد' || pid==='اختر منتج') return;
        const qty = parseInt(document.getElementById('cartQty').value)||1;
        if(qty<=0) return;
        const prod = allProducts.find(p=>p.id===pid);
        if(!prod){ showFlash('posFlash','منتج غير موجود',true); return; }

        /* Offline: allow selling even if qty looks 0 – sync will reconcile */
        if(isOnline() && prod.qty < qty){ showFlash('posFlash','⚠️ الكمية غير كافية في المخزون',true); return; }

        const existing = cart.find(i=>i.id===pid);
        if(existing) existing.qty += qty;
        else cart.push({id:pid, name:prod.name, price:prod.priceRetail||prod.price||0, qty});
        renderCart();
    };

    window.renderCart = () => {
        const cd = document.getElementById('cartItems');
        let total = 0;
        let h = `<h4>السلة (${cart.length} صنف)</h4>`;
        cart.forEach((item,idx)=>{
            total += item.price * item.qty;
            h += `<div class="card" style="padding:10px;">
                <div class="card-info">${escapeHtml(item.name)} &times; ${item.qty} = ${(item.price*item.qty).toFixed(2)} ج.م</div>

            </div>`;
        });
        cd.innerHTML = h;
        document.getElementById('totalAmount').innerHTML = `الإجمالي: ${total.toFixed(2)} ج.م`;
        updateChange();
    };

    window.removeFromCart = (idx) => { cart.splice(idx,1); renderCart(); };

    window.updateChange = () => {
        const t = cart.reduce((s,i)=>s+(i.price*i.qty),0);
        const dv = parseFloat(document.getElementById('discountValue').value)||0;
        const dt = document.getElementById('discountType').value;
        const disc = dt==='percent' ? (t*dv/100) : dv;
        const after = Math.max(0, t-disc);
        const paid = parseFloat(document.getElementById('paidAmount').value)||0;
        document.getElementById('changeAmount').value = paid>after ? (paid-after).toFixed(2) : '0';
        document.getElementById('totalAmount').innerHTML = `الإجمالي: ${after.toFixed(2)} ج.م`;
    };

    window.applyDiscount = () => updateChange();

    /* POS search – local first, no network needed */
    let _posTimer = null;
    function refreshProductsForPos(){
        const val = document.getElementById('searchProduct')?.value?.trim() || '';
        const s = document.getElementById('productSelect');
        if(!s) return;
        const lim = val
            ? allProducts.filter(p=>(p.barcode&&p.barcode.includes(val))||p.name.includes(val))
            : allProducts.slice(0,200);
        s.innerHTML = lim.map(p=>
            `<option value="${p.id}">${escapeHtml(p.name)} - ${p.priceRetail||p.price||0} ج.م (متوفر ${p.qty})</option>`
        ).join('') || '<option>لا يوجد</option>';
    }

    renderCart();
}

async function confirmSale(){
    if(cart.length===0) return showFlash('posFlash','السلة فارغة',true);

    const cid = document.getElementById('customerId').value || null;
    const pm  = document.getElementById('paymentMethod').value;
    const paid= parseFloat(document.getElementById('paidAmount').value)||0;

    const totalBefore = cart.reduce((s,i)=>s+(i.price*i.qty),0);
    const dv = parseFloat(document.getElementById('discountValue').value)||0;
    const dt = document.getElementById('discountType').value;
    const discountAmount = dt==='percent' ? (totalBefore*dv/100) : dv;
    const total = Math.max(0, totalBefore - discountAmount);

    let finalMethod=pm, change=0, debtAdded=0;

    if(cid && paid < total){
        finalMethod='credit'; debtAdded=total-paid; change=0;
        showFlash('posFlash',`سيتم إضافة ${debtAdded.toFixed(2)} ج.م كدين`,false);
    } else if(finalMethod!=='credit' && paid < total){
        return showFlash('posFlash','المدفوع أقل من الإجمالي',true);
    } else if(finalMethod!=='credit'){
        change = paid - total;
        if(change < 0) return showFlash('posFlash','المدفوع أقل من الإجمالي',true);
    }

    try {
        const invoiceNumber = await getNextInvoiceNumber();
        const invoiceData = {
            invoiceNumber,
            items: cart.map(i=>({
                productId:i.id, productName:i.name,
                quantity:i.qty, unitPrice:i.price, total:i.price*i.qty
            })),
            total, discountAmount,
            discountType: dt==='percent'?'percent':'fixed',
            discountValue: dv,
            paymentMethod: finalMethod,
            customerId: cid,
            paidAmount: paid,
            changeAmount: change,
            userId: currentUserAuth?.uid || '',
            cancelled: false,
            debtAdded
        };

        /* ── Update local cache immediately (optimistic) ── */
        for(let item of cart){
            const lp = allProducts.find(p=>p.id===item.id);
            if(lp) lp.qty = Math.max(0, (lp.qty||0) - item.qty);
        }
        if(cid && debtAdded>0){
            const cust = allCustomers.find(c=>c.id===cid);
            if(cust) cust.debt = (cust.debt||0) + debtAdded;
        }

        /* Add to local invoices cache */
        const localInvoice = {
            ...invoiceData,
            id: genLocalId(),
            date: { toDate: ()=>new Date() }   /* fake Timestamp for display */
        };
        allInvoicesCache.unshift(localInvoice);

        await Promise.all([
            cacheData('products', allProducts),
            cacheData('customers', allCustomers),
            cacheData('invoices', allInvoicesCache)
        ]);

        if(!isOnline()){
            /* Queue for later sync */
            await addPendingOp({
                type:'addInvoice',
                data: { ...invoiceData, date: null, __localId: localInvoice.id }
            });
            showFlash('posFlash',`✅ تم حفظ البيع محلياً – سيتم المزامنة عند الاتصال`,false);
        } else {
            /* Save to Firestore now */
            try {
                const fsData = { ...invoiceData, date: firebase.firestore.FieldValue.serverTimestamp() };
                const batch = db.batch();
                for(let item of cart)
                    batch.update(getProductsCol().doc(item.id),
                        {qty: firebase.firestore.FieldValue.increment(-item.qty)});
                const invoiceRef = getInvoicesCol().doc();
                batch.set(invoiceRef, fsData);
                if(cid && debtAdded>0)
                    batch.update(getCustomersCol().doc(cid),
                        {debt: firebase.firestore.FieldValue.increment(debtAdded)});
                await batch.commit();
                /* Update local invoice with real id */
                localInvoice.id = invoiceRef.id;
                await cacheData('invoices', allInvoicesCache);
                showFlash('posFlash',`✅ بيع ناجح بقيمة ${total.toFixed(2)} ج.م`,false);
            } catch(fsErr) {
                /* Firestore failed – fallback to queue */
                console.warn('Firestore save failed, queued:', fsErr);
                await addPendingOp({
                    type:'addInvoice',
                    data: { ...invoiceData, date: null, __localId: localInvoice.id }
                });
                showFlash('posFlash',`✅ تم حفظ البيع محلياً (سيتم المزامنة لاحقاً)`,false);
            }
        }

        lastReceiptData = {
            cartItems:[...cart], total, method:finalMethod,
            customerId:cid, change, debtAdded, invoiceNumber, discountAmount
        };
        document.getElementById('printReceiptArea').style.display='block';
        cart=[];
        renderCart();
        updateStatusBar();

    } catch(err){ showFlash('posFlash', err.message, true); }
}

    const custName=customerId?(allCustomers.find(c=>c.id===customerId)?.name||'عميل'):'نقدي';
    const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    const dayName=dayNames[new Date().getDay()];
    const headerInfo=`<span>رقم الفاتورة: ${invoiceNumber} (${dayName})</span><span>التاريخ: ${new Date().toLocaleString('ar-EG')}</span><span>العميل: ${custName}</span>`;
    const tableHeaders=`<tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>`;
    const tableRows=cartItems.map(i=>`<tr><td style="text-align:right;">${escapeHtml(i.name)}</td><td>${i.qty}</td><td>${Number(i.price).toFixed(2)}</td><td>${(i.qty*i.price).toFixed(2)}</td></tr>`).join('');
    let footerInfo='';
    if(discountAmount>0) footerInfo+=`<div class="info-row">الخصم: - ${discountAmount.toFixed(2)} ج.م</div>`;
    footerInfo+=`<div class="info-row">طريقة الدفع: ${getPaymentMethodArabic(method)}</div>`;
    footerInfo+=`<div class="info-row" style="font-weight:bold;">الإجمالي: ${total.toFixed(2)} ج.م</div>`;
    if(method!=='credit') footerInfo+=`<div class="info-row">المدفوع: ${(total+change).toFixed(2)} ج.م &nbsp; الباقي: ${change.toFixed(2)} ج.م</div>`;
    if(debtAdded>0) footerInfo+=`<div class="info-row">تم إضافة دين: ${debtAdded.toFixed(2)} ج.م</div>`;
    directPrint(generatePrintHTML('فاتورة بيع',headerInfo,tableHeaders,tableRows,footerInfo));
}

async function renderProductsTable(filteredList){
    const area=document.getElementById('productsListArea'); if(!area) return;
    const sourceList=filteredList!==undefined?filteredList:allProducts;
    if(!sourceList.length){ area.innerHTML='<p>لا توجد منتجات</p>'; return; }
    const totalProducts=sourceList.length;
    const totalPages=Math.ceil(totalProducts/productsPerPage);
    if(currentProductPage<1) currentProductPage=1;
    if(currentProductPage>totalPages) currentProductPage=totalPages;
    const startIdx=(currentProductPage-1)*productsPerPage;
    const pageProducts=sourceList.slice(startIdx,startIdx+productsPerPage);
    const searchBar=`<div class="filter-row" style="margin-bottom:8px;"><input type="text" id="productsTableSearch" placeholder="🔍 بحث سريع بالاسم أو الباركود" oninput="searchInProductsTable(this.value)" style="margin:0;"><button class="btn-sm" onclick="searchInProductsTable(document.getElementById('productsTableSearch')?.value||'')">بحث</button><button class="btn-sm" onclick="clearProductsTableSearch()">مسح</button></div>`;
    let html=`<div class="table-responsive"><table class="data-table"><thead><tr><th>الصورة</th><th>الاسم</th><th>باركود</th><th>سعر القطاعي</th><th>الكمية</th><th>الوحدة</th><th>حد التنبيه</th><th>إجراء</th></tr></thead><tbody>`;
    for(let p of pageProducts){
        const lsc=(p.qty<=(p.lowStockAlert||0))&&p.lowStockAlert?'low-stock-row':'';
        html+=`<tr class="${lsc}"><td>${p.imageUrl?`<img src="${p.imageUrl}" width="40" height="40" style="border-radius:8px;">`:'-'}</td><td style="text-align:right;">${escapeHtml(p.name)}</td><td>${p.barcode||'-'}</td><td>${p.priceRetail||0} ج.م</td><td>${p.qty}</td><td>${p.unit||'قطعة'}</td><td>${p.lowStockAlert||0}</td><td><button class="btn-sm" onclick="openEditProductModal('${p.id}')">✏️</button>${currentRole==='owner'?`<button class="btn-sm btn-danger" onclick="deleteProduct('${p.id}')">🗑️</button>`:''}</td></tr>`;
    }
    html+=`</tbody></table></div>`;
    html+=`<div class="pagination-controls"><button class="btn-sm" onclick="changeProductPage(-1)" ${currentProductPage<=1?'disabled style="opacity:0.4;"':''}>▶ السابق</button><span class="pagination-info">صفحة ${currentProductPage} من ${totalPages} | إجمالي: ${totalProducts}</span><button class="btn-sm" onclick="changeProductPage(1)" ${currentProductPage>=totalPages?'disabled style="opacity:0.4;"':''}>التالي ◀</button></div>`;
    area.innerHTML=searchBar+html;
}

window.changeProductPage=function(dir){
    currentProductPage+=dir;
    const sv=document.getElementById('productsTableSearch')?.value||'';
    if(sv.trim()){
        const f=allProducts.filter(p=>p.name.toLowerCase().includes(sv.toLowerCase())||(p.barcode&&p.barcode.toLowerCase().includes(sv.toLowerCase())));
        renderProductsTable(f);
    } else renderProductsTable();
    setTimeout(()=>{ const si=document.getElementById('productsTableSearch'); if(si) si.value=sv; },0);
};

let _productSearchTimer=null;
window.searchInProductsTable=function(val){
    currentProductPage=1; clearTimeout(_productSearchTimer);
    if(!val||!val.trim()){ renderProductsTable(); return; }
    _productSearchTimer=setTimeout(()=>{
        const term=val.trim();
        renderProductsTable(allProducts.filter(p=>
            p.name.toLowerCase().includes(term.toLowerCase())||(p.barcode&&p.barcode.toLowerCase().includes(term.toLowerCase()))
        ));

async function saveProductEdit(){
    if(!currentEditProductId) return;
    let name=document.getElementById('editProdName').value.trim();
    if(!name) return showFlash('productsListArea','الاسم مطلوب',true);
    let data={
        name,
        barcode:document.getElementById('editProdBarCode').value,
        unit:document.getElementById('editProdUnit').value,
        qty:parseInt(document.getElementById('editProdQty').value)||0,
        lowStockAlert:parseInt(document.getElementById('editProdLowStock').value)||0
    };
    if(currentRole==='owner'){
        data.priceRetail=parseFloat(document.getElementById('editProdPriceRetail').value)||0;
        data.priceWholesale=parseFloat(document.getElementById('editProdPriceWholesale').value)||0;
        data.cost=parseFloat(document.getElementById('editProdCost').value)||0;
        data.imageUrl=document.getElementById('editProdImage').value;
    }
    /* Update local cache */
    const idx=allProducts.findIndex(p=>p.id===currentEditProductId);
    if(idx!==-1) allProducts[idx]={...allProducts[idx],...data};
    await cacheData('products',allProducts);

    if(!isOnline()){
        await addPendingOp({type:'updateProduct', productId:currentEditProductId, data});
    } else {
        await getProductsCol().doc(currentEditProductId).update(data).catch(async()=>{
            await addPendingOp({type:'updateProduct', productId:currentEditProductId, data});
        });
    }

    closeProductModal();
    if(document.getElementById('productsListArea')) renderProductsTable();
    if(otherSubTab==='inventory'&&document.getElementById('inventoryTableContainer')) filterInventory();
    showFlash('productsListArea','تم تحديث المنتج',false);
}

window.addNewProduct=async()=>{
    let name=document.getElementById('prodName').value.trim();
    if(!name) return showFlash('productsListArea','الاسم مطلوب',true);
    const localId = genLocalId();
    const data={
        name,
        barcode:document.getElementById('prodBarcode').value,
        priceRetail:parseFloat(document.getElementById('prodPriceRetail').value)||0,
        priceWholesale:parseFloat(document.getElementById('prodPriceWholesale').value)||0,
        cost:parseFloat(document.getElementById('prodCost').value)||0,
        unit:document.getElementById('prodUnit').value,
        qty:parseInt(document.getElementById('prodQty').value)||0,
        lowStockAlert:parseInt(document.getElementById('prodLowStock').value)||0,
        imageUrl:document.getElementById('prodImage').value
    };
    allProducts.push({id:localId,...data});
    await cacheData('products',allProducts);

    if(!isOnline()){
        await addPendingOp({type:'addProduct', data, __localId:localId});
        showFlash('productsListArea','✅ تم إضافة المنتج محلياً – ستتم المزامنة لاحقاً',false);
    } else {
        try{
            const docRef=await getProductsCol().add({...data, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
            const idx=allProducts.findIndex(p=>p.id===localId);
            if(idx!==-1) allProducts[idx].id=docRef.id;
            await cacheData('products',allProducts);
            showFlash('productsListArea','✅ تم إضافة المنتج',false);
        } catch(e){
            await addPendingOp({type:'addProduct', data, __localId:localId});
            showFlash('productsListArea','✅ تم إضافة المنتج (سيتم المزامنة لاحقاً)',false);
        }
    }
    renderProductsTab(document.getElementById('tabContent'));
};

window.deleteProduct=async(id)=>{

    allCustomers=allCustomers.filter(c=>c.id!==id);

window.recordPayment=async(custId)=>{
    let amt=parseFloat(prompt('المبلغ المسدد')); if(isNaN(amt)||amt<=0) return;
    const idx=allCustomers.findIndex(c=>c.id===custId);
    if(idx!==-1) allCustomers[idx].debt=Math.max(0,(allCustomers[idx].debt||0)-amt);
    await cacheData('customers',allCustomers);
    if(!isOnline()){
        await addPendingOp({type:'recordPayment',customerId:custId,amount:amt});
    } else {
        const ref=getCustomersCol().doc(custId);
        const doc=await ref.get().catch(()=>null);
        if(doc&&doc.exists){
            const newDebt=Math.max(0,(doc.data().debt||0)-amt);
            await ref.update({debt:newDebt}).catch(async()=>await addPendingOp({type:'recordPayment',customerId:custId,amount:amt}));
        } else {
            await addPendingOp({type:'recordPayment',customerId:custId,amount:amt});
        }
    }
    renderCustomersTab(document.getElementById('tabContent'));
};

function filterAndDisplayInvoices(){
    let filtered=[...allInvoicesCache];
    const now=new Date();
    if(invoicesFilter==='today'){
        const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()),e=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
        filtered=filtered.filter(f=>{const d=f.date?.toDate?.();return d&&d>=s&&d<e;});
    } else if(invoicesFilter==='yesterday'){
        const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1),e=new Date(now.getFullYear(),now.getMonth(),now.getDate());
        filtered=filtered.filter(f=>{const d=f.date?.toDate?.();return d&&d>=s&&d<e;});
    } else if(invoicesFilter==='custom'&&invSelectedDate){
        const s=new Date(invSelectedDate); s.setHours(0,0,0,0);
        const e=new Date(invSelectedDate); e.setHours(23,59,59,999);
        filtered=filtered.filter(f=>{const d=f.date?.toDate?.();return d&&d>=s&&d<=e;});
    }
    if(invoiceSearchNumber.trim()!==''){
        const num=parseInt(invoiceSearchNumber);
        if(!isNaN(num)) filtered=filtered.filter(f=>f.invoiceNumber===num);
    }
    filtered.sort((a,b)=>(b.date?.toDate?.()?.getTime()||0)-(a.date?.toDate?.()?.getTime()||0));
    const cont=document.getElementById('salesLogList'); if(!cont) return;
    if(!filtered.length){ cont.innerHTML='<p>⚠️ لا توجد فواتير</p>'; return; }
    const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    let html='';
    for(let inv of filtered){
        const canc=inv.cancelled===true;
        const cust=inv.customerId?allCustomers.find(c=>c.id===inv.customerId):null;
        const invDate=inv.date?.toDate?.();
        const dayName=invDate?dayNames[invDate.getDay()]:'';
        const itemsList=inv.items.map(it=>`${it.productName} (${it.quantity})`).join(', ');
        const isLocal=typeof inv.id==='string'&&inv.id.startsWith('local_');
        html+=`<div class="card ${canc?'cancelled':''}">
            <div class="card-info">
                <strong>فاتورة رقم: ${inv.invoiceNumber} - ${dayName}</strong>${isLocal?' <span style="background:#fef9c3;padding:2px 8px;border-radius:10px;font-size:12px;">محلية</span>':''}
                <br>المنتجات: ${itemsList}<br>
                الإجمالي: ${Number(inv.total).toFixed(2)} ج.م<br>
                طريقة الدفع: ${getPaymentMethodArabic(inv.paymentMethod)} | العميل: ${cust?cust.name:'نقدي'}<br>
                التاريخ: ${invDate?invDate.toLocaleString('ar-EG'):'-'} | الحالة: ${canc?'ملغاة':'ناجحة'}
            </div>
            <div>${!canc?`<button class="btn-sm btn-danger" onclick="cancelInvoice('${inv.id}')">إلغاء</button>`:''}</div>
        </div>`;
    }
    cont.innerHTML=html;
}

window.cancelInvoice=async(invoiceId)=>{
    if(!confirm('إلغاء الفاتورة؟ سيتم إعادة الكميات للمخزون.')) return;
    try{
        const inv=allInvoicesCache.find(i=>i.id===invoiceId);
        if(!inv||inv.cancelled) throw new Error('فاتورة غير موجودة أو ملغاة');

        /* Optimistic update */
        inv.cancelled=true;
        for(let item of inv.items){ const prod=allProducts.find(p=>p.id===item.productId); if(prod) prod.qty+=item.quantity; }
        if(inv.customerId&&inv.paymentMethod==='credit'&&inv.debtAdded){
            const cust=allCustomers.find(c=>c.id===inv.customerId);
            if(cust) cust.debt=Math.max(0,(cust.debt||0)-inv.debtAdded);
        }
        await cacheData('products',allProducts);
        await cacheData('customers',allCustomers);
        await cacheData('invoices',allInvoicesCache);
        filterAndDisplayInvoices();

        if(!isOnline()){
            await addPendingOp({type:'cancelInvoice',invoiceId,items:inv.items,customerId:inv.customerId,debtRemoved:inv.debtAdded||0});
            showFlash('salesLogList','تم الإلغاء محلياً',false); return;
        }

        const invRef=getInvoicesCol().doc(invoiceId);
        const batch=db.batch();
        batch.update(invRef,{cancelled:true});
        for(let item of inv.items) batch.update(getProductsCol().doc(item.productId),{qty:firebase.firestore.FieldValue.increment(item.quantity)});
        if(inv.customerId&&inv.paymentMethod==='credit'&&inv.debtAdded) batch.update(getCustomersCol().doc(inv.customerId),{debt:firebase.firestore.FieldValue.increment(-inv.debtAdded)});
        await batch.commit().catch(async()=>await addPendingOp({type:'cancelInvoice',invoiceId,items:inv.items,customerId:inv.customerId,debtRemoved:inv.debtAdded||0}));
        showFlash('salesLogList','تم إلغاء الفاتورة',false);
    }catch(err){ showFlash('salesLogList',err.message,true); }
};

async function ensureMissingProductsCache(){
    if(!missingProductsLoaded&&currentStoreId&&isOnline()){
        try{
            const snap=await getMissingProductsCol().limit(QUERY_LIMITS.missingProducts).get();
            allMissingProducts=snap.docs.map(d=>({id:d.id,...d.data()}));
            missingProductsLoaded=true;
            await cacheData('missingProducts',allMissingProducts);
        }catch(e){}
    } else { missingProductsLoaded=true; }
}
async function refreshMissingProductsTable(){
    const div=document.getElementById('missingProductsList'); if(!div) return;
    if(!allMissingProducts.length){ div.innerHTML='<p>لا توجد منتجات ناقصة</p>'; return; }

window.addMissingProduct=async()=>{
    let name=document.getElementById('missingProductName').value.trim(); if(!name) return;
    let qtyRaw=document.getElementById('missingProductQty').value;
    let quantity=qtyRaw?parseInt(qtyRaw):null;
    const localId=genLocalId();
    const data={name,quantity};
    allMissingProducts.push({id:localId,...data});
    refreshMissingProductsTable();
    await cacheData('missingProducts',allMissingProducts);
    if(!isOnline()){
        await addPendingOp({type:'addMissingProduct',data});
        showFlash('missingProductsList','تمت الإضافة محلياً',false);
    } else {
        const docRef=await getMissingProductsCol().add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(async()=>{ await addPendingOp({type:'addMissingProduct',data}); return null; });
        if(docRef){ const idx=allMissingProducts.findIndex(p=>p.id===localId); if(idx!==-1) allMissingProducts[idx].id=docRef.id; await cacheData('missingProducts',allMissingProducts); }
    }
    document.getElementById('missingProductName').value='';
    document.getElementById('missingProductQty').value='';
};
window.deleteMissingProduct=async(id)=>{
    if(!confirm('حذف؟')) return;
    allMissingProducts=allMissingProducts.filter(p=>p.id!==id);
    refreshMissingProductsTable();
    await cacheData('missingProducts',allMissingProducts);
    if(!isOnline()) await addPendingOp({type:'deleteMissingProduct',missingId:id});
    else await getMissingProductsCol().doc(id).delete().catch(async()=>await addPendingOp({type:'deleteMissingProduct',missingId:id}));
};

/* =====================================================================

   ===================================================================== */
function applyProductFilter(){
    let filtered=[...allProducts];
    const search=document.getElementById('filterSearch')?.value.toLowerCase()||'';
    const minQty=parseInt(document.getElementById('filterMinQty')?.value);
    const maxQty=parseInt(document.getElementById('filterMaxQty')?.value);
    if(search) filtered=filtered.filter(p=>p.name.toLowerCase().includes(search)||(p.barcode&&p.barcode.toLowerCase().includes(search)));
    if(!isNaN(minQty)) filtered=filtered.filter(p=>p.qty>=minQty);
    if(!isNaN(maxQty)) filtered=filtered.filter(p=>p.qty<=maxQty);
    const container=document.getElementById('filteredProductsList');
    if(!filtered.length){ container.innerHTML='<p>لا توجد منتجات</p>'; return; }
    let html='<div class="grid-2">';
    for(let p of filtered)
        html+=`<div class="card"><div class="card-info"><strong>${escapeHtml(p.name)}</strong><br>الباركود: ${p.barcode||'-'}<br>الكمية: ${p.qty} ${p.unit||'قطعة'}<br>السعر: ${p.priceRetail||0} ج.م</div></div>`;
    html+=`</div>`;
    container.innerHTML=html;
}
window.resetProductFilter=()=>{
    document.getElementById('filterSearch').value='';
    document.getElementById('filterMinQty').value='';
    document.getElementById('filterMaxQty').value='';
    applyProductFilter();
};

/* =====================================================================
   Top By Time
   ===================================================================== */
window.calculateTopByTime=async()=>{
    const start=document.getElementById('startTime').value, end=document.getElementById('endTime').value;
    if(!start||!end) return showFlash('topByTimeResult','يرجى تحديد النطاق الزمني',true);
    const startDate=new Date(start), endDate=new Date(end);
    const productCount={};
    for(let inv of allInvoicesCache){
        if(inv.cancelled||!inv.date) continue;
        const invDate=inv.date?.toDate?.();
        if(invDate&&invDate>=startDate&&invDate<=endDate)
            for(let it of inv.items) productCount[it.productName]=(productCount[it.productName]||0)+it.quantity;
    }
    const sorted=Object.entries(productCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const resultDiv=document.getElementById('topByTimeResult');
    if(!sorted.length){ resultDiv.innerHTML='<p>لا توجد مبيعات في هذا النطاق</p>'; return; }
    let html=`<div class="table-responsive"><table class="data-table"><thead><tr><th>المنتج</th><th>الكمية المباعة</th></tr></thead><tbody>${sorted.map(([n,q])=>`<tr><td style="text-align:right;">${escapeHtml(n)}</td><td>${q} وحدة</td></tr>`).join('')}</tbody></table></div>`;
    resultDiv.innerHTML=html;
};

window.changePassword=async()=>{
    const old=document.getElementById('oldPassword').value, new1=document.getElementById('newPassword1').value, new2=document.getElementById('newPassword2').value, msg=document.getElementById('passwordMsg');
    if(!old||!new1||!new2){ msg.style.display='block'; msg.innerText='املأ الحقول'; setTimeout(()=>msg.style.display='none',3000); return; }
    if(new1!==new2){ msg.style.display='block'; msg.innerText='كلمتا المرور غير متطابقتين'; setTimeout(()=>msg.style.display='none',3000); return; }
    if(new1.length<6){ msg.style.display='block'; msg.innerText='6 أحرف كحد أدنى'; setTimeout(()=>msg.style.display='none',3000); return; }
    try{
        const user=auth.currentUser;
        const cred=firebase.auth.EmailAuthProvider.credential(user.email,old);
        await user.reauthenticateWithCredential(cred);
        await user.updatePassword(new1);
        msg.style.display='block'; msg.style.backgroundColor='#d1fae5'; msg.innerText='✅ تم تغيير كلمة المرور';
        setTimeout(()=>msg.style.display='none',3000);
    }catch(e){
        msg.style.display='block';
        msg.innerText=e.code==='auth/wrong-password'?'كلمة المرور القديمة خاطئة':'حدث خطأ';
        setTimeout(()=>msg.style.display='none',3000);
    }
};

/* =====================================================================
   Auth
   ===================================================================== */
async function handleSignedInUser(user){
    try{
        let info;
        if(!isOnline()){
            /* Offline: use cached user data */
            info = await getCachedData('userData');
            if(!info) { document.getElementById('loginError').innerText='لا يوجد بيانات مخزنة، يرجى الاتصال بالإنترنت أولاً.'; await auth.signOut(); return; }
        } else {
            info = await ensureUserDocument(user.uid, user.email);
            await cacheData('userData', info);
        }

        currentUserAuth=user; userData=info; currentStoreId=info.storeId; currentRole=info.role; isAdminGlobal=(currentRole==='admin');
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('dashboard').style.display='block';
        document.getElementById('storeTitle').innerHTML=`<i class="fas fa-store"></i> ${info.storeName||'المحل'}`;

        /* Load from cache first for instant UI, then sync */
        await loadFromCacheThenSync();
        buildTabs();
        updateStatusBar();

        /* Background refresh if online */
        if(isOnline()){
            setTimeout(()=>loadStoreData(true),500);
            setTimeout(()=>syncPendingOps(),1500);
        }
    }catch(e){
        console.error(e);
        if(e.message==='الحساب معطل'){ document.getElementById('loginError').innerText='الحساب معطل'; await auth.signOut(); return; }
        /* If network error, try cached data */
        const cached=await getCachedData('userData');
        if(cached){
            userData=cached; currentStoreId=cached.storeId; currentRole=cached.role; isAdminGlobal=(currentRole==='admin');
            currentUserAuth=user;
            document.getElementById('loginScreen').style.display='none';
            document.getElementById('dashboard').style.display='block';
            document.getElementById('storeTitle').innerHTML=`<i class="fas fa-store"></i> ${cached.storeName||'المحل'}`;
            await loadFromCacheThenSync();
            buildTabs();
            updateStatusBar();
        } else {
            await auth.signOut(); location.reload();
        }
    }
}

async function loginUser(){
    const id=document.getElementById('loginId').value.trim();
    const pwd=document.getElementById('loginPassword').value;
    if(!id||!pwd){ document.getElementById('loginError').innerText='أدخل اسم المستخدم وكلمة المرور'; return; }
    document.getElementById('loginError').innerText='جاري التحقق...';
    try{
        const cred=await auth.signInWithEmailAndPassword(id+"@bkalla.com",pwd);
        await handleSignedInUser(cred.user);
    }catch(e){
        document.getElementById('loginError').innerText='فشل الدخول - تأكد من البيانات';
    }
}

}

window.logoutUser=async()=>{

};
