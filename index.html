<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>محلاتي</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(145deg, #eef2ff, #e0e7ff); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: auto; background: rgba(255,255,255,0.96); border-radius: 40px; padding: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.1); }
        .login-box { text-align: center; padding: 40px 20px; max-width: 420px; margin: auto; }
        h1, h2, h3 { color: #4c1d95; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 30px; border: 1px solid #cbd5e1; font-size: 15px; }
        input:focus, select:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.2); outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 30px; background: linear-gradient(95deg, #2563eb, #8b5cf6); color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition:0.2s; }
        button:active { transform: scale(0.97); }
        .btn-secondary { background: #f97316; }
        .btn-danger { background: #dc2626; }
        .btn-sm { width: auto; padding: 6px 14px; margin: 3px; cursor: pointer; display: inline-block; }
        .top-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; background: #f1f5f9; padding: 8px; border-radius: 60px; }
        .nav-btn { background: transparent; color: #334155; width: auto; padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .nav-btn.active { background: #4f46e5; color: white; box-shadow: 0 6px 12px rgba(79,70,229,0.3); }
        .card { background: white; padding: 12px; border-radius: 24px; margin: 10px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-right: 5px solid #8b5cf6; gap: 8px; }
        .card-info { flex: 1; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 18px; }
        .stat-card { background: #f9fafb; padding: 18px; border-radius: 28px; text-align: center; border: 1px solid #e2e8f0; }
        .low-stock { background: #fee2e2; border-right-color: #ef4444; }
        .pos-row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin: 12px 0; }
        .pos-row > * { flex: 1; }
        .flash { padding: 12px; border-radius: 30px; margin: 10px 0; background: #e6f7e6; color: #166534; }
        @media (max-width:700px) { .container { padding: 15px; } }
        img.product-img { width: 45px; height: 45px; object-fit: cover; border-radius: 12px; margin-left: 8px; }
        .cancelled { background: #f8d7da; border-right-color: #dc3545; opacity: 0.8; }
        .sub-tabs { display: flex; gap: 8px; margin: 15px 0; flex-wrap: wrap; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .sub-tab { background: #eef2ff; padding: 8px 16px; border-radius: 30px; cursor: pointer; }
        .sub-tab.active { background: #4f46e5; color: white; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loginScreen">
        <div class="login-box">
            <h1><i class="fas fa-store"></i> إدارة محلاتي</h1>
            <input type="text" id="loginId" placeholder="اسم المستخدم (ID فقط)" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button onclick="loginUser()">دخول</button>
            <div id="loginError" style="color:#dc2626; margin-top:12px;"></div>
        </div>
    </div>
    <div id="dashboard" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:15px;">
            <h2 id="storeTitle"><i class="fas fa-store"></i> المتجر</h2>
            <button onclick="logoutUser()" class="btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
        <div class="top-nav" id="navTabs"></div>
        <div id="tabContent"></div>
    </div>
</div>

<script>
    // ========================== Firebase Config ==========================
    const firebaseConfig = {
        apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
        authDomain: "bakkala-system.firebaseapp.com",
        projectId: "bakkala-system",
        storageBucket: "bakkala-system.firebasestorage.app",
        messagingSenderId: "807660158854",
        appId: "1:807660158854:web:c3690293a27185f07fb607"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // تمكين التخزين المحلي للقراءة فقط
    db.enablePersistence({ synchronizeTabs: true })
        .then(() => console.log("تم تمكين التخزين المحلي"))
        .catch(err => console.error("فشل تمكين persistence", err));

    // ========================== المتغيرات العامة ==========================
    let currentUserAuth = null, userData = null, currentStoreId = null, currentRole = null, isAdminGlobal = false;
    let allProducts = [], allCustomers = [], allSuppliers = [], allSalesCache = [];

    function showFlash(containerId, text, isError = false) {
        let el = document.getElementById(containerId);
        if (!el) {
            el = document.createElement('div'); el.className = 'flash';
            const target = document.getElementById('tabContent') || document.getElementById('dashboard');
            if (target) target.prepend(el);
            else document.getElementById('app')?.prepend(el);
        }
        el.innerText = text;
        el.style.backgroundColor = isError ? '#ffe0e0' : '#e0f2fe';
        el.style.color = isError ? '#b91c1c' : '#065f46';
        setTimeout(() => el.remove(), 3500);
    }
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function formatDate(timestamp) { return timestamp?.toDate().toLocaleString('ar-EG') || 'غير محدد'; }

    async function ensureUserDocument(uid, email) {
        const userRef = db.collection('users').doc(uid);
        const doc = await userRef.get();
        if (doc.exists) {
            if (doc.data().isActive === false) throw new Error('الحساب معطل');
            return doc.data();
        }
        const newStoreId = `store_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const newUser = {
            email, role: 'owner', storeId: newStoreId,
            storeName: `محل ${email.split('@')[0]}`, isActive: true,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        await userRef.set(newUser);
        return newUser;
    }

    async function loadStoreData() {
        if (isAdminGlobal || !currentStoreId) return;
        const [prodSnap, custSnap, suppSnap] = await Promise.all([
            db.collection('products').where('storeId', '==', currentStoreId).get(),
            db.collection('customers').where('storeId', '==', currentStoreId).get(),
            db.collection('suppliers').where('storeId', '==', currentStoreId).get()
        ]);
        allProducts = prodSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allCustomers = custSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allSuppliers = suppSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function ensureSalesCache() {
        if (allSalesCache.length === 0 && currentStoreId) {
            const snapshot = await db.collection('sales').where('storeId', '==', currentStoreId).get();
            allSalesCache = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }
        return allSalesCache;
    }

    function buildTabs() {
        const tabsContainer = document.getElementById('navTabs');
        let tabs = isAdminGlobal ? [{ id: 'adminPanel', name: '📊 لوحة التحكم' }] : [
            { id: 'pos', name: '💰 نقطة البيع' },
            { id: 'products', name: '📦 المنتجات' },
            { id: 'customers', name: '👥 العملاء' },
            { id: 'suppliers', name: '🏭 الموردين' },
            { id: 'salesLog', name: '📋 سجل المبيعات' },
            { id: 'other', name: '📦 أخرى' }
        ];
        tabsContainer.innerHTML = tabs.map(t => `<button class="nav-btn" data-tab="${t.id}">${t.name}</button>`).join('');
        document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
        if (tabs.length) switchTab(tabs[0].id);
    }

    async function switchTab(tabId) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
        if (activeBtn) activeBtn.classList.add('active');
        const container = document.getElementById('tabContent');
        if (isAdminGlobal) { container.innerHTML = '<div class="flash">لوحة المشرف قيد التطوير</div>'; return; }
        await loadStoreData();
        if (tabId === 'pos') await renderPosTab(container);
        else if (tabId === 'products') await renderProductsTab(container);
        else if (tabId === 'customers') await renderCustomersTab(container);
        else if (tabId === 'suppliers') await renderSuppliersTab(container);
        else if (tabId === 'salesLog') await renderSalesLogTab(container);
        else if (tabId === 'other') await renderOtherTab(container);
    }

    // ====================== نقطة البيع (POS) ======================
    let cart = [];
    async function renderPosTab(container) {
        cart = [];
        let customersOpt = `<option value="">بدون عميل</option>` + allCustomers.map(c => `<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
        container.innerHTML = `
            <div style="background:#f8fafc; border-radius:32px; padding:20px;">
                <h3>💰 نقطة البيع السريعة</h3>
                <div class="pos-row">
                    <input type="text" id="searchProduct" placeholder="🔍 باركود أو اسم المنتج" oninput="searchProductLive()">
                    <select id="productSelect"><option>اختر منتج</option></select>
                    <input type="number" id="cartQty" placeholder="الكمية" value="1">
                    <button onclick="addToCart()" class="btn-sm">➕ أضف للسلة</button>
                </div>
                <div id="cartItems"></div>
                <div class="pos-row">
                    <select id="customerId">${customersOpt}</select>
                    <select id="paymentMethod"><option value="cash">كاش</option><option value="visa">فيزا</option><option value="credit">آجل</option></select>
                    <input type="number" id="paidAmount" placeholder="المدفوع" oninput="updateChange()">
                    <input type="text" id="changeAmount" placeholder="الباقي" readonly>
                </div>
                <div style="font-size:24px; font-weight:bold;" id="totalAmount">الإجمالي: 0 ج.م</div>
                <button onclick="confirmSale()" style="background:#10b981;">إتمام البيع</button>
                <div id="posFlash"></div>
            </div>`;
        const select = document.getElementById('productSelect');
        select.innerHTML = allProducts.map(p => `<option value="${p.id}" data-price="${p.priceRetail||p.price}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('');
        if (allProducts.length === 0) select.innerHTML = '<option>لا توجد منتجات</option>';
        window.searchProductLive = () => {
            let val = document.getElementById('searchProduct').value;
            let filtered = allProducts.filter(p => (p.barcode && p.barcode.includes(val)) || p.name.includes(val));
            let select = document.getElementById('productSelect');
            select.innerHTML = filtered.map(p => `<option value="${p.id}" data-price="${p.priceRetail||p.price}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('');
            if (filtered.length === 0) select.innerHTML = '<option>لا يوجد</option>';
        };
        window.addToCart = () => {
            let select = document.getElementById('productSelect');
            let prodId = select.value;
            if (!prodId || prodId === 'لا يوجد') return;
            let qty = parseInt(document.getElementById('cartQty').value);
            if (qty <= 0) return;
            let product = allProducts.find(p => p.id === prodId);
            if (!product || product.qty < qty) { showFlash('posFlash', 'كمية غير متوفرة', true); return; }
            let existing = cart.find(item => item.id === prodId);
            if (existing) existing.qty += qty;
            else cart.push({ id: prodId, name: product.name, price: product.priceRetail || product.price, qty });
            renderCart();
        };
        window.renderCart = () => {
            let cartDiv = document.getElementById('cartItems');
            let total = 0;
            let html = `<h4>السلة</h4>`;
            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                html += `<div class="card" style="padding:10px;">${item.name} x ${item.qty} = ${(item.price*item.qty).toFixed(2)} ج.م <button class="btn-sm btn-danger" onclick="removeFromCart(${idx})">حذف</button></div>`;
            });
            cartDiv.innerHTML = html;
            document.getElementById('totalAmount').innerHTML = `الإجمالي: ${total.toFixed(2)} ج.م`;
            updateChange();
        };
        window.removeFromCart = (idx) => { cart.splice(idx, 1); renderCart(); };
        window.updateChange = () => {
            let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            let paid = parseFloat(document.getElementById('paidAmount').value) || 0;
            document.getElementById('changeAmount').value = (paid > total) ? (paid - total).toFixed(2) : 0;
        };
        renderCart();
    }

    async function confirmSale() {
        if (cart.length === 0) return showFlash('posFlash', 'السلة فارغة', true);
        let customerId = document.getElementById('customerId').value || null;
        let paymentMethod = document.getElementById('paymentMethod').value;
        let paidAmount = parseFloat(document.getElementById('paidAmount').value) || 0;
        let totalAmount = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        let finalMethod = paymentMethod;
        let change = 0;
        let debtAdded = 0;
        if (customerId && paidAmount < totalAmount) {
            finalMethod = 'credit';
            debtAdded = totalAmount - paidAmount;
            paidAmount = totalAmount;
            change = 0;
            showFlash('posFlash', `سيتم إضافة ${debtAdded} ج.م كدين على العميل`, false);
        } else if (finalMethod !== 'credit' && paidAmount < totalAmount) {
            return showFlash('posFlash', 'المدفوع أقل من الإجمالي', true);
        } else if (finalMethod !== 'credit') {
            change = paidAmount - totalAmount;
            if (change < 0) return showFlash('posFlash', 'المدفوع أقل من الإجمالي', true);
        }
        try {
            const productRefs = cart.map(item => db.collection('products').doc(item.id));
            const productSnaps = await Promise.all(productRefs.map(ref => ref.get()));
            for (let i = 0; i < cart.length; i++) {
                if (productSnaps[i].data().qty < cart[i].qty) throw new Error(`المنتج ${cart[i].name} غير متوفر`);
            }
            const batch = db.batch();
            for (let i = 0; i < cart.length; i++) {
                batch.update(productRefs[i], { qty: productSnaps[i].data().qty - cart[i].qty });
            }
            for (let item of cart) {
                const saleRef = db.collection('sales').doc();
                batch.set(saleRef, {
                    productId: item.id, productName: item.name, quantity: item.qty,
                    unitPrice: item.price, total: item.price * item.qty,
                    paymentMethod: finalMethod, customerId, paidAmount, changeAmount: change,
                    storeId: currentStoreId, userId: currentUserAuth.uid,
                    cancelled: false, date: firebase.firestore.FieldValue.serverTimestamp()
                });
                const invRef = db.collection('inventoryTransactions').doc();
                batch.set(invRef, { type: 'sale', productId: item.id, productName: item.name, quantity: -item.qty, storeId: currentStoreId, date: firebase.firestore.FieldValue.serverTimestamp() });
            }
            if (customerId && debtAdded > 0) {
                const custRef = db.collection('customers').doc(customerId);
                const custSnap = await custRef.get();
                batch.update(custRef, { debt: (custSnap.data().debt || 0) + debtAdded });
            }
            await batch.commit();
            showFlash('posFlash', `✅ بيع ناجح بقيمة ${totalAmount} ج.م`, false);
            printReceipt(cart, totalAmount, finalMethod, customerId, change, debtAdded);
            await loadStoreData();
            renderPosTab(document.getElementById('tabContent'));
        } catch (err) {
            showFlash('posFlash', err.message, true);
        }
    }

    function printReceipt(cartItems, total, method, customerId, change, debtAdded) {
        let win = window.open();
        let customerName = customerId ? (allCustomers.find(c => c.id === customerId)?.name || 'عميل') : 'نقدي';
        let debtMsg = debtAdded > 0 ? `<p>تم إضافة مبلغ ${debtAdded} ج.م كدين على العميل</p>` : '';
        win.document.write(`
            <html dir="rtl"><head><style>body{font-family:Tajawal; padding:20px;} table{width:100%;border-collapse:collapse;} th,td{border-bottom:1px solid #ccc;padding:8px;text-align:center;} h2,h3{text-align:center;} @media print{button{display:none;}}</style></head>
            <body><h2>فاتورة البيع</h2><p>العميل: ${customerName}</p><p>التاريخ: ${new Date().toLocaleString('ar-EG')}</p>
            <table border="1" width="100%"><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
            <tbody>${cartItems.map(i => `<tr><td>${i.name}</td><td>${i.qty}践<td>${i.price}</td><td>${(i.qty*i.price).toFixed(2)}</td></tr>`).join('')}</tbody>
            <table>
            <h3>الإجمالي: ${total.toFixed(2)} ج.م</h3><p>طريقة الدفع: ${method}</p>
            ${method !== 'credit' ? `<p>المدفوع: ${(total+change).toFixed(2)} | الباقي: ${change.toFixed(2)}</p>` : ''}${debtMsg}
            <button onclick="window.print()">🖨️ طباعة</button></body></html>
        `);
    }

    // ====================== إدارة المنتجات ======================
    async function renderProductsTab(container) {
        await loadStoreData();
        container.innerHTML = `
            <h3>➕ إضافة منتج جديد</h3>
            <div class="grid-2">
                <input id="prodName" placeholder="اسم المنتج*"> <input id="prodBarcode" placeholder="باركود">
                <input id="prodPriceRetail" type="number" placeholder="سعر القطاعي"> <input id="prodPriceWholesale" type="number" placeholder="سعر الجملة">
                <input id="prodCost" type="number" placeholder="سعر الشراء"> <select id="prodUnit"><option>قطعة</option><option>كيلو</option></select>
                <input id="prodQty" type="number" placeholder="الكمية"> <input id="prodLowStock" type="number" placeholder="حد التنبيه">
                <input id="prodImage" placeholder="رابط الصورة"> <button onclick="addNewProduct()">إضافة منتج</button>
            </div>
            <h3>📋 قائمة المنتجات</h3><div id="productsListArea"></div>`;
        renderProductsList();
    }
    async function renderProductsList() {
        const area = document.getElementById('productsListArea');
        if (!area) return;
        let html = '';
        for (let p of allProducts) {
            let lowClass = (p.qty <= (p.lowStockAlert || 0)) ? 'low-stock' : '';
            html += `<div class="card ${lowClass}"><div class="card-info">${p.imageUrl ? `<img class="product-img" src="${p.imageUrl}">` : ''}<strong>${escapeHtml(p.name)}</strong> (باركود: ${p.barcode || '-'})<br>قطاعي: ${p.priceRetail} | جملة: ${p.priceWholesale} | الشراء: ${p.cost || 0}<br>الكمية: ${p.qty} ${p.unit} | التنبيه: ${p.lowStockAlert || 0}</div><div><button class="btn-sm" onclick="editProduct('${p.id}')">✏️</button><button class="btn-sm btn-danger" onclick="deleteProduct('${p.id}')">🗑️</button></div></div>`;
        }
        area.innerHTML = html || '<p>لا توجد منتجات</p>';
    }
    window.addNewProduct = async () => {
        const name = document.getElementById('prodName').value.trim();
        if (!name) return showFlash('productsListArea', 'الاسم مطلوب', true);
        await db.collection('products').add({
            name, barcode: document.getElementById('prodBarcode').value, storeId: currentStoreId,
            priceRetail: parseFloat(document.getElementById('prodPriceRetail').value)||0,
            priceWholesale: parseFloat(document.getElementById('prodPriceWholesale').value)||0,
            cost: parseFloat(document.getElementById('prodCost').value)||0,
            unit: document.getElementById('prodUnit').value, qty: parseInt(document.getElementById('prodQty').value)||0,
            lowStockAlert: parseInt(document.getElementById('prodLowStock').value)||0,
            imageUrl: document.getElementById('prodImage').value, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showFlash('productsListArea', 'تمت الإضافة');
        renderProductsTab(document.getElementById('tabContent'));
    };
    window.deleteProduct = async (id) => { if (confirm('حذف المنتج نهائياً؟')) { await db.collection('products').doc(id).delete(); renderProductsTab(document.getElementById('tabContent')); } };
    window.editProduct = async (id) => {
        let newName = prompt('اسم جديد'); if (!newName) return;
        let newPrice = parseFloat(prompt('سعر قطاعي جديد'));
        let newQty = parseInt(prompt('كمية جديدة'));
        await db.collection('products').doc(id).update({ name: newName, priceRetail: newPrice, qty: newQty });
        renderProductsTab(document.getElementById('tabContent'));
    };

    // ====================== العملاء ======================
    async function renderCustomersTab(container) {
        await loadStoreData();
        container.innerHTML = `<h3>👤 إضافة عميل جديد</h3><div class="pos-row"><input id="custName" placeholder="الاسم"><input id="custPhone" placeholder="الهاتف"><button onclick="addCustomer()">إضافة</button></div><h3>📋 قائمة العملاء</h3><div id="customersListDiv"></div>`;
        const listDiv = document.getElementById('customersListDiv');
        listDiv.innerHTML = allCustomers.map(c => `<div class="card"><div class="card-info"><strong>${escapeHtml(c.name)}</strong> - هاتف: ${c.phone || '-'} | دين: ${c.debt || 0} ج.م</div><div><button class="btn-sm" onclick="editCustomer('${c.id}')">✏️</button><button class="btn-sm btn-danger" onclick="deleteCustomer('${c.id}')">🗑️</button><button class="btn-sm" onclick="recordPayment('${c.id}')">تسديد</button></div></div>`).join('');
    }
    window.addCustomer = async () => {
        let name = document.getElementById('custName').value.trim();
        if (!name) return;
        await db.collection('customers').add({ name, phone: document.getElementById('custPhone').value, storeId: currentStoreId, debt: 0 });
        renderCustomersTab(document.getElementById('tabContent'));
    };
    window.editCustomer = async (id) => {
        let newName = prompt('اسم العميل الجديد'); if (!newName) return;
        let newPhone = prompt('رقم الهاتف الجديد');
        await db.collection('customers').doc(id).update({ name: newName, phone: newPhone });
        renderCustomersTab(document.getElementById('tabContent'));
    };
    window.deleteCustomer = async (id) => { if (confirm('حذف العميل؟')) { await db.collection('customers').doc(id).delete(); renderCustomersTab(document.getElementById('tabContent')); } };
    window.recordPayment = async (custId) => {
        let amount = parseFloat(prompt('المبلغ المسدد'));
        if (isNaN(amount)) return;
        const custRef = db.collection('customers').doc(custId);
        const doc = await custRef.get();
        let newDebt = (doc.data().debt || 0) - amount;
        await custRef.update({ debt: newDebt < 0 ? 0 : newDebt });
        renderCustomersTab(document.getElementById('tabContent'));
    };

    // ====================== الموردين ======================

        await loadStoreData();
        container.innerHTML = `<h3>🏭 إدارة الموردين</h3><div class="pos-row"><input id="supName" placeholder="اسم المورد"><input id="supPhone" placeholder="رقم الهاتف"><button onclick="addSupplier()">إضافة مورد</button></div><div id="suppliersList"></div>`;
        const listDiv = document.getElementById('suppliersList');
        let html = '';
        for (let s of allSuppliers) {
            html += `<div class="card"><div class="card-info"><strong>${escapeHtml(s.name)}</strong> - هاتف: ${s.phone || '-'}</div><div><button class="btn-sm" onclick="editSupplier('${s.id}')">✏️</button><button class="btn-sm btn-danger" onclick="deleteSupplier('${s.id}')">🗑️</button><button class="btn-sm" onclick="showSupplierProducts('${s.id}', '${escapeHtml(s.name)}')">📋 منتجات المورد</button></div></div>`;
        }
        listDiv.innerHTML = html || '<p>لا يوجد موردون</p>';

    window.showSupplierProducts = async (supplierId, supplierName) => {
        const container = document.getElementById('tabContent');
        const snap = await db.collection('suppliers').doc(supplierId).collection('products').get();
        let productsHtml = snap.docs.map(doc => `<div class="card"><div class="card-info">${escapeHtml(doc.data().name)} - سعر: ${doc.data().price || 0} ج.م</div><div><button class="btn-sm" onclick="deleteSupplierProduct('${supplierId}', '${doc.id}')">🗑️</button></div></div>`).join('');

            <div class="pos-row"><input id="productName" placeholder="اسم المنتج"><input id="productPrice" type="number" placeholder="السعر"><button onclick="addSupplierProduct('${supplierId}')">➕ إضافة منتج</button></div>
            <div id="supplierProductsList">${productsHtml}</div>
            <button class="btn-sm" onclick="renderSuppliersTab(document.getElementById('tabContent'))">🔙 رجوع</button>
        `;
    };
    window.addSupplierProduct = async (supplierId) => {
        const name = document.getElementById('productName').value.trim();
        const price = parseFloat(document.getElementById('productPrice').value);
        if (!name || isNaN(price)) return showFlash('supplierProductsList', 'البيانات غير صحيحة', true);

        showFlash('supplierProductsList', 'تمت الإضافة');
        window.showSupplierProducts(supplierId, '');
    };
    window.deleteSupplierProduct = async (supplierId, productId) => {
        if (!confirm('حذف المنتج؟')) return;
        await db.collection('suppliers').doc(supplierId).collection('products').doc(productId).delete();
        showFlash('supplierProductsList', 'تم الحذف');
        window.showSupplierProducts(supplierId, '');
    };
    window.addSupplier = async () => {
        let name = document.getElementById('supName').value.trim();
        if (!name) return;
        await db.collection('suppliers').add({ name, phone: document.getElementById('supPhone').value, storeId: currentStoreId });
        renderSuppliersTab(document.getElementById('tabContent'));
    };
    window.editSupplier = async (id) => {
        let newName = prompt('اسم المورد الجديد'); if (!newName) return;
        let newPhone = prompt('رقم الهاتف الجديد');
        await db.collection('suppliers').doc(id).update({ name: newName, phone: newPhone });
        renderSuppliersTab(document.getElementById('tabContent'));
    };
    window.deleteSupplier = async (id) => { if (confirm('حذف المورد؟')) { await db.collection('suppliers').doc(id).delete(); renderSuppliersTab(document.getElementById('tabContent')); } };

    // ====================== سجل المبيعات ======================
    let salesFilter = 'all';
    let selectedDate = '';
    async function renderSalesLogTab(container) {
        container.innerHTML = `
            <h3>📋 سجل المبيعات</h3>
            <div class="pos-row">
                <button class="btn-sm ${salesFilter === 'all' ? 'active' : ''}" onclick="setSalesFilter('all')">📋 الكل</button>
                <button class="btn-sm ${salesFilter === 'today' ? 'active' : ''}" onclick="setSalesFilter('today')">📅 اليوم</button>
                <button class="btn-sm ${salesFilter === 'yesterday' ? 'active' : ''}" onclick="setSalesFilter('yesterday')">📆 الأمس</button>
                <button class="btn-sm ${salesFilter === 'custom' ? 'active' : ''}" onclick="setSalesFilter('custom')">📅 تاريخ</button>
                <input type="date" id="customDatePicker" style="display:${salesFilter === 'custom' ? 'inline-block' : 'none'}" onchange="setCustomDate(this.value)">
                <button class="btn-sm btn-secondary" onclick="loadSalesLog()">تحديث</button>
            </div>
            <div id="salesLogList">جاري التحميل...</div>
            <hr>
            <h3>🏆 أكثر 10 منتجات مبيعًا خلال الأسبوع</h3>
            <div id="topProductsWeek">جاري التحميل...</div>
        `;
        await ensureSalesCache();
        filterAndDisplaySales();
        calculateTopProductsWeek();
    }
    function filterAndDisplaySales() {
        const container = document.getElementById('salesLogList');
        if (!container) return;
        let filtered = [...allSalesCache];
        const now = new Date();
        if (salesFilter === 'today') {
            const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            filtered = filtered.filter(s => s.date && s.date.toDate() >= start && s.date.toDate() < end);
        } else if (salesFilter === 'yesterday') {
            const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            const end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            filtered = filtered.filter(s => s.date && s.date.toDate() >= start && s.date.toDate() < end);
        } else if (salesFilter === 'custom' && selectedDate) {
            const start = new Date(selectedDate); start.setHours(0,0,0,0);
            const end = new Date(selectedDate); end.setHours(23,59,59,999);
            filtered = filtered.filter(s => s.date && s.date.toDate() >= start && s.date.toDate() <= end);
        }
        filtered.sort((a,b) => (b.date?.toDate() || 0) - (a.date?.toDate() || 0));
        if (filtered.length === 0) { container.innerHTML = '<p>⚠️ لا توجد مبيعات في هذا التاريخ</p>'; return; }
        let html = '';
        for (const s of filtered) {
            const isCancelled = s.cancelled === true;
            const customer = s.customerId ? allCustomers.find(c => c.id === s.customerId) : null;
            html += `<div class="card ${isCancelled ? 'cancelled' : ''}"><div class="card-info"><strong>${escapeHtml(s.productName)}</strong> - الكمية: ${s.quantity} | الإجمالي: ${s.total} ج.م<br>طريقة الدفع: ${s.paymentMethod} | العميل: ${customer ? customer.name : 'نقدي'}<br>التاريخ: ${formatDate(s.date)} | الحالة: ${isCancelled ? 'ملغاة' : 'ناجحة'}</div><div>${!isCancelled ? `<button class="btn-sm btn-danger" onclick="cancelSale('${s.id}')">إلغاء</button>` : ''}</div></div>`;
        }
        container.innerHTML = html;
    }
    function calculateTopProductsWeek() {
        const container = document.getElementById('topProductsWeek');
        if (!container) return;
        const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
        const productCount = {};
        for (const s of allSalesCache) {
            if (s.cancelled === true) continue;
            if (!s.productName || !s.date) continue;
            const saleDate = s.date.toDate();
            if (saleDate >= weekAgo) productCount[s.productName] = (productCount[s.productName] || 0) + (s.quantity || 0);
        }
        const sorted = Object.entries(productCount).sort((a,b) => b[1] - a[1]).slice(0,10);
        if (sorted.length === 0) { container.innerHTML = '<p>لا توجد مبيعات خلال الأسبوع الماضي</p>'; return; }
        container.innerHTML = sorted.map(([name, qty]) => `<div class="card"><div class="card-info">${escapeHtml(name)} : ${qty} وحدة</div></div>`).join('');
    }
    window.setSalesFilter = (filter) => {
        salesFilter = filter;
        const picker = document.getElementById('customDatePicker');
        if (picker) picker.style.display = filter === 'custom' ? 'inline-block' : 'none';
        if (filter !== 'custom') selectedDate = '';
        filterAndDisplaySales();
    };
    window.setCustomDate = (date) => { selectedDate = date; filterAndDisplaySales(); };
    window.loadSalesLog = async () => { await ensureSalesCache(); filterAndDisplaySales(); calculateTopProductsWeek(); };
    window.cancelSale = async (saleId) => {
        if (!confirm('إلغاء هذه العملية؟ سيتم إعادة الكمية للمخزون.')) return;
        try {
            const saleRef = db.collection('sales').doc(saleId);
            const saleDoc = await saleRef.get();
            if (!saleDoc.exists || saleDoc.data().cancelled) throw new Error('لا يمكن الإلغاء');
            const sale = saleDoc.data();
            const productRef = db.collection('products').doc(sale.productId);
            const productDoc = await productRef.get();
            const batch = db.batch();
            if (productDoc.exists) batch.update(productRef, { qty: (productDoc.data().qty || 0) + sale.quantity });
            batch.update(saleRef, { cancelled: true });
            await batch.commit();
            const index = allSalesCache.findIndex(s => s.id === saleId);
            if (index !== -1) allSalesCache[index].cancelled = true;
            filterAndDisplaySales();
            calculateTopProductsWeek();
            showFlash('salesLogList', 'تم إلغاء البيع' + (productDoc.exists ? ' وأعيدت الكمية' : ''), false);
        } catch (err) { showFlash('salesLogList', err.message, true); }
    };

    // ====================== تبويب "أخرى" ======================
    let otherSubTab = 'inventory';
    async function renderOtherTab(container) {
        container.innerHTML = `
            <h3>📦 القائمة الإضافية</h3>
            <div class="sub-tabs">
                <div class="sub-tab ${otherSubTab === 'inventory' ? 'active' : ''}" onclick="setOtherSubTab('inventory')">📦 المخزون</div>
                <div class="sub-tab ${otherSubTab === 'hottest' ? 'active' : ''}" onclick="setOtherSubTab('hottest')">🔥 الأكثر مبيعاً (نطاق زمني)</div>
                <div class="sub-tab ${otherSubTab === 'account' ? 'active' : ''}" onclick="setOtherSubTab('account')">ℹ️ معلومات الحساب</div>
                <div class="sub-tab ${otherSubTab === 'reports' ? 'active' : ''}" onclick="setOtherSubTab('reports')">📊 التقارير</div>
                <div class="sub-tab ${otherSubTab === 'todaySales' ? 'active' : ''}" onclick="setOtherSubTab('todaySales')">📆 مبيعات اليوم</div>
                <div class="sub-tab ${otherSubTab === 'yesterdaySales' ? 'active' : ''}" onclick="setOtherSubTab('yesterdaySales')">📆 مبيعات الأمس</div>
                <div class="sub-tab ${otherSubTab === 'contact' ? 'active' : ''}" onclick="setOtherSubTab('contact')">📱 تواصل معنا</div>
            </div>
            <div id="otherContent"></div>
        `;
        await loadOtherSubContent();
    }
    window.setOtherSubTab = (tab) => { otherSubTab = tab; renderOtherTab(document.getElementById('tabContent')); };
    async function loadOtherSubContent() {
        const containerDiv = document.getElementById('otherContent');
        if (!containerDiv) return;
        if (otherSubTab === 'inventory') {
            containerDiv.innerHTML = `<h3>📦 المخزون الحالي</h3><div id="inventoryList"></div>`;
            const listDiv = document.getElementById('inventoryList');
            let html = '';
            for (let p of allProducts) html += `<div class="card"><div class="card-info"><strong>${escapeHtml(p.name)}</strong> - الكمية: ${p.qty} ${p.unit} | سعر القطاعي: ${p.priceRetail} | سعر الجملة: ${p.priceWholesale}</div></div>`;
            listDiv.innerHTML = html || '<p>لا توجد منتجات</p>';
        } else if (otherSubTab === 'hottest') {
            containerDiv.innerHTML = `
                <h3>🔥 أكثر 5 منتجات مبيعاً في نطاق زمني</h3>
                <div class="pos-row">
                    <input type="datetime-local" id="startTime" placeholder="من تاريخ">
                    <input type="datetime-local" id="endTime" placeholder="إلى تاريخ">
                    <button onclick="calculateHottestProducts()">عرض</button>
                </div>
                <div id="hottestResult"></div>
            `;
        } else if (otherSubTab === 'account') {
            const user = auth.currentUser;
            const userId = user?.email?.replace('@bkalla.com', '') || 'غير متوفر';
            const storeName = userData?.storeName || 'غير متوفر';
            containerDiv.innerHTML = `
                <h3>ℹ️ معلومات الحساب</h3><div class="card"><div class="card-info"><p><strong>🆔 الـ ID:</strong> ${escapeHtml(userId)}</p><p><strong>🏪 اسم المحل:</strong> ${escapeHtml(storeName)}</p></div></div>
                <h3>🔐 تغيير كلمة المرور</h3><div class="card"><div class="card-info"><input type="password" id="oldPassword" placeholder="كلمة المرور القديمة"><input type="password" id="newPassword1" placeholder="كلمة المرور الجديدة"><input type="password" id="newPassword2" placeholder="تأكيد كلمة المرور الجديدة"><button onclick="changePassword()" class="btn-secondary">تغيير كلمة المرور</button><div id="passwordMsg" class="flash" style="display:none;"></div></div></div>
            `;
        } else if (otherSubTab === 'reports') {
            await renderReportsInside(containerDiv);
        } else if (otherSubTab === 'todaySales') {
            await renderDaySalesWithStats(containerDiv, 'today');
        } else if (otherSubTab === 'yesterdaySales') {
            await renderDaySalesWithStats(containerDiv, 'yesterday');
        } else if (otherSubTab === 'contact') {
            containerDiv.innerHTML = `<div class="card"><div class="card-info"><a href="https://t.me/amgadmousa1000" target="_blank"><button class="btn-secondary">📱 تواصل معنا عبر تليجرام</button></a></div></div>`;
        }
    }

    async function renderDaySalesWithStats(container, dayType) {
        await ensureSalesCache();
        const now = new Date();
        let start, end;
        const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        let dayName;
        if (dayType === 'today') {
            start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            dayName = dayNames[now.getDay()];
            container.innerHTML = `<h3>📆 مبيعات اليوم (${dayName})</h3><div id="daySalesList"></div><div id="dayStats"></div>`;
        } else {
            start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterdayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            dayName = dayNames[yesterdayDate.getDay()];
            container.innerHTML = `<h3>📆 مبيعات الأمس (${dayName})</h3><div id="daySalesList"></div><div id="dayStats"></div>`;
        }
        const filtered = allSalesCache.filter(s => {
            if (!s.date || s.cancelled === true) return false;
            const saleDate = s.date.toDate();
            return saleDate >= start && saleDate < end;
        });
        const listDiv = document.getElementById('daySalesList');
        if (filtered.length === 0) {
            listDiv.innerHTML = '<p>لا توجد مبيعات</p>';
            document.getElementById('dayStats').innerHTML = '';
            return;
        }
        let html = '';
        let totalSales = 0;
        let totalProfit = 0;
        for (const sale of filtered) {
            totalSales += sale.total;
            const product = allProducts.find(p => p.id === sale.productId);
            const cost = product?.cost || 0;
            totalProfit += sale.total - (cost * sale.quantity);
            html += `<div class="card"><div class="card-info">${escapeHtml(sale.productName)} - الكمية: ${sale.quantity} - الإجمالي: ${sale.total} ج.م</div></div>`;
        }
        listDiv.innerHTML = html;
        const statsDiv = document.getElementById('dayStats');
        statsDiv.innerHTML = `<div class="card" style="background:#e0f2fe;"><div class="card-info"><strong>📊 إجمالي المبيعات: ${totalSales.toFixed(2)} ج.م</strong><br><strong>💰 إجمالي الأرباح: ${totalProfit.toFixed(2)} ج.م</strong></div></div>`;
    }

    window.calculateHottestProducts = async () => {
        const startInput = document.getElementById('startTime').value;
        const endInput = document.getElementById('endTime').value;
        if (!startInput || !endInput) return showFlash('hottestResult', 'يرجى تحديد النطاق الزمني', true);
        const start = new Date(startInput), end = new Date(endInput);
        await ensureSalesCache();
        const productCount = {};
        for (const sale of allSalesCache) {
            if (sale.cancelled === true) continue;
            const saleDate = sale.date?.toDate();
            if (saleDate && saleDate >= start && saleDate <= end) productCount[sale.productName] = (productCount[sale.productName] || 0) + sale.quantity;
        }
        const sorted = Object.entries(productCount).sort((a,b) => b[1] - a[1]).slice(0,5);
        const resultDiv = document.getElementById('hottestResult');
        if (sorted.length === 0) { resultDiv.innerHTML = '<p>لا توجد مبيعات في هذا النطاق</p>'; return; }
        resultDiv.innerHTML = sorted.map(([name, qty]) => `<div class="card"><div class="card-info">${escapeHtml(name)} : ${qty} وحدة</div></div>`).join('');
    };

    async function renderReportsInside(container) {
        await loadStoreData();
        const salesSnap = await db.collection('sales').where('storeId', '==', currentStoreId).where('cancelled', '==', false).get();
        let totalProfit = 0, productSales = {};
        for (const doc of salesSnap.docs) {
            let sale = doc.data();
            let product = allProducts.find(p => p.id === sale.productId);
            let cost = product?.cost || 0;
            totalProfit += sale.total - (cost * sale.quantity);
            productSales[sale.productName] = (productSales[sale.productName] || 0) + sale.quantity;
        }
        let best = Object.keys(productSales).length ? Object.keys(productSales).reduce((a, b) => productSales[a] > productSales[b] ? a : b) : 'لا يوجد';
        let lowStock = allProducts.filter(p => p.qty <= (p.lowStockAlert || 0)).map(p => p.name).join(', ') || 'لا يوجد';
        container.innerHTML = `<div class="grid-2"><div class="stat-card">💰 إجمالي الأرباح: ${totalProfit.toFixed(2)} ج.م</div><div class="stat-card">🏆 الأكثر مبيعاً: ${best}</div><div class="stat-card">⚠️ منتجات منخفضة المخزون: ${lowStock}</div></div><button class="btn-secondary" onclick="renderReportsInside(document.getElementById('otherContent'))">تحديث</button>`;
    }

    window.changePassword = async () => {
        const oldPwd = document.getElementById('oldPassword').value;
        const newPwd1 = document.getElementById('newPassword1').value;
        const newPwd2 = document.getElementById('newPassword2').value;
        const msgDiv = document.getElementById('passwordMsg');
        if (!oldPwd || !newPwd1 || !newPwd2) { msgDiv.style.display='block'; msgDiv.style.backgroundColor='#ffe0e0'; msgDiv.style.color='#b91c1c'; msgDiv.innerText='الرجاء ملء جميع الحقول'; setTimeout(()=>msgDiv.style.display='none',3000); return; }
        if (newPwd1 !== newPwd2) { msgDiv.style.display='block'; msgDiv.style.backgroundColor='#ffe0e0'; msgDiv.style.color='#b91c1c'; msgDiv.innerText='كلمة المرور الجديدة غير متطابقة'; setTimeout(()=>msgDiv.style.display='none',3000); return; }
        if (newPwd1.length < 6) { msgDiv.style.display='block'; msgDiv.style.backgroundColor='#ffe0e0'; msgDiv.style.color='#b91c1c'; msgDiv.innerText='كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل'; setTimeout(()=>msgDiv.style.display='none',3000); return; }
        const user = auth.currentUser;
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, oldPwd);
        try {
            await user.reauthenticateWithCredential(credential);
            await user.updatePassword(newPwd1);
            msgDiv.style.display='block'; msgDiv.style.backgroundColor='#e0f2fe'; msgDiv.style.color='#065f46'; msgDiv.innerText='✅ تم تغيير كلمة المرور بنجاح';
            document.getElementById('oldPassword').value = ''; document.getElementById('newPassword1').value = ''; document.getElementById('newPassword2').value = '';
            setTimeout(()=>msgDiv.style.display='none',3000);
        } catch (err) {
            msgDiv.style.display='block'; msgDiv.style.backgroundColor='#ffe0e0'; msgDiv.style.color='#b91c1c';
            msgDiv.innerText = err.code === 'auth/wrong-password' ? 'كلمة المرور القديمة خاطئة' : 'حدث خطأ، حاول مرة أخرى';
            setTimeout(()=>msgDiv.style.display='none',3000);
        }
    };

    // ====================== تسجيل الدخول والخروج مع استمرار الجلسة ======================
    async function handleSignedInUser(user) {
        try {
            const userInfo = await ensureUserDocument(user.uid, user.email);
            currentUserAuth = user;
            userData = userInfo;
            currentStoreId = userInfo.storeId;
            currentRole = userInfo.role;
            isAdminGlobal = (currentRole === 'admin');
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('storeTitle').innerHTML = `<i class="fas fa-store"></i> ${userInfo.storeName || 'المحل'}`;
            if (!isAdminGlobal) await loadStoreData();
            buildTabs();
        } catch (err) {
            console.error("فشل تحميل بيانات المستخدم:", err);
            await auth.signOut();
            location.reload();
        }
    }

    async function loginUser() {
        const id = document.getElementById('loginId').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        if (!id || !pwd) { document.getElementById('loginError').innerText = 'الرجاء إدخال ID وكلمة المرور'; return; }
        const email = id + "@bkalla.com";
        try {
            const cred = await auth.signInWithEmailAndPassword(email, pwd);
            await handleSignedInUser(cred.user);
        } catch (e) {
            document.getElementById('loginError').innerText = 'فشل الدخول: تحقق من ID وكلمة المرور';
        }
    }

    window.logoutUser = async () => {
        await auth.signOut();
        location.reload();
    };

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            // مستخدم مسجل الدخول بالفعل
            await handleSignedInUser(user);
        } else {
            // لا يوجد مستخدم: عرض شاشة الدخول
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
        }
    });
</script>
