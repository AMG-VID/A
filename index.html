<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مـحـلاتـي - نظام فواتير وإرجاع كامل</title>
    <link rel="icon" type="image/jpeg" href="Icon.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(145deg, #eef2ff, #e0e7ff); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: auto; background: rgba(255,255,255,0.96); border-radius: 40px; padding: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.1); }
        .login-box { text-align: center; padding: 40px 20px; max-width: 420px; margin: auto; }
        h1, h2, h3 { color: #4c1d95; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 30px; border: 1px solid #cbd5e1; font-size: 15px; }
        input:focus, select:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.2); outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 30px; background: linear-gradient(95deg, #2563eb, #8b5cf6); color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition:0.2s; }
        button:active { transform: scale(0.97); }
        .btn-secondary { background: #f97316; }
        .btn-danger { background: #dc2626; }
        .btn-sm { width: auto; padding: 6px 14px; margin: 3px; cursor: pointer; display: inline-block; }
        .top-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; background: #f1f5f9; padding: 8px; border-radius: 60px; }
        .nav-btn { background: transparent; color: #334155; width: auto; padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .nav-btn.active { background: #4f46e5; color: white; box-shadow: 0 6px 12px rgba(79,70,229,0.3); }
        .card { background: white; padding: 12px; border-radius: 24px; margin: 10px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-right: 5px solid #8b5cf6; gap: 8px; }
        .card-info { flex: 1; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 18px; }
        .stat-card { background: #f9fafb; padding: 18px; border-radius: 28px; text-align: center; border: 1px solid #e2e8f0; }
        .low-stock { background: #fee2e2; border-right-color: #ef4444; }
        .pos-row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin: 12px 0; }
        .pos-row > * { flex: 1; }
        .flash { padding: 12px; border-radius: 30px; margin: 10px 0; background: #e6f7e6; color: #166534; }
        @media (max-width:700px) { .container { padding: 15px; } }
        img.product-img { width: 45px; height: 45px; object-fit: cover; border-radius: 12px; margin-left: 8px; }
        .cancelled { background: #f8d7da; border-right-color: #dc3545; opacity: 0.8; }
        .sub-tabs { display: flex; gap: 8px; margin: 15px 0; flex-wrap: wrap; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .sub-tab { background: #eef2ff; padding: 8px 16px; border-radius: 30px; cursor: pointer; }
        .sub-tab.active { background: #4f46e5; color: white; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="loginScreen">
        <div class="login-box">
            <h1><i class="fas fa-store"></i>إدارة محلاتي (فواتير وإرجاع)</h1>
            <input type="text" id="loginId" placeholder="اسم المستخدم (ID فقط)" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button onclick="loginUser()">دخول</button>
            <div id="loginError" style="color:#dc2626; margin-top:12px;"></div>
        </div>
    </div>
    <div id="dashboard" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:15px;">
            <h2 id="storeTitle"><i class="fas fa-store"></i> المتجر</h2>
            <button onclick="logoutUser()" class="btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
        <div class="top-nav" id="navTabs"></div>
        <div id="tabContent"></div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
        authDomain: "bakkala-system.firebaseapp.com",
        projectId: "bakkala-system",
        storageBucket: "bakkala-system.firebasestorage.app",
        messagingSenderId: "807660158854",
        appId: "1:807660158854:web:c3690293a27185f07fb607"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    db.enablePersistence({ synchronizeTabs: true })
        .then(() => console.log("تم تمكين التخزين المحلي"))
        .catch(err => console.error("فشل تمكين persistence", err));

    let currentUserAuth = null, userData = null, currentStoreId = null, currentRole = null, isAdminGlobal = false;
    let allProducts = [], allCustomers = [], allSuppliers = [], allSalesCache = [];
    let lastReceiptData = null;

    function showFlash(containerId, text, isError = false) {
        let el = document.getElementById(containerId);
        if (!el) {
            el = document.createElement('div'); el.className = 'flash';
            const target = document.getElementById('tabContent') || document.getElementById('dashboard');
            if (target) target.prepend(el);
            else document.getElementById('app')?.prepend(el);
        }
        el.innerText = text;
        el.style.backgroundColor = isError ? '#ffe0e0' : '#e0f2fe';
        el.style.color = isError ? '#b91c1c' : '#065f46';
        setTimeout(() => el.remove(), 3500);
    }
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function formatDate(timestamp) { return timestamp?.toDate().toLocaleString('ar-EG') || 'غير محدد'; }

    function getStoreRef() { return db.collection('stores').doc(currentStoreId); }
    function getProductsCol() { return getStoreRef().collection('products'); }
    function getCustomersCol() { return getStoreRef().collection('customers'); }
    function getSuppliersCol() { return getStoreRef().collection('suppliers'); }
    function getSalesCol() { return getStoreRef().collection('sales'); }
    function getInventoryCol() { return getStoreRef().collection('inventoryTransactions'); }

    async function ensureStoreDocument(storeId, storeName) {
        const storeRef = db.collection('stores').doc(storeId);
        const doc = await storeRef.get();
        if (!doc.exists) await storeRef.set({ name: storeName, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        return storeRef;
    }

    async function ensureUserDocument(uid, email) {
        const userRef = db.collection('users').doc(uid);
        const doc = await userRef.get();
        if (doc.exists) {
            if (doc.data().isActive === false) throw new Error('الحساب معطل');
            const data = doc.data();
            await ensureStoreDocument(data.storeId, data.storeName || 'محل تجاري');
            return data;
        }
        const newStoreId = `store_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const storeName = `محل ${email.split('@')[0]}`;
        await ensureStoreDocument(newStoreId, storeName);
        const newUser = { email, role: 'owner', storeId: newStoreId, storeName, isActive: true, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        await userRef.set(newUser);
        return newUser;
    }

    async function loadStoreData() {
        if (isAdminGlobal || !currentStoreId) return;
        const [prodSnap, custSnap, suppSnap] = await Promise.all([getProductsCol().get(), getCustomersCol().get(), getSuppliersCol().get()]);
        allProducts = prodSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allCustomers = custSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allSuppliers = suppSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function ensureSalesCache() {
        if (allSalesCache.length === 0 && currentStoreId) {
            const snapshot = await getSalesCol().get();
            allSalesCache = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }
        return allSalesCache;
    }

    function buildTabs() {
        const tabsContainer = document.getElementById('navTabs');
        let tabs = isAdminGlobal ? [{ id: 'adminPanel', name: '📊 لوحة التحكم' }] : [
            { id: 'pos', name: '💰 نقطة البيع' },
            { id: 'products', name: '📦 المنتجات' },
            { id: 'customers', name: '👥 العملاء' },
            { id: 'suppliers', name: '🏭 الموردين' },
            { id: 'salesLog', name: '📋 سجل المبيعات' },
            { id: 'invoices', name: '🧾 الفواتير' },
            { id: 'other', name: '📦 أخرى' }
        ];
        tabsContainer.innerHTML = tabs.map(t => `<button class="nav-btn" data-tab="${t.id}">${t.name}</button>`).join('');
        document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
        if (tabs.length) switchTab(tabs[0].id);
    }

    async function switchTab(tabId) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
        if (activeBtn) activeBtn.classList.add('active');
        const container = document.getElementById('tabContent');
        if (isAdminGlobal) { container.innerHTML = '<div class="flash">لوحة المشرف قيد التطوير</div>'; return; }
        await loadStoreData();
        if (tabId === 'pos') await renderPosTab(container);
        else if (tabId === 'products') await renderProductsTab(container);
        else if (tabId === 'customers') await renderCustomersTab(container);
        else if (tabId === 'suppliers') await renderSuppliersTab(container);
        else if (tabId === 'salesLog') await renderSalesLogTab(container);
        else if (tabId === 'invoices') await renderInvoicesTab(container);
        else if (tabId === 'other') await renderOtherTab(container);
    }

    // ========================================== POS ==========================================
    let cart = [];
    async function renderPosTab(container) {
        cart = [];
        lastReceiptData = null;
        let customersOpt = `<option value="">بدون عميل</option>` + allCustomers.map(c => `<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
        container.innerHTML = `
            <div style="background:#f8fafc; border-radius:32px; padding:20px;">
                <h3>💰 نقطة البيع السريعة</h3>
                <div class="pos-row">
                    <input type="text" id="searchProduct" placeholder="🔍 باركود أو اسم المنتج" oninput="searchProductLive()">
                    <select id="productSelect"><option>اختر منتج</option></select>
                    <input type="number" id="cartQty" placeholder="الكمية" value="1">
                    <button onclick="addToCart()" class="btn-sm">➕ أضف للسلة</button>
                </div>
                <div id="cartItems"></div>
                <div class="pos-row">
                    <select id="customerId">${customersOpt}</select>
                    <select id="paymentMethod"><option value="cash">كاش</option><option value="visa">فيزا</option><option value="credit">آجل</option></select>
                    <input type="number" id="paidAmount" placeholder="المدفوع" oninput="updateChange()">
                    <input type="text" id="changeAmount" placeholder="الباقي" readonly>
                </div>
                <div style="font-size:24px; font-weight:bold;" id="totalAmount">الإجمالي: 0 ج.م</div>
                <button onclick="confirmSale()" style="background:#10b981;">إتمام البيع</button>
                <div id="posFlash"></div>
                <div id="printReceiptArea" style="margin-top:10px; display:none;">
                    <button onclick="printLastReceipt()" style="background:#22c55e; width:auto; padding:8px 20px;">🖨️ طباعة الفاتورة</button>
                </div>
            </div>`;
        const select = document.getElementById('productSelect');
        select.innerHTML = allProducts.map(p => `<option value="${p.id}" data-price="${p.priceRetail||p.price}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('');
        if (allProducts.length === 0) select.innerHTML = '<option>لا توجد منتجات</option>';
        window.searchProductLive = () => {
            let val = document.getElementById('searchProduct').value;
            let filtered = allProducts.filter(p => (p.barcode && p.barcode.includes(val)) || p.name.includes(val));
            let select = document.getElementById('productSelect');
            select.innerHTML = filtered.map(p => `<option value="${p.id}" data-price="${p.priceRetail||p.price}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('');
            if (filtered.length === 0) select.innerHTML = '<option>لا يوجد</option>';
        };
        window.addToCart = () => {
            let select = document.getElementById('productSelect');
            let prodId = select.value;
            if (!prodId || prodId === 'لا يوجد') return;
            let qty = parseInt(document.getElementById('cartQty').value);
            if (qty <= 0) return;
            let product = allProducts.find(p => p.id === prodId);
            if (!product || product.qty < qty) { showFlash('posFlash', 'كمية غير متوفرة', true); return; }
            let existing = cart.find(item => item.id === prodId);
            if (existing) existing.qty += qty;
            else cart.push({ id: prodId, name: product.name, price: product.priceRetail || product.price, qty });
            renderCart();
        };
        window.renderCart = () => {
            let cartDiv = document.getElementById('cartItems');
            let total = 0;
            let html = `<h4>السلة</h4>`;
            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                html += `<div class="card" style="padding:10px;">${item.name} x ${item.qty} = ${(item.price*item.qty).toFixed(2)} ج.م <button class="btn-sm btn-danger" onclick="removeFromCart(${idx})">حذف</button></div>`;
            });
            cartDiv.innerHTML = html;
            document.getElementById('totalAmount').innerHTML = `الإجمالي: ${total.toFixed(2)} ج.م`;
            updateChange();
        };
        window.removeFromCart = (idx) => { cart.splice(idx, 1); renderCart(); };
        window.updateChange = () => {
            let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            let paid = parseFloat(document.getElementById('paidAmount').value) || 0;
            document.getElementById('changeAmount').value = (paid > total) ? (paid - total).toFixed(2) : 0;
        };
        renderCart();
    }

    async function confirmSale() {
        if (cart.length === 0) return showFlash('posFlash', 'السلة فارغة', true);
        let customerId = document.getElementById('customerId').value || null;
        let paymentMethod = document.getElementById('paymentMethod').value;
        let paidAmount = parseFloat(document.getElementById('paidAmount').value) || 0;
        let totalAmount = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        let finalMethod = paymentMethod;
        let change = 0;
        let debtAdded = 0;
        if (customerId && paidAmount < totalAmount) {
            finalMethod = 'credit';
            debtAdded = totalAmount - paidAmount;
            paidAmount = totalAmount;
            change = 0;
            showFlash('posFlash', `سيتم إضافة ${debtAdded} ج.م كدين على العميل`, false);
        } else if (finalMethod !== 'credit' && paidAmount < totalAmount) {
            return showFlash('posFlash', 'المدفوع أقل من الإجمالي', true);
        } else if (finalMethod !== 'credit') {
            change = paidAmount - totalAmount;
            if (change < 0) return showFlash('posFlash', 'المدفوع أقل من الإجمالي', true);
        }
        try {
            const productRefs = cart.map(item => getProductsCol().doc(item.id));
            const productSnaps = await Promise.all(productRefs.map(ref => ref.get()));
            for (let i = 0; i < cart.length; i++) if (productSnaps[i].data().qty < cart[i].qty) throw new Error(`المنتج ${cart[i].name} غير متوفر`);
            const batch = db.batch();
            for (let i = 0; i < cart.length; i++) batch.update(productRefs[i], { qty: productSnaps[i].data().qty - cart[i].qty });
            
            const saleId = getSalesCol().doc().id;
            const saleRef = getSalesCol().doc(saleId);
            const itemsData = cart.map(item => ({ productId: item.id, productName: item.name, quantity: item.qty, unitPrice: item.price, total: item.price * item.qty }));
            batch.set(saleRef, {
                saleId, items: itemsData, total: totalAmount, paymentMethod: finalMethod, customerId, paidAmount, changeAmount: change,
                userId: currentUserAuth.uid, cancelled: false, date: firebase.firestore.FieldValue.serverTimestamp()
            });
            for (let item of cart) {
                const invRef = getInventoryCol().doc();
                batch.set(invRef, { type: 'sale', productId: item.id, productName: item.name, quantity: -item.qty, date: firebase.firestore.FieldValue.serverTimestamp() });
            }
            if (customerId && debtAdded > 0) {
                const custRef = getCustomersCol().doc(customerId);
                const custSnap = await custRef.get();
                batch.update(custRef, { debt: (custSnap.data().debt || 0) + debtAdded });
            }
            await batch.commit();
            showFlash('posFlash', `✅ بيع ناجح بقيمة ${totalAmount} ج.م`, false);
            lastReceiptData = { saleId, cartItems: cart.map(i => ({ name: i.name, qty: i.qty, price: i.price })), total: totalAmount, method: finalMethod, customerId, change, debtAdded };
            document.getElementById('printReceiptArea').style.display = 'block';
            await loadStoreData();
            await ensureSalesCache();
            cart = [];
            renderCart();
        } catch (err) { showFlash('posFlash', err.message, true); }
    }

    function printLastReceipt() { if(lastReceiptData) printInvoiceFromData(lastReceiptData); }
    function printInvoiceFromData(invoice) {
        if(!invoice) return;
        const { cartItems, total, method, customerId, change, debtAdded, saleId, items } = invoice;
        let itemsArr = cartItems || items;
        if(!itemsArr) return;
        let customerName = customerId ? (allCustomers.find(c => c.id === customerId)?.name || 'عميل') : 'نقدي';
        let debtMsg = debtAdded > 0 ? `<p>تم إضافة مبلغ ${debtAdded} ج.م كدين على العميل</p>` : '';
        let win = window.open('', '_blank');
        win.document.write(`<html dir="rtl"><head><style>body{font-family:'Tajawal';padding:20px;}table{width:100%;border-collapse:collapse;}th,td{border-bottom:1px solid #ccc;padding:8px;text-align:center;}h2,h3{text-align:center;}@media print{.no-print{display:none;}}</style></head><body><h2>فاتورة البيع</h2><p>العميل: ${customerName}</p><p>التاريخ: ${new Date().toLocaleString('ar-EG')}</p><table border="1" width="100%"><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${itemsArr.map(i => `<tr><td>${escapeHtml(i.name || i.productName)}</td><td>${i.qty || i.quantity}</td><td>${i.price || i.unitPrice}</td><td>${((i.qty||i.quantity)*(i.price||i.unitPrice)).toFixed(2)}</td></tr>`).join('')}</tbody></table><h3>الإجمالي: ${total.toFixed(2)} ج.م</h3><p>طريقة الدفع: ${method}</p>${method !== 'credit' ? `<p>المدفوع: ${(total+change).toFixed(2)} | الباقي: ${change.toFixed(2)}</p>` : ''}${debtMsg}<div class="no-print" style="text-align:center;margin-top:20px;"><button onclick="window.print()">🖨️ طباعة</button></div></body></html>`);
        win.document.close(); win.focus(); win.print();
    }

    // ========================================== فواتير اليوم ==========================================
    async function renderInvoicesTab(container) {
        await ensureSalesCache();
        const todayStart = new Date(); todayStart.setHours(0,0,0,0);
        const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
        const dayNames = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const todayName = dayNames[new Date().getDay()];
        const invoicesToday = allSalesCache.filter(s => !s.cancelled && s.date && s.date.toDate() >= todayStart && s.date.toDate() <= todayEnd);
        invoicesToday.sort((a,b) => (b.date?.toDate()||0) - (a.date?.toDate()||0));
        let html = `<h3>🧾 فواتير اليوم (${todayName})</h3>`;
        if(invoicesToday.length === 0) html += '<p>لا توجد فواتير اليوم</p>';
        else {
            for(const inv of invoicesToday) {
                const customer = inv.customerId ? allCustomers.find(c=>c.id===inv.customerId) : null;
                const totalItems = inv.items ? inv.items.length : 1;
                html += `<div class="card" style="border-right-color: #10b981;">
                    <div class="card-info">
                        <strong>📄 فاتورة رقم: ${inv.id.slice(-6)}</strong><br>
                        🕒 ${formatDate(inv.date)}<br>
                        💰 الإجمالي: ${inv.total} ج.م | 👤 العميل: ${customer ? customer.name : 'نقدي'} | 💳 الدفع: ${inv.paymentMethod}<br>
                        📦 عدد الأصناف: ${totalItems}
                    </div>
                    <div>
                        <button class="btn-sm btn-secondary" onclick="reprintInvoice('${inv.id}')"><i class="fas fa-print"></i> طباعة</button>
                        <button class="btn-sm btn-danger" onclick="returnInvoice('${inv.id}')"><i class="fas fa-undo-alt"></i> إرجاع</button>
                    </div>
                </div>`;
            }
        }
        container.innerHTML = html;
    }

    window.reprintInvoice = async (saleId) => {
        const sale = allSalesCache.find(s => s.id === saleId);
        if(!sale) { showFlash('tabContent', 'الفاتورة غير موجودة', true); return; }
        let items = sale.items;
        if(!items) items = [{ productId: sale.productId, productName: sale.productName, quantity: sale.quantity, unitPrice: sale.unitPrice, total: sale.total }];
        const invoiceData = {
            saleId: sale.id,
            cartItems: items.map(it => ({ name: it.productName, qty: it.quantity, price: it.unitPrice })),
            total: sale.total,
            method: sale.paymentMethod,
            customerId: sale.customerId,
            change: sale.changeAmount || 0,
            debtAdded: (sale.paymentMethod === 'credit' && sale.paidAmount < sale.total) ? (sale.total - sale.paidAmount) : 0
        };
        printInvoiceFromData(invoiceData);
    };

    window.returnInvoice = async (saleId) => {
        if(!confirm('هل تريد إرجاع هذه الفاتورة بالكامل؟ سيتم إعادة جميع المنتجات إلى المخزون وتحديث دين العميل إن وجد.')) return;
        try {
            const saleRef = getSalesCol().doc(saleId);
            const saleDoc = await saleRef.get();
            if(!saleDoc.exists || saleDoc.data().cancelled) throw new Error('لا يمكن إرجاع فاتورة ملغاة بالفعل');
            const sale = saleDoc.data();
            const items = sale.items || [{ productId: sale.productId, productName: sale.productName, quantity: sale.quantity, unitPrice: sale.unitPrice, total: sale.total }];
            const batch = db.batch();
            for(const item of items) {
                const prodRef = getProductsCol().doc(item.productId);
                const prodDoc = await prodRef.get();
                if(prodDoc.exists) batch.update(prodRef, { qty: (prodDoc.data().qty || 0) + item.quantity });
                else console.warn(`منتج ${item.productId} غير موجود`);
            }
            if(sale.customerId && sale.paymentMethod === 'credit') {
                const custRef = getCustomersCol().doc(sale.customerId);
                const custDoc = await custRef.get();
                let oldDebt = custDoc.data()?.debt || 0;
                let newDebt = Math.max(0, oldDebt - sale.total);
                batch.update(custRef, { debt: newDebt });
            }
            batch.update(saleRef, { cancelled: true });
            await batch.commit();
            await ensureSalesCache();
            showFlash('tabContent', '✅ تم إرجاع الفاتورة بالكامل وأعيدت المنتجات', false);
            const currentTab = document.querySelector('.nav-btn.active')?.dataset.tab;
            if(currentTab === 'invoices') await renderInvoicesTab(document.getElementById('tabContent'));
            else if(currentTab === 'other') await renderOtherTab(document.getElementById('tabContent'));
            else if(currentTab === 'salesLog') await renderSalesLogTab(document.getElementById('tabContent'));
        } catch(err) { showFlash('tabContent', err.message, true); }
    };

    // ========================================== المنتجات ==========================================
    async function renderProductsTab(container) {
        await loadStoreData();
        container.innerHTML = `<h3>➕ إضافة منتج جديد</h3><div class="grid-2"><input id="prodName" placeholder="اسم المنتج*"><input id="prodBarcode" placeholder="باركود"><input id="prodPriceRetail" type="number" placeholder="سعر القطاعي"><input id="prodPriceWholesale" type="number" placeholder="سعر الجملة"><input id="prodCost" type="number" placeholder="سعر الشراء"><select id="prodUnit"><option>قطعة</option><option>كيلو</option></select><input id="prodQty" type="number" placeholder="الكمية"><input id="prodLowStock" type="number" placeholder="حد التنبيه"><input id="prodImage" placeholder="رابط الصورة"><button onclick="addNewProduct()">إضافة منتج</button></div><h3>📋 قائمة المنتجات</h3><div id="productsListArea"></div>`;
        renderProductsList();
    }
    async function renderProductsList() {
        const area = document.getElementById('productsListArea'); if(!area) return;
        let html = '';
        for(let p of allProducts) html += `<div class="card ${p.qty <= (p.lowStockAlert||0)?'low-stock':''}"><div class="card-info">${p.imageUrl?`<img class="product-img" src="${p.imageUrl}">`:''}<strong>${escapeHtml(p.name)}</strong><br>الكمية: ${p.qty} ${p.unit}</div><div><button class="btn-sm" onclick="editProduct('${p.id}')">✏️</button><button class="btn-sm btn-danger" onclick="deleteProduct('${p.id}')">🗑️</button></div></div>`;
        area.innerHTML = html || '<p>لا توجد منتجات</p>';
    }
    window.addNewProduct = async () => {
        const name = document.getElementById('prodName').value.trim();
        if(!name) return showFlash('productsListArea', 'الاسم مطلوب', true);
        await getProductsCol().add({ name, barcode: document.getElementById('prodBarcode').value, priceRetail: parseFloat(document.getElementById('prodPriceRetail').value)||0, priceWholesale: parseFloat(document.getElementById('prodPriceWholesale').value)||0, cost: parseFloat(document.getElementById('prodCost').value)||0, unit: document.getElementById('prodUnit').value, qty: parseInt(document.getElementById('prodQty').value)||0, lowStockAlert: parseInt(document.getElementById('prodLowStock').value)||0, imageUrl: document.getElementById('prodImage').value, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        showFlash('productsListArea', 'تمت الإضافة'); renderProductsTab(document.getElementById('tabContent'));
    };
    window.deleteProduct = async (id) => { if(confirm('حذف؟')) { await getProductsCol().doc(id).delete(); renderProductsTab(document.getElementById('tabContent')); } };
    window.editProduct = async (id) => { let newName=prompt('اسم جديد'); if(!newName) return; let newPrice=parseFloat(prompt('سعر قطاعي جديد')); let newQty=parseInt(prompt('كمية جديدة')); await getProductsCol().doc(id).update({name:newName, priceRetail:newPrice, qty:newQty}); renderProductsTab(document.getElementById('tabContent')); };
    
    // ========================================== العملاء ==========================================
    async function renderCustomersTab(container) {
        await loadStoreData();
        container.innerHTML = `<h3>👤 إضافة عميل</h3><div class="pos-row"><input id="custName" placeholder="الاسم"><input id="custPhone" placeholder="الهاتف"><button onclick="addCustomer()">إضافة</button></div><div id="customersListDiv"></div>`;
        document.getElementById('customersListDiv').innerHTML = allCustomers.map(c => `<div class="card"><div class="card-info"><strong>${escapeHtml(c.name)}</strong> - دين: ${c.debt||0}</div><div><button class="btn-sm" onclick="editCustomer('${c.id}')">✏️</button><button class="btn-sm btn-danger" onclick="deleteCustomer('${c.id}')">🗑️</button><button class="btn-sm" onclick="recordPayment('${c.id}')">تسديد</button></div></div>`).join('');
    }
    window.addCustomer = async () => { let name = document.getElementById('custName').value.trim(); if(!name) return; await getCustomersCol().add({name, phone: document.getElementById('custPhone').value, debt:0}); renderCustomersTab(document.getElementById('tabContent')); };
    window.editCustomer = async (id) => { let newName=prompt('اسم جديد'); if(newName) await getCustomersCol().doc(id).update({name:newName}); renderCustomersTab(document.getElementById('tabContent')); };
    window.deleteCustomer = async (id) => { if(confirm('حذف العميل؟')) { await getCustomersCol().doc(id).delete(); renderCustomersTab(document.getElementById('tabContent')); } };
    window.recordPayment = async (custId) => { let amount=parseFloat(prompt('المبلغ المسدد')); if(isNaN(amount)) return; const custRef=getCustomersCol().doc(custId); const doc=await custRef.get(); let newDebt=(doc.data().debt||0)-amount; await custRef.update({debt: newDebt<0?0:newDebt}); renderCustomersTab(document.getElementById('tabContent')); };
    
    // ========================================== الموردين ==========================================
    async function renderSuppliersTab(container) {
        await loadStoreData();
        container.innerHTML = `<h3>🏭 الموردين</h3><div class="pos-row"><input id="supName" placeholder="اسم المورد"><input id="supPhone" placeholder="رقم الهاتف"><button onclick="addSupplier()">إضافة</button></div><div id="suppliersList"></div>`;
        document.getElementById('suppliersList').innerHTML = allSuppliers.map(s => `<div class="card"><div>${escapeHtml(s.name)}</div><div><button class="btn-sm" onclick="editSupplier('${s.id}')">✏️</button><button class="btn-sm btn-danger" onclick="deleteSupplier('${s.id}')">🗑️</button><button class="btn-sm" onclick="showSupplierProducts('${s.id}', '${escapeHtml(s.name)}')">📋 منتجات المورد</button></div></div>`).join('');
    }
    window.showSupplierProducts = async (supplierId, supplierName) => {
        const container = document.getElementById('tabContent');
        const supProductsCol = getSuppliersCol().doc(supplierId).collection('products');
        const snap = await supProductsCol.get();
        let productsHtml = snap.docs.map(doc => `<div class="card"><div class="card-info">${escapeHtml(doc.data().name)} - سعر: ${doc.data().price || 0} ج.م</div><div><button class="btn-sm" onclick="deleteSupplierProduct('${supplierId}', '${doc.id}')">🗑️</button></div></div>`).join('');
        if (snap.empty) productsHtml = '<p>لا توجد منتجات لهذا المورد</p>';
        container.innerHTML = `<h3>📦 منتجات المورد: ${supplierName}</h3><div class="pos-row"><input id="productName" placeholder="اسم المنتج"><input id="productPrice" type="number" placeholder="السعر"><button onclick="addSupplierProduct('${supplierId}')">➕ إضافة منتج</button></div><div id="supplierProductsList">${productsHtml}</div><button class="btn-sm" onclick="renderSuppliersTab(document.getElementById('tabContent'))">🔙 رجوع</button>`;
    };
    window.addSupplierProduct = async (supplierId) => {
        const name = document.getElementById('productName').value.trim();
        const price = parseFloat(document.getElementById('productPrice').value);
        if (!name || isNaN(price)) return showFlash('supplierProductsList', 'البيانات غير صحيحة', true);
        const supProductsCol = getSuppliersCol().doc(supplierId).collection('products');
        await supProductsCol.add({ name, price });
        showFlash('supplierProductsList', 'تمت الإضافة');
        window.showSupplierProducts(supplierId, '');
    };
    window.deleteSupplierProduct = async (supplierId, productId) => {
        if (!confirm('حذف المنتج؟')) return;
        await getSuppliersCol().doc(supplierId).collection('products').doc(productId).delete();
        showFlash('supplierProductsList', 'تم الحذف');
        window.showSupplierProducts(supplierId, '');
    };
    window.addSupplier = async () => { let name=document.getElementById('supName').value.trim(); if(!name) return; await getSuppliersCol().add({name, phone: document.getElementById('supPhone').value}); renderSuppliersTab(document.getElementById('tabContent')); };
    window.editSupplier = async (id) => { let newName=prompt('اسم جديد'); if(newName) await getSuppliersCol().doc(id).update({name:newName}); renderSuppliersTab(document.getElementById('tabContent')); };
    window.deleteSupplier = async (id) => { if(confirm('حذف مورد؟')) { await getSuppliersCol().doc(id).delete(); renderSuppliersTab(document.getElementById('tabContent')); } };
    
    // ========================================== سجل المبيعات ==========================================
    async function renderSalesLogTab(container) {
        await ensureSalesCache();
        container.innerHTML = `<h3>📋 سجل المبيعات</h3><div id="salesLogList"></div>`;
        filterAndDisplaySales();
    }
    function filterAndDisplaySales() {
        const container=document.getElementById('salesLogList'); if(!container) return;
        let filtered=allSalesCache.filter(s=>!s.cancelled);
        filtered.sort((a,b)=>(b.date?.toDate()||0)-(a.date?.toDate()||0));
        container.innerHTML=filtered.map(s=>`<div class="card"><div class="card-info"><strong>${escapeHtml(s.items?.[0]?.productName||s.productName)}</strong> - ${s.total} ج.م - ${formatDate(s.date)}</div><div><button class="btn-sm btn-danger" onclick="returnInvoice('${s.id}')">إرجاع</button></div></div>`).join('')||'<p>لا توجد مبيعات</p>';
    }
    
    // ========================================== تبويب أخرى ==========================================
    let otherSubTab = 'inventory';
    async function renderOtherTab(container) {
        container.innerHTML = `<h3>📦 القائمة الإضافية</h3><div class="sub-tabs"><div class="sub-tab ${otherSubTab==='inventory'?'active':''}" onclick="setOtherSubTab('inventory')">📦 المخزون</div><div class="sub-tab ${otherSubTab==='hottest'?'active':''}" onclick="setOtherSubTab('hottest')">🔥 الأكثر مبيعاً</div><div class="sub-tab ${otherSubTab==='invoices'?'active':''}" onclick="setOtherSubTab('invoices')">🧾 فواتير اليوم</div><div class="sub-tab ${otherSubTab==='account'?'active':''}" onclick="setOtherSubTab('account')">ℹ️ الحساب</div><div class="sub-tab ${otherSubTab==='reports'?'active':''}" onclick="setOtherSubTab('reports')">📊 التقارير</div><div class="sub-tab ${otherSubTab==='contact'?'active':''}" onclick="setOtherSubTab('contact')">📱 تواصل</div></div><div id="otherContent"></div>`;
        await loadOtherSubContent();
    }
    window.setOtherSubTab = (tab) => { otherSubTab = tab; renderOtherTab(document.getElementById('tabContent')); };
    async function loadOtherSubContent() {
        const div = document.getElementById('otherContent'); if(!div) return;
        if(otherSubTab === 'inventory') { div.innerHTML = allProducts.map(p=>`<div class="card"><div class="card-info">${escapeHtml(p.name)} : ${p.qty} ${p.unit}</div></div>`).join('')||'<p>لا توجد</p>'; }
        else if(otherSubTab === 'hottest') { div.innerHTML = `<div class="pos-row"><input type="datetime-local" id="startTime"><input type="datetime-local" id="endTime"><button onclick="calculateHottestProducts()">عرض</button></div><div id="hottestResult"></div>`; }
        else if(otherSubTab === 'invoices') { await renderInvoicesTab(div); }
        else if(otherSubTab === 'account') { div.innerHTML = `<div class="card"><div class="card-info"><p><strong>المتجر:</strong> ${escapeHtml(userData?.storeName||'')}</p><input type="password" id="oldPassword" placeholder="كلمة المرور القديمة"><input type="password" id="newPassword1" placeholder="الجديدة"><input type="password" id="newPassword2" placeholder="تأكيد"><button onclick="changePassword()" class="btn-secondary">تغيير</button><div id="passwordMsg" class="flash" style="display:none;"></div></div></div>`; }
        else if(otherSubTab === 'reports') { await renderReportsInside(div); }
        else if(otherSubTab === 'contact') { div.innerHTML = `<div class="card"><a href="https://t.me/amgadmousa1000" target="_blank"><button class="btn-secondary">📱 تليجرام</button></a></div>`; }
    }
    window.calculateHottestProducts = async () => {
        const start=new Date(document.getElementById('startTime').value), end=new Date(document.getElementById('endTime').value);
        if(isNaN(start)||isNaN(end)) return showFlash('hottestResult', 'يرجى تحديد نطاق صحيح', true);
        await ensureSalesCache();
        const counts={};
        for(let s of allSalesCache) if(!s.cancelled && s.date?.toDate()>=start && s.date?.toDate()<=end) (s.items||[{productName:s.productName,quantity:s.quantity}]).forEach(it=>counts[it.productName]=(counts[it.productName]||0)+it.quantity);
        const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
        document.getElementById('hottestResult').innerHTML=sorted.map(([n,q])=>`<div class="card">${escapeHtml(n)} : ${q}</div>`).join('')||'<p>لا يوجد</p>';
    };
    async function renderReportsInside(container) {
        await loadStoreData();
        const salesSnap=await getSalesCol().where('cancelled','==',false).get();
        let profit=0;
        for(const doc of salesSnap.docs) {
            let sale=doc.data();
            (sale.items||[{productId:sale.productId,quantity:sale.quantity,unitPrice:sale.unitPrice}]).forEach(it=>{
                let prod=allProducts.find(p=>p.id===it.productId);
                let cost=prod?.cost||0;
                profit+= (it.unitPrice||0)*it.quantity - cost*it.quantity;
            });
        }
        container.innerHTML=`<div class="stat-card">💰 إجمالي الأرباح: ${profit.toFixed(2)} ج.م</div><button class="btn-secondary" onclick="renderReportsInside(document.getElementById('otherContent'))">تحديث</button>`;
    }
    window.changePassword = async () => {
        const old=document.getElementById('oldPassword').value, new1=document.getElementById('newPassword1').value, new2=document.getElementById('newPassword2').value;
        if(!old||!new1||!new2) { alert('املأ الحقول'); return; }
        if(new1!==new2) { alert('كلمة المرور الجديدة غير متطابقة'); return; }
        try{
            const user=auth.currentUser;
            await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,old));
            await user.updatePassword(new1);
            alert('تم تغيير كلمة المرور بنجاح');
        }catch(e){ alert('فشل تغيير كلمة المرور: '+e.message); }
    };
    
    // ========================================== تسجيل الدخول ==========================================
    async function handleSignedInUser(user) {
        try {
            const userInfo = await ensureUserDocument(user.uid, user.email);
            currentUserAuth = user; userData = userInfo; currentStoreId = userInfo.storeId; currentRole = userInfo.role; isAdminGlobal = (currentRole === 'admin');
            document.getElementById('loginScreen').style.display = 'none'; document.getElementById('dashboard').style.display = 'block';
            document.getElementById('storeTitle').innerHTML = `<i class="fas fa-store"></i> ${userInfo.storeName || 'المحل'}`;
            if (!isAdminGlobal) await loadStoreData();
            buildTabs();
        } catch(err) { console.error(err); await auth.signOut(); location.reload(); }
    }
    async function loginUser() { const id=document.getElementById('loginId').value.trim(), pwd=document.getElementById('loginPassword').value; if(!id||!pwd){document.getElementById('loginError').innerText='املأ البيانات';return;} try{ await auth.signInWithEmailAndPassword(id+"@bkalla.com",pwd); }catch(e){document.getElementById('loginError').innerText='فشل الدخول';} }
    window.logoutUser = async () => { await auth.signOut(); location.reload(); };
    auth.onAuthStateChanged(user => { if(user) handleSignedInUser(user); else { document.getElementById('loginScreen').style.display='flex'; document.getElementById('dashboard').style.display='none'; } });
</script>
