<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMG.VID | عالم الأفلام الحصري</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --main-red: #e50914; --main-black: #0b0b0b; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--main-black); color: white; margin: 0; padding: 0; }
        
        header {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; width: 90%; z-index: 1000;
            height: 60px;
        }

        .logo-container img { height: 45px; width: auto; }
        nav ul { display: flex; list-style: none; gap: 15px; margin: 0; padding: 0; }
        nav a { color: white; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        nav a:hover { color: var(--main-red); }

        .container { padding: 100px 5% 20px; }
        .section-title { border-right: 4px solid var(--main-red); padding-right: 10px; margin-bottom: 30px; }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
            transition: 0.3s;
            cursor: pointer;
        }

        .movie-card:hover { transform: scale(1.05); border-color: var(--main-red); }
        .movie-card img { width: 100%; height: 240px; object-fit: cover; }
        .movie-info { padding: 10px; text-align: center; font-size: 0.9rem; font-weight: bold; }

        #player-layer {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        iframe { width: 90%; height: 70%; border: 2px solid var(--main-red); border-radius: 10px; }
        .close-btn {
            background: var(--main-red);
            color: white;
            border: none;
            padding: 12px 30px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="AMG.VID.png" alt="AMG.VID">
    </div>
    <nav>
        <ul>
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#">الأفلام</a></li>
            <li><a href="#">المسلسلات</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <h2 class="section-title">أحدث الإضافات الحصرية</h2>
    <div class="movie-grid" id="movie-display">
        </div>
</div>

<div id="player-layer">
    <div id="video-frame" style="width:100%; text-align:center;"></div>
    <button class="close-btn" onclick="closeMe()">إغلاق المشاهدة</button>
</div>

<script>
    async function loadMovies() {
        try {
            // سيتم جلب البيانات من الملف الذي ستنتجه في Termux
            const response = await fetch('movies.json');
            const myMovies = await response.json();
            
            const display = document.getElementById('movie-display');
            display.innerHTML = '';
            
            myMovies.forEach(m => {
                const item = document.createElement('div');
                item.className = 'movie-card';
                item.innerHTML = `
                    <img src="${m.img}" alt="${m.name}">
                    <div class="movie-info">${m.name}</div>
                `;
                item.onclick = () => play(m.link);
                display.appendChild(item);
            });
        } catch (error) {
            console.log("في انتظار رفع ملف movies.json...", error);
            document.getElementById('movie-display').innerHTML = "<p>جارِ تحديث مكتبة الأفلام...</p>";
        }
    }

    function play(url) {
        document.getElementById('video-frame').innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
        document.getElementById('player-layer').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeMe() {
        document.getElementById('player-layer').style.display = 'none';
        document.getElementById('video-frame').innerHTML = '';
        document.body.style.overflow = 'auto';
    }

    loadMovies();
</script>

</body>
</html>
