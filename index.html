<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEX-Ω Cinema Orange</title>
    <style>
        /* CSS - لغة التنسيق المطورة */
        :root {
            --bg-orange: #ff6600; /* البرتقالي المطلوب للخلفية */
            --primary-red: #cc0000;
            --pure-white: #ffffff;
            --deep-black: #000000;
            --caution-yellow: #ffcc00;
        }

        body {
            background-color: var(--bg-orange);
            color: var(--deep-black);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* تعديل الهيدر ليكون غير ثابت (يتحرك مع السكرول) */
        header {
            background-color: var(--deep-black);
            border-bottom: 5px solid var(--caution-yellow);
            padding: 30px 20px;
            text-align: center;
            /* تم إزالة position: sticky لجعل الهيدر يختفي عند النزول لأسفل */
            position: relative; 
        }

        .logo {
            max-width: 180px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            border: 3px solid var(--pure-white);
        }

        .search-container {
            width: 100%;
        }

        #movieSearch {
            width: 90%;
            max-width: 600px;
            padding: 15px;
            border-radius: 30px;
            border: 3px solid var(--primary-red);
            background-color: var(--pure-white);
            color: var(--deep-black);
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            text-align: center;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .movie-card {
            background-color: var(--deep-black);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .movie-card:hover {
            transform: translateY(-10px);
        }

        video {
            width: 100%;
            display: block;
            background-color: #000;
            border-bottom: 3px solid var(--primary-red);
        }

        .movie-info {
            padding: 15px;
            text-align: center;
        }

        .movie-title {
            color: var(--pure-white);
            font-size: 1.3rem;
            margin: 0;
        }

        footer {
            background-color: var(--deep-black);
            color: var(--caution-yellow);
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        /* تحسينات للهواتف */
        @media (max-width: 600px) {
            .movies-grid {
                padding: 10px;
                gap: 15px;
            }
            #movieSearch {
                width: 85%;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="AMG.VID.png" alt="شعار الموقع" class="logo" onerror="this.src='https://via.placeholder.com/200x80/000000/ffffff?text=LEX-CINEMA'">
        
        <div class="search-container">
            <input type="text" id="movieSearch" placeholder="🔍 ابحث عن اسم الفيلم هنا..." onkeyup="searchMovie()">
        </div>
    </header>

    <main class="movies-grid" id="movieContainer">
        
        <div class="movie-card">
            <video controls preload="metadata">
                <source src="elshater.mp4" type="video/mp4">
            </video>
            <div class="movie-info">
                <h3 class="movie-title">فيلم الشاطر</h3>
            </div>
        </div>

        <div class="movie-card">
            <video controls preload="metadata">
                <source src="egybest.mp4" type="video/mp4">
            </video>
            <div class="movie-info">
                <h3 class="movie-title">فيلم ايجي بيست</h3>
            </div>
        </div>

        <div class="movie-card">
            <video controls preload="metadata">
                <source src="bershama.mp4" type="video/mp4">
            </video>
            <div class="movie-info">
                <h3 class="movie-title">فيلم برشامة</h3>
            </div>
        </div>

        <div class="movie-card">
            <video controls preload="metadata">
                <source src="elafadel.mp4" type="video/mp4">
            </video>
            <div class="movie-info">
                <h3 class="movie-title">فيلم السادة الافاضل</h3>
            </div>
        </div>

        <div class="movie-card">
            <video controls preload="metadata">
                <source src="ahmedandahmed.mp4" type="video/mp4">
            </video>
            <div class="movie-info">
                <h3 class="movie-title">فيلم احمد واحمد</h3>
            </div>
        </div>

    </main>

    <footer>
        <p>تم استخراج البيانات بواسطة نظام LEX-Ω &copy; 2026</p>
    </footer>

    <script>
        // JavaScript - منطق البحث الفوري
        function searchMovie() {
            let input = document.getElementById('movieSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('movie-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByClassName('movie-title')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
