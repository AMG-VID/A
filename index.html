<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMG.VID | مشاهدة أحدث الأفلام والمسلسلات حصرياً</title>
    
    <meta name="description" content="منصة AMG.VID لمشاهدة أحدث الأفلام والمسلسلات بجودة عالية HD. استمتع بمشاهدة مباشرة بدون إعلانات مزعجة.">
    <meta name="keywords" content="افلام مترجمة, مسلسلات حصريا, مشاهدة اونلاين, AMG.VID, ماي سيما البديل">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e50914; /* أحمر سينمائي */
            --bg-color: #0b0b0b;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 90%;
            z-index: 1000;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            padding: 100px 5% 50px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
            border: 1px solid #333;
        }

        .movie-card:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        .movie-card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
            text-align: center;
        }

        .movie-title {
            font-size: 0.9rem;
            margin: 5px 0;
        }

        /* مشغل الفيديو المخفي */
        #player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        iframe {
            width: 80%;
            height: 70%;
            border: 2px solid var(--primary-color);
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">AMG.VID</div>
    <nav>بحث | الأقسام | اتصل بنا</nav>
</header>

<div class="container">
    <h2 style="border-right: 4px solid var(--primary-color); padding-right: 15px;">أحدث الإضافات</h2>
    <div class="movie-grid" id="movie-grid">
        </div>
</div>

<div id="player-container">
    <div id="video-wrapper" style="width: 100%; display: flex; justify-content: center;"></div>
    <button class="close-btn" onclick="closePlayer()">إغلاق المشغل</button>
</div>

<script>
    // بيانات تجريبية (سيتم تعويضها لاحقاً بملف JSON يتم تحديثه تلقائياً)
    const movies = [
        {
            title: "Joker: Folie à Deux",
            poster: "https://image.tmdb.org/t/p/w500/udDcl70jRpkJSnyUoT8asIuS3un.jpg",
            url: "https://vidoza.net/embed-xxxx.html" // هنا تضع رابط السيرفر الخارجي
        },
        // أضف المزيد هنا...
    ];

    const grid = document.getElementById('movie-grid');

    function displayMovies() {
        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <img src="${movie.poster}" alt="${movie.title}">
                <div class="movie-info">
                    <div class="movie-title">${movie.title}</div>
                </div>
            `;
            card.onclick = () => openPlayer(movie.url);
            grid.appendChild(card);
        });
    }

    function openPlayer(url) {
        // هنا يمكنك حقن كود الإعلانات (Pop-under) قبل فتح الفيلم
        console.log("جارِ فتح الإعلانات...");
        
        document.getElementById('video-wrapper').innerHTML = `<iframe src="${url}" frameborder="0" allowfullscreen></iframe>`;
        document.getElementById('player-container').style.display = 'flex';
    }

    function closePlayer() {
        document.getElementById('player-container').style.display = 'none';
        document.getElementById('video-wrapper').innerHTML = '';
    }

    displayMovies();
</script>

</body>
</html>
