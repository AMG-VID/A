    <style>
        :root {
            --bg-gradient-start: #eef2ff;
            --bg-gradient-end: #e0e7ff;
            --container-bg: rgba(255,255,255,0.96);
            --text-primary: #4c1d95;
            --input-border: #cbd5e1;
            --input-focus: #7c3aed;
            --card-bg: white;

        body { background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end)); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: auto; background: var(--container-bg); border-radius: 40px; padding: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.1); }
        .login-box { text-align: center; padding: 40px 20px; max-width: 420px; margin: auto; }
        .support-buttons { display: flex; gap: 12px; margin-top: 15px; justify-content: center; flex-wrap: wrap; }
        .support-buttons a { flex: 1; text-decoration: none; padding: 10px; border-radius: 30px; color: white; font-weight: bold; text-align: center; transition: 0.2s; }
        .support-buttons a:active { transform: scale(0.96); }
        .btn-whatsapp { background-color: #25D366; }
        .btn-telegram { background-color: #0088cc; }
        h1, h2, h3 { color: var(--text-primary); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 30px; border: 1px solid var(--input-border); font-size: 15px; background: var(--card-bg); color: inherit; }
        input:focus, select:focus { border-color: var(--input-focus); outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 30px; background: linear-gradient(95deg, #2563eb, #8b5cf6); color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition:0.2s; }
        button:active { transform: scale(0.98); }
        .btn-secondary { background: #f97316; }
        .btn-danger { background: #dc2626; }
        .btn-sm { width: auto; padding: 6px 14px; margin: 3px; display: inline-block; }
        .top-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; background: var(--nav-bg); padding: 8px; border-radius: 60px; }
        .nav-btn { background: transparent; color: var(--nav-text); width: auto; padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .nav-btn.active { background: var(--nav-active); color: white; box-shadow: 0 6px 12px rgba(79,70,229,0.3); }
        .card { background: var(--card-bg); padding: 12px; border-radius: 24px; margin: 10px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-right: 5px solid var(--card-border); gap: 8px; }
        .card-info { flex: 1; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 18px; }
        .stat-card { background: var(--stat-card-bg); padding: 18px; border-radius: 28px; text-align: center; border: 1px solid var(--stat-card-border); }
        .pos-row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin: 12px 0; }
        .pos-row > * { flex: 1; }

        .status-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #f1f5f9; display: flex; justify-content: space-between; align-items: center; padding: 5px 20px; font-size: 12px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table th, .data-table td { border: 1px solid var(--input-border); padding: var(--table-padding); text-align: center; font-size: var(--table-font-size); vertical-align: middle; }
        .data-table th { background: var(--stat-card-bg); font-size: var(--table-header-size); font-weight: 700; }
        .data-table tbody tr:hover { background: #f5f3ff; }
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .invoices-search, .filter-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: end; }
        .invoices-search > * { flex: 1; }
        .low-stock-row { background-color: #ffe0e0; color: #b91c1c; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1001; width: 90%; max-width: 500px; direction: rtl; max-height: 90vh; overflow-y: auto; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .pagination-controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
        .pagination-controls button { width: auto; padding: 8px 22px; font-size: 14px; }
        .pagination-info { font-size: 14px; color: #4c1d95; font-weight: 600; }
        .search-spinner { display:inline-block; width:16px; height:16px; border:2px solid #c4b5fd; border-top-color:#4c1d95; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:6px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #productsLoadingBar { display:none; background:linear-gradient(90deg,#eef2ff,#c7d2fe); border-radius:30px; padding:10px 18px; color:#4c1d95; font-weight:600; margin:8px 0; align-items:center; gap:8px; }
        /* ===== قسم التثبيت ===== */
        .install-section { margin: 18px 0; }
        .install-card { background: var(--stat-card-bg); border: 1px solid var(--stat-card-border); border-radius: 20px; padding: 20px; margin-bottom: 14px; }

        .auth-message.error { background:#fee2e2; color:#991b1b; }
        .auth-help { background:none; color:#4f46e5; padding:8px; width:auto; font-size:14px; text-decoration:underline; }
        .auth-note { color:#64748b; font-size:13px; line-height:1.7; margin:8px 0; }
        .auth-submit { margin-top:10px; }
        @media print {
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            body { margin: 0; padding: 0; background: white; }
            table { width: 100% !important; border-collapse: collapse !important; word-break: break-word; }
            th, td { border: 1px solid #aaa !important; padding: 6px 4px !important; text-align: center !important; }
            th { background: #f0f0f0 !important; }
            @page { size: auto; margin: 8mm 5mm; }
            .no-print, button, .btn, .top-nav, .sub-tabs, .filter-row, .pos-row, .status-bar, .modal { display: none !important; }
            tr { page-break-inside: avoid; }
            thead { display: table-header-group; }
        }
    </style>
</head>

<script>
// ======================= PWA Service Worker =======================
(function setupPWA() {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
            .catch(error => console.warn('Service Worker registration failed:', error));
    });
})();

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
});

// ======================= Firebase =======================
const firebaseConfig = {
    apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
    authDomain: "bakkala-system.firebaseapp.com",
    projectId: "bakkala-system",
    storageBucket: "bakkala-system.firebasestorage.app",
    messagingSenderId: "807660158854",
    appId: "1:807660158854:web:c3690293a27185f07fb607"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true, cacheSizeBytes: 104857600 }).catch(e => console.warn(e));

const QUERY_LIMITS = { products:15000, customers:1000, suppliers:500, invoices:5000, missingProducts:200, supplierProducts:200 };

let idbReady=false,dbCache;
const dbReadyPromise=(async function(){
    if(!window.idb) throw new Error('مكتبة التخزين المحلي غير متاحة.');
    dbCache=await idb.openDB('FatoraMousaOffline',11,{
        upgrade:function(database){
            if(!database.objectStoreNames.contains('pending')) database.createObjectStore('pending',{autoIncrement:true});
            if(!database.objectStoreNames.contains('cache')) database.createObjectStore('cache',{keyPath:'key'});
        }
    });
    idbReady=true;
})();
let currentUserAuth=null,userData=null,currentStoreId=null,currentRole=null,isAdminGlobal=false;
let allProducts=[],allCustomers=[],allSuppliers=[],allInvoicesCache=[],allMissingProducts=[];
let lastReceiptData=null,isSyncing=false,currentEditProductId=null,missingProductsLoaded=false;
let currentProductPage=1;
const productsPerPage=100;
function scopedCacheKey(key){
    if(!currentUserAuth||!currentStoreId) return null;
    return currentUserAuth.uid+':'+currentStoreId+':'+key;
}
async function cacheData(key,data){
    await dbReadyPromise;
    const cacheKey=scopedCacheKey(key);
    if(cacheKey) await dbCache.put('cache',{key:cacheKey,data:data,timestamp:Date.now()});
}
async function getCachedData(key){
    await dbReadyPromise;
    const cacheKey=scopedCacheKey(key);
    if(!cacheKey) return null;
    const result=await dbCache.get('cache',cacheKey);
    return result?result.data:null;
}
function makeOperationId(){
    if(window.crypto&&typeof window.crypto.randomUUID==='function') return window.crypto.randomUUID();
    return 'op-'+Date.now()+'-'+Math.random().toString(36).slice(2);
}
async function addPendingOp(op){
    await dbReadyPromise;
    if(!currentUserAuth||!currentStoreId) throw new Error('سجل الدخول أولًا قبل حفظ عملية دون إنترنت.');
    return dbCache.add('pending',Object.assign({},op,{
        operationId:op.operationId||makeOperationId(),storeId:currentStoreId,
        userId:currentUserAuth.uid,createdAt:Date.now(),attempts:0
    }));
}
async function getPendingOps(){
    await dbReadyPromise;
    const keys=await dbCache.getAllKeys('pending'),values=await dbCache.getAll('pending');
    return values.map(function(value,index){return Object.assign({key:keys[index]},value);});
}
async function removePendingOp(key){await dbReadyPromise;await dbCache.delete('pending',key);}
async function updatePendingOp(key,patch){
    await dbReadyPromise;
    const current=await dbCache.get('pending',key);
    if(current) await dbCache.put('pending',Object.assign({},current,patch),key);
}
async function loadFromCacheThenSync(){
    await dbReadyPromise;
    allProducts=await getCachedData('products')||[];
    allCustomers=await getCachedData('customers')||[];
    allSuppliers=await getCachedData('suppliers')||[];
    allInvoicesCache=await getCachedData('invoices')||[];
    allMissingProducts=await getCachedData('missingProducts')||[];
}
let lastRefreshTime = 0;
const REFRESH_COOLDOWN = 5 * 60 * 1000;

function getStoreRef(){ return db.collection('stores').doc(currentStoreId); }
function getProductsCol(){ return getStoreRef().collection('products'); }
function getCustomersCol(){ return getStoreRef().collection('customers'); }
function getSuppliersCol(){ return getStoreRef().collection('suppliers'); }
function getInvoicesCol(){ return getStoreRef().collection('invoices'); }
function getCountersCol(){ return getStoreRef().collection('counters'); }
function getMissingProductsCol(){ return getStoreRef().collection('missingProducts'); }
function getPaymentsCol(){ return getStoreRef().collection('payments'); }

async function refreshFromFirestore(showLoading=true) {
    if (!currentStoreId || isAdminGlobal) return;
    try {
        const loadingBar = document.getElementById('productsLoadingBar');
        if (showLoading && loadingBar) { loadingBar.style.display='flex'; loadingBar.innerHTML='<span class="search-spinner"></span> جاري تحميل المنتجات...'; }
        let allFetchedProducts=[], lastDoc=null;
        let keepFetching=true;
        while (keepFetching) {
            let query = getProductsCol().orderBy(firebase.firestore.FieldPath.documentId()).limit(500);
            if (lastDoc) query = query.startAfter(lastDoc);
            const snap = await query.get();
            if (snap.empty) break;
            allFetchedProducts = allFetchedProducts.concat(snap.docs.map(d=>({id:d.id,...d.data()})));
            lastDoc = snap.docs[snap.docs.length-1];
            if (showLoading && loadingBar) loadingBar.innerHTML=`<span class="search-spinner"></span> جاري تحميل المنتجات... ${allFetchedProducts.length} منتج`;
            if (snap.docs.length < 500 || allFetchedProducts.length >= QUERY_LIMITS.products) keepFetching=false;
        }
        if (showLoading && loadingBar) loadingBar.style.display='none';
        const [custSnap,suppSnap,invSnap,missingSnap] = await Promise.all([
            getCustomersCol().limit(QUERY_LIMITS.customers).get(),
            getSuppliersCol().limit(QUERY_LIMITS.suppliers).get(),
            getInvoicesCol().orderBy('date','desc').limit(QUERY_LIMITS.invoices).get(),
            getMissingProductsCol().limit(QUERY_LIMITS.missingProducts).get()
        ]);
        allProducts=allFetchedProducts;
        allCustomers=custSnap.docs.map(d=>({id:d.id,...d.data()}));
        allSuppliers=suppSnap.docs.map(d=>({id:d.id,...d.data()}));
        allInvoicesCache=invSnap.docs.map(d=>({id:d.id,...d.data()}));
        allMissingProducts=missingSnap.docs.map(d=>({id:d.id,...d.data()}));
        missingProductsLoaded=true;
        await Promise.all([cacheData('products',allProducts),cacheData('customers',allCustomers),cacheData('suppliers',allSuppliers),cacheData('invoices',allInvoicesCache),cacheData('missingProducts',allMissingProducts)]);
        if (document.getElementById('productsListArea')) renderProductsTable();
        if (document.getElementById('salesLogList')) filterAndDisplayInvoices();
        if (document.getElementById('otherContent')) loadOtherSubContent();
        if (document.getElementById('customersListDiv')) renderCustomersTable();
        if (document.getElementById('invoicesList')) applyInvoicesFilters();
    } catch(e) { console.warn(e); }
}

async function loadStoreData(forceRefresh=false) {
    if (isAdminGlobal || !currentStoreId) return;
    const now=Date.now();
    if (!forceRefresh && allProducts.length>0 && (now-lastRefreshTime)<REFRESH_COOLDOWN) return;
    await refreshFromFirestore(true);
    lastRefreshTime=now;
}

function showFlash(id,txt,err=false){
    let el=document.getElementById(id);
    if(!el){ el=document.createElement('div'); el.className='flash'; const t=document.getElementById('tabContent')||document.getElementById('dashboard'); if(t) t.prepend(el); else document.getElementById('app')?.prepend(el); }
    el.innerText=txt; el.style.backgroundColor=err?'#ffe0e0':'#e0f2fe'; el.style.color=err?'#b91c1c':'#065f46';
    setTimeout(()=>el.remove(),3000);
}
function escapeHtml(value){
    return String(value==null?'':value).replace(/[&<>"']/g,function(ch){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
}
function toDate(value){
    if(!value) return null;
    const result=typeof value.toDate==='function'?value.toDate():new Date(value);
    return Number.isNaN(result.getTime())?null:result;
}
function formatDate(value){
    const date=toDate(value);
    return date?date.toLocaleString('ar-EG'):'—';
}
function safeHttpUrl(value){
    try{
        const url=new URL(String(value||''),window.location.href);
        return url.protocol==='https:'||url.protocol==='http:'?url.href:'';
    }catch(error){return '';}
}
function localDateKey(date){
    const d=date||new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getPaymentMethodArabic(m){ return m==='cash'?'كاش':m==='visa'?'فيزا':m==='credit'?'آجل':m; }

async function ensureUserDocument(uid,email){
    const userRef=db.collection('users').doc(uid);
    const userDoc=await userRef.get();
    if(!userDoc.exists) throw new Error('الحساب غير مهيأ على النظام. تواصل مع الدعم.');
    const data=userDoc.data();
    if(data.isActive===false) throw new Error('هذا الحساب معطل. تواصل مع الدعم.');
    if(data.role==='admin') return data;
    if(!data.storeId) throw new Error('لا يوجد متجر مرتبط بالحساب.');
    const storeDoc=await db.collection('stores').doc(data.storeId).get();
    if(!storeDoc.exists) throw new Error('بيانات المتجر غير موجودة. تواصل مع الدعم.');
    return data;
}

async function getNextInvoiceNumber(){
    const today=new Date(); today.setHours(0,0,0,0);
    const counterRef=getCountersCol().doc(`daily_${today.toISOString().split('T')[0]}`);
    return await db.runTransaction(async(transaction)=>{
        const snap=await transaction.get(counterRef);
        let n=1;
        if(snap.exists){ n=snap.data().current+1; transaction.update(counterRef,{current:firebase.firestore.FieldValue.increment(1)}); }
        else transaction.set(counterRef,{current:1,date:firebase.firestore.Timestamp.fromDate(today)});
        return n;
    });
}

async function ensureInvoicesCache(){ return allInvoicesCache; }

async function syncQueuedInvoice(entry){
    if(!entry.invoiceId||!entry.data||!Array.isArray(entry.data.items)) throw new Error('عملية بيع قديمة بلا معرّف ثابت؛ تحتاج مراجعة.');
    const invoiceRef=getInvoicesCol().doc(entry.invoiceId),data=entry.data,grouped=new Map();
    data.items.forEach(function(item){grouped.set(item.productId,(grouped.get(item.productId)||0)+Number(item.quantity));});
    await db.runTransaction(async function(transaction){
        const existing=await transaction.get(invoiceRef);
        if(existing.exists) return;
        const today=new Date(),counterRef=getCountersCol().doc('daily_'+localDateKey(today));
        const counterSnap=await transaction.get(counterRef),rows=[];
        for(const pair of grouped.entries()){
            const ref=getProductsCol().doc(pair[0]);
            rows.push({ref:ref,snap:await transaction.get(ref),quantity:pair[1]});
        }
        let customerRef=null,customerSnap=null;
        if(data.customerId&&Number(data.debtAdded)>0){
            customerRef=getCustomersCol().doc(data.customerId);
            customerSnap=await transaction.get(customerRef);
            if(!customerSnap.exists) throw new Error('العميل المرتبط بهذه الفاتورة غير موجود.');
        }
        rows.forEach(function(row){
            if(!row.snap.exists||Number(row.snap.data().qty||0)<row.quantity) throw new Error('المخزون الحالي لا يكفي لمزامنة فاتورة محلية. العملية محفوظة ولم تحذف.');
        });
        const invoiceNumber=counterSnap.exists?Number(counterSnap.data().current||0)+1:1;
        transaction.set(counterRef,{current:invoiceNumber,date:firebase.firestore.Timestamp.fromDate(new Date(today.getFullYear(),today.getMonth(),today.getDate()))});
        rows.forEach(function(row){transaction.update(row.ref,{qty:Number(row.snap.data().qty||0)-row.quantity});});
        if(customerRef&&customerSnap) transaction.update(customerRef,{debt:Number(customerSnap.data().debt||0)+Number(data.debtAdded)});
        transaction.set(invoiceRef,Object.assign({},data,{invoiceNumber:invoiceNumber,offlineInvoiceNumber:data.invoiceNumber||null,date:firebase.firestore.FieldValue.serverTimestamp()}));
    });
}
async function syncQueuedCancellation(entry){
    if(!entry.invoiceId) throw new Error('عملية إلغاء قديمة بلا معرّف فاتورة.');
    const invoiceRef=getInvoicesCol().doc(entry.invoiceId);
    await db.runTransaction(async function(transaction){
        const snap=await transaction.get(invoiceRef);
        if(!snap.exists) throw new Error('الفاتورة المراد إلغاؤها غير موجودة على الخادم.');
        const invoice=snap.data();
        if(invoice.cancelled===true) return;
        const grouped=new Map();
        (invoice.items||entry.items||[]).forEach(function(item){grouped.set(item.productId,(grouped.get(item.productId)||0)+Number(item.quantity));});
        const rows=[];
        for(const pair of grouped.entries()){
            const ref=getProductsCol().doc(pair[0]);
            rows.push({ref:ref,snap:await transaction.get(ref),quantity:pair[1]});
        }
        let customerRef=null,customerSnap=null;
        if(invoice.customerId&&invoice.paymentMethod==='credit'&&Number(invoice.debtAdded)>0){
            customerRef=getCustomersCol().doc(invoice.customerId);
            customerSnap=await transaction.get(customerRef);
        }
        rows.forEach(function(row){if(row.snap.exists) transaction.update(row.ref,{qty:Number(row.snap.data().qty||0)+row.quantity});});
        if(customerRef&&customerSnap&&customerSnap.exists) transaction.update(customerRef,{debt:Math.max(0,Number(customerSnap.data().debt||0)-Number(invoice.debtAdded||0))});
        transaction.update(invoiceRef,{cancelled:true,cancelledAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
}
async function syncPendingOps(){
    if(!navigator.onLine||isSyncing||!currentStoreId||!currentUserAuth)return;
    isSyncing=true;
    let blockedByFailure=false;
    try{
        const pending=await getPendingOps();
        for(const entry of pending){
            if(entry.storeId!==currentStoreId||entry.userId!==currentUserAuth.uid)continue;
            try{
                if(entry.type==='addInvoice')await syncQueuedInvoice(entry);
                else if(entry.type==='cancelInvoice')await syncQueuedCancellation(entry);
                else if(entry.type==='addProduct'){
                    if(!entry.docId)throw new Error('عملية إضافة منتج قديمة بلا معرّف ثابت؛ تحتاج مراجعة.');
                    await getProductsCol().doc(entry.docId).set(entry.data);
                }else if(entry.type==='updateProduct')await getProductsCol().doc(entry.productId).update(entry.data);
                else if(entry.type==='addMissingProduct'){
                    if(!entry.docId)throw new Error('عملية منتج ناقص قديمة بلا معرّف ثابت؛ تحتاج مراجعة.');
                    await getMissingProductsCol().doc(entry.docId).set(entry.data);
                }else if(entry.type==='deleteMissingProduct')await getMissingProductsCol().doc(entry.missingId).delete();
                else throw new Error('نوع عملية غير معروف. احتفظنا بها للمراجعة.');
                await removePendingOp(entry.key);
            }catch(error){
                blockedByFailure=true;
                console.error('Pending operation retained:',error);
                await updatePendingOp(entry.key,{
                    attempts:Number(entry.attempts||0)+1,
                    lastAttemptAt:Date.now(),
                    syncError:error.message||'فشلت المزامنة'
                });
                showFlash('productsLoadingBar','تعذرت مزامنة عملية محلية؛ احتفظنا بها ولم نحذفها. راجع المخزون أو الاتصال.',true);
                break;
            }
        }
        // Do not overwrite optimistic local inventory while a failed sale remains queued.
        if(!blockedByFailure){
            await refreshFromFirestore(true);
            if(document.getElementById('salesLogList'))filterAndDisplayInvoices();
            if(document.getElementById('otherContent'))loadOtherSubContent();
        }
    }finally{isSyncing=false;}
}

function buildTabs(){
    const cont=document.getElementById('navTabs');
    let tabs=isAdminGlobal?[{id:'adminPanel',name:'📊 لوحة التحكم'}]:[
        {id:'pos',name:'💰 نقطة البيع'},{id:'products',name:'📦 المنتجات'},
        {id:'customers',name:'👥 العملاء'},{id:'suppliers',name:'🏭 الموردين'},
        {id:'salesLog',name:'📋 سجل المبيعات'},{id:'invoices',name:'📄 الفواتير'},
        {id:'other',name:'📦 أخرى'}
    ];
    cont.innerHTML=tabs.map(t=>`<button class="nav-btn" data-tab="${t.id}">${t.name}</button>`).join('');
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));
    if(tabs.length) switchTab(tabs[0].id);
}

async function switchTab(tabId){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    const ab=document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
    if(ab) ab.classList.add('active');
    const cont=document.getElementById('tabContent');
    if(isAdminGlobal){ cont.innerHTML='<div class="flash">لوحة المشرف قيد التطوير</div>'; return; }
    await loadStoreData(false);
    if(tabId==='pos') await renderPosTab(cont);
    else if(tabId==='products') await renderProductsTab(cont);
    else if(tabId==='customers') await renderCustomersTab(cont);
    else if(tabId==='suppliers') await renderSuppliersTab(cont);
    else if(tabId==='salesLog') await renderSalesLogTab(cont);
    else if(tabId==='invoices') await renderInvoicesTab(cont);
    else if(tabId==='other') await renderOtherTab(cont);
}

let cart=[];
async function renderPosTab(container){
    cart=[]; lastReceiptData=null;
    let custOpt=`<option value="">بدون عميل</option>`+allCustomers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
    container.innerHTML=`
    <div style="background:#f8fafc;border-radius:32px;padding:20px;">
        <h3>💰 نقطة البيع السريعة</h3>
        <div class="pos-row">
            <input type="text" id="searchProduct" placeholder="🔍 باركود أو اسم" oninput="searchProductLive()">
            <select id="productSelect"><option>اختر منتج</option></select>
            <input type="number" id="cartQty" placeholder="الكمية" value="1">
            <button onclick="addToCart()" class="btn-sm">➕ أضف للسلة</button>
        </div>
        <div id="cartItems"></div>
        <div class="pos-row">
            <input type="text" id="searchCustomer" placeholder="🔍 بحث عن عميل" oninput="filterCustomers()">
            <select id="customerId">${custOpt}</select>
            <select id="paymentMethod"><option value="cash">كاش</option><option value="visa">فيزا</option><option value="credit">آجل</option></select>
        </div>
        <div class="pos-row">
            <input type="number" id="discountValue" placeholder="قيمة الخصم" value="0" step="0.01">
            <select id="discountType"><option value="fixed">قيمة ثابتة</option><option value="percent">نسبة %</option></select>
            <button onclick="applyDiscount()" class="btn-sm" style="background:#10b981;">تطبيق خصم</button>
        </div>
        <div class="pos-row">
            <input type="number" id="paidAmount" placeholder="المدفوع" oninput="updateChange()">
            <input type="text" id="changeAmount" placeholder="الباقي" readonly>
        </div>
        <div style="font-size:24px;font-weight:bold;" id="totalAmount">الإجمالي: 0 ج.م</div>
        <button onclick="confirmSale()" style="background:#10b981;">إتمام البيع</button>
        <div id="posFlash"></div>
        <div id="printReceiptArea" style="margin-top:10px;display:none;"><button onclick="printLastReceipt()" style="background:#22c55e;">🖨️ طباعة الفاتورة</button></div>
    </div>`;
    refreshProductsForPos();
    window.searchProductLive=()=>refreshProductsForPos();
    window.filterCustomers=()=>{
        let val=document.getElementById('searchCustomer').value.toLowerCase();
        let filtered=allCustomers.filter(c=>c.name.toLowerCase().includes(val));
        document.getElementById('customerId').innerHTML=`<option value="">بدون عميل</option>`+filtered.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
    };
    window.addToCart=()=>{
        let pid=document.getElementById('productSelect').value;
        if(!pid||pid==='لا يوجد') return;
        let qty=parseFloat(document.getElementById('cartQty').value);
        if(qty<=0) return;
        let prod=allProducts.find(p=>p.id===pid);
        if(!prod||prod.qty<qty){ showFlash('posFlash','كمية غير متوفرة',true); return; }
        let existing=cart.find(i=>i.id===pid);
        if(existing){existing.qty+=qty;existing.cost=Number(prod.cost)||0;}
        else cart.push({id:pid,name:prod.name,price:Number(prod.priceRetail||prod.price)||0,cost:Number(prod.cost)||0,qty});
        renderCart();
    };
    window.renderCart=()=>{
        let cd=document.getElementById('cartItems'); let total=0;
        let h=`<h4>السلة</h4>`;
        cart.forEach((item,idx)=>{ total+=item.price*item.qty; h+=`<div class="card" style="padding:10px;">${escapeHtml(item.name)} x ${item.qty} = ${(item.price*item.qty).toFixed(2)} ج.م <button class="btn-sm btn-danger" onclick="removeFromCart(${idx})">حذف</button></div>`; });
        cd.innerHTML=h;
        document.getElementById('totalAmount').innerHTML=`الإجمالي: ${total.toFixed(2)} ج.م`;
        updateChange();
    };
    window.removeFromCart=(idx)=>{ cart.splice(idx,1); renderCart(); };
    window.updateChange=()=>{
        let t=cart.reduce((s,i)=>s+(i.price*i.qty),0);
        let dv=parseFloat(document.getElementById('discountValue').value)||0;
        let dt=document.getElementById('discountType').value;
        let disc=dt==='percent'?(t*dv/100):dv;
        let after=Math.max(0,t-disc);
        let paid=parseFloat(document.getElementById('paidAmount').value)||0;
        document.getElementById('changeAmount').value=(paid>after)?(paid-after).toFixed(2):0;
        document.getElementById('totalAmount').innerHTML=`الإجمالي: ${after.toFixed(2)} ج.م`;
    };
    window.applyDiscount=()=>updateChange();
    let _posTimer=null;
    async function refreshProductsForPos(){
        const val=document.getElementById('searchProduct').value.trim();
        const s=document.getElementById('productSelect');
        if(!val){ const lim=allProducts.slice(0,200); s.innerHTML=lim.map(p=>`<option value="${p.id}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('')||'<option>لا يوجد</option>'; return; }
        const lf=allProducts.filter(p=>(p.barcode&&p.barcode.includes(val))||p.name.includes(val));
        s.innerHTML=lf.map(p=>`<option value="${p.id}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('')||'<option>لا يوجد</option>';
        clearTimeout(_posTimer);
        _posTimer=setTimeout(async()=>{
            if(!isOnline()||!currentStoreId) return;
            try{
                const snap=await getProductsCol().orderBy('name').startAt(val).endAt(val+'\uf8ff').limit(20).get();
                let results=snap.docs.map(d=>({id:d.id,...d.data()}));
                const byB=allProducts.filter(p=>p.barcode&&p.barcode.includes(val)&&!results.find(r=>r.id===p.id));
                results=results.concat(byB).slice(0,30);
                const sc=document.getElementById('productSelect'); if(!sc) return;
                sc.innerHTML=results.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} - ${Number(p.priceRetail||p.price)||0} ج.م (متوفر ${Number(p.qty)||0})</option>`).join('')||'<option>لا يوجد</option>';
            }catch(e){}
        },300);
    }
    renderCart();
}

async function confirmSale(){
    if(cart.length===0) return showFlash('posFlash','السلة فارغة',true);
    const customerId=document.getElementById('customerId').value||null;
    const method=document.getElementById('paymentMethod').value;
    const paidEntered=Math.max(0,Number.parseFloat(document.getElementById('paidAmount').value)||0);
    const subtotal=cart.reduce(function(sum,item){return sum+Number(item.price)*Number(item.qty);},0);
    const discountValue=Math.max(0,Number.parseFloat(document.getElementById('discountValue').value)||0);
    const discountType=document.getElementById('discountType').value;
    if(discountType==='percent'&&discountValue>100) return showFlash('posFlash','نسبة الخصم لا يمكن أن تتجاوز 100%.',true);
    const discountAmount=discountType==='percent'?subtotal*discountValue/100:Math.min(subtotal,discountValue);
    const total=Math.max(0,subtotal-discountAmount);
    if(method==='credit'&&!customerId) return showFlash('posFlash','اختر العميل قبل تسجيل البيع الآجل.',true);
    if(method!=='credit'&&paidEntered<total) return showFlash('posFlash','المبلغ المدفوع أقل من الإجمالي. اختر البيع الآجل إن كان هناك مبلغ متبقٍ.',true);
    const paidAmount=method==='credit'?Math.min(paidEntered,total):paidEntered;
    const debtAdded=method==='credit'?Math.max(0,total-paidAmount):0;
    const changeAmount=Math.max(0,paidAmount-total);
    const grouped=new Map();
    const items=cart.map(function(item){
        const quantity=Number(item.qty),unitPrice=Number(item.price),unitCost=Number(item.cost)||0;
        grouped.set(item.id,(grouped.get(item.id)||0)+quantity);
        return {productId:item.id,productName:item.name,quantity:quantity,unitPrice:unitPrice,unitCost:unitCost,total:unitPrice*quantity};
    });
    for(const pair of grouped.entries()){
        const product=allProducts.find(function(item){return item.id===pair[0];});
        if(!product||Number(product.qty||0)<pair[1]) return showFlash('posFlash','الكمية المتاحة غير كافية للمنتج '+(product?product.name:pair[0]),true);
    }
    const invoiceRef=getInvoicesCol().doc();
    const now=new Date(),provisionalNumber='OFF-'+now.getTime().toString().slice(-8);
    const invoiceData={
        items:items,total:total,discountAmount:discountAmount,discountType:discountType==='percent'?'percent':'fixed',
        discountValue:discountValue,paymentMethod:method,customerId:customerId,paidAmount:paidAmount,
        changeAmount:changeAmount,userId:currentUserAuth.uid,cancelled:false,debtAdded:debtAdded,
        date:now,saleCostSnapshot:true
    };
    try{
        if(!isOnline()){
            await addPendingOp({type:'addInvoice',invoiceId:invoiceRef.id,data:Object.assign({},invoiceData,{invoiceNumber:provisionalNumber})});
            grouped.forEach(function(quantity,id){
                const product=allProducts.find(function(item){return item.id===id;});
                if(product) product.qty=Number(product.qty||0)-quantity;
            });
            if(customerId&&debtAdded>0){
                const customer=allCustomers.find(function(item){return item.id===customerId;});
                if(customer) customer.debt=Number(customer.debt||0)+debtAdded;
            }
            allInvoicesCache.unshift({id:invoiceRef.id,invoiceNumber:provisionalNumber,...invoiceData});
            await Promise.all([cacheData('products',allProducts),cacheData('customers',allCustomers),cacheData('invoices',allInvoicesCache)]);
            showFlash('posFlash','تم حفظ البيع على هذا الجهاز. ستتم مزامنته عند عودة الإنترنت.',false);
            lastReceiptData={cartItems:cart.slice(),total:total,method:method,customerId:customerId,change:changeAmount,debtAdded:debtAdded,invoiceNumber:provisionalNumber,discountAmount:discountAmount};
            document.getElementById('printReceiptArea').style.display='block';
            cart=[];renderCart();return;
        }
        const counterRef=getCountersCol().doc('daily_'+localDateKey(now));
        let invoiceNumber=0;
        await db.runTransaction(async function(transaction){
            const rows=[];
            for(const pair of grouped.entries()){
                const ref=getProductsCol().doc(pair[0]);
                rows.push({ref:ref,snap:await transaction.get(ref),quantity:pair[1]});
            }
            let customerRef=null,customerSnap=null;
            if(customerId&&debtAdded>0){
                customerRef=getCustomersCol().doc(customerId);
                customerSnap=await transaction.get(customerRef);
                if(!customerSnap.exists) throw new Error('العميل غير موجود.');
            }
            const counterSnap=await transaction.get(counterRef);
            rows.forEach(function(row){
                if(!row.snap.exists||Number(row.snap.data().qty||0)<row.quantity) throw new Error('المخزون غير كافٍ لإتمام البيع للمنتج.');
            });
            invoiceNumber=counterSnap.exists?Number(counterSnap.data().current||0)+1:1;
            transaction.set(counterRef,{current:invoiceNumber,date:firebase.firestore.Timestamp.fromDate(new Date(now.getFullYear(),now.getMonth(),now.getDate()))});
            rows.forEach(function(row){transaction.update(row.ref,{qty:Number(row.snap.data().qty||0)-row.quantity});});
            if(customerRef&&customerSnap) transaction.update(customerRef,{debt:Number(customerSnap.data().debt||0)+debtAdded});
            transaction.set(invoiceRef,Object.assign({},invoiceData,{invoiceNumber:invoiceNumber,date:firebase.firestore.FieldValue.serverTimestamp()}));
        });
        grouped.forEach(function(quantity,id){
            const product=allProducts.find(function(item){return item.id===id;});
            if(product) product.qty=Number(product.qty||0)-quantity;
        });
        if(customerId&&debtAdded>0){
            const customer=allCustomers.find(function(item){return item.id===customerId;});
            if(customer) customer.debt=Number(customer.debt||0)+debtAdded;
        }
        allInvoicesCache.unshift({id:invoiceRef.id,invoiceNumber:invoiceNumber,...invoiceData});
        await Promise.all([cacheData('products',allProducts),cacheData('customers',allCustomers),cacheData('invoices',allInvoicesCache)]);
        showFlash('posFlash','تم البيع بنجاح. رقم الفاتورة '+invoiceNumber,false);
        lastReceiptData={cartItems:cart.slice(),total:total,method:method,customerId:customerId,change:changeAmount,debtAdded:debtAdded,invoiceNumber:invoiceNumber,discountAmount:discountAmount};
        document.getElementById('printReceiptArea').style.display='block';
        cart=[];renderCart();
    }catch(error){
        console.error('Sale failed:',error);
        showFlash('posFlash',error.message||'تعذر إتمام البيع. لم يتم اعتماد الفاتورة.',true);
    }
}

function directPrint(htmlContent){

async function renderProductsTable(filteredList){
    const area=document.getElementById('productsListArea'); if(!area) return;
    const sourceList=filteredList!==undefined?filteredList:allProducts;
    if(!sourceList.length){ area.innerHTML='<p>لا توجد منتجات</p>'; return; }
    const totalProducts=sourceList.length;
    const totalPages=Math.ceil(totalProducts/productsPerPage);
    if(currentProductPage<1) currentProductPage=1;
    if(currentProductPage>totalPages) currentProductPage=totalPages;
    const startIdx=(currentProductPage-1)*productsPerPage;
    const pageProducts=sourceList.slice(startIdx,startIdx+productsPerPage);
    const searchBar=`<div class="filter-row" style="margin-bottom:8px;"><input type="text" id="productsTableSearch" placeholder="🔍 بحث سريع بالاسم أو الباركود" oninput="searchInProductsTable(this.value)" style="margin:0;"><button class="btn-sm" onclick="searchInProductsTable(document.getElementById('productsTableSearch')?.value||'')">بحث</button><button class="btn-sm" onclick="clearProductsTableSearch()">مسح</button></div>`;
    let html=`<div class="table-responsive"><table class="data-table"><thead><tr><th>الصورة</th><th>الاسم</th><th>باركود</th><th>سعر القطاعي</th><th>الكمية</th><th>الوحدة</th><th>حد التنبيه</th><th>إجراء</th></tr></thead><tbody>`;
    for(let p of pageProducts){
        let lsc=(p.qty<=(p.lowStockAlert||0))?'low-stock-row':'';
        html+=`<tr class="${lsc}"><td>${safeHttpUrl(p.imageUrl)?`<img src="${escapeHtml(safeHttpUrl(p.imageUrl))}" width="40" height="40" style="border-radius:8px;" alt="">`:'-'}</td><td style="text-align:right;">${escapeHtml(p.name)}</td><td>${escapeHtml(p.barcode||'-')}</td><td>${Number(p.priceRetail)||0} ج.م</td><td>${Number(p.qty)||0}</td><td>${escapeHtml(p.unit||'')}</td><td>${Number(p.lowStockAlert)||0}</td><td><button class="btn-sm" onclick="openEditProductModal('${escapeHtml(p.id)}')">✏️</button>${currentRole==='owner'?`<button class="btn-sm btn-danger" onclick="deleteProduct('${escapeHtml(p.id)}')">🗑️</button>`:''}</td></tr>`;
    }
    html+=`</tbody></table></div>`;
    html+=`<div class="pagination-controls"><button class="btn-sm" onclick="changeProductPage(-1)" ${currentProductPage<=1?'disabled style="opacity:0.4;"':''}>▶ السابق</button><span class="pagination-info">صفحة ${currentProductPage} من ${totalPages} | إجمالي: ${totalProducts}</span><button class="btn-sm" onclick="changeProductPage(1)" ${currentProductPage>=totalPages?'disabled style="opacity:0.4;"':''}>التالي ◀</button></div>`;
    area.innerHTML=searchBar+html;
}

let _productSearchTimer=null;
window.searchInProductsTable=function(val){
    currentProductPage=1; clearTimeout(_productSearchTimer);
    if(!val||!val.trim()){ renderProductsTable(); return; }
    _productSearchTimer=setTimeout(async()=>{
        const term=val.trim();
        if(!isOnline()||!currentStoreId){
            renderProductsTable(allProducts.filter(p=>p.name.toLowerCase().includes(term.toLowerCase())||(p.barcode&&p.barcode.toLowerCase().includes(term.toLowerCase()))));
            setTimeout(()=>{ const si=document.getElementById('productsTableSearch'); if(si) si.value=val; },0); return;
        }
        try{
            const snap=await getProductsCol().orderBy('name').startAt(term).endAt(term+'\uf8ff').limit(50).get();
            let results=snap.docs.map(d=>({id:d.id,...d.data()}));
            const byB=allProducts.filter(p=>p.barcode&&p.barcode.toLowerCase().includes(term.toLowerCase())&&!results.find(r=>r.id===p.id));
            results=results.concat(byB).slice(0,50);
            renderProductsTable(results);
        }catch(e){ renderProductsTable(allProducts.filter(p=>p.name.toLowerCase().includes(term.toLowerCase())||(p.barcode&&p.barcode.toLowerCase().includes(term.toLowerCase())))); }
        setTimeout(()=>{ const si=document.getElementById('productsTableSearch'); if(si) si.value=val; },0);
    },400);
};

window.recordPayment=async(custId)=>{
    const amount=Number.parseFloat(prompt('المبلغ المسدد'));
    if(!Number.isFinite(amount)||amount<=0){showFlash('customersListDiv','أدخل مبلغًا صحيحًا أكبر من صفر.',true);return;}
    const customerRef=getCustomersCol().doc(custId),paymentRef=getPaymentsCol().doc();
    try{
        let remainingDebt=0;
        await db.runTransaction(async function(transaction){
            const snapshot=await transaction.get(customerRef);
            if(!snapshot.exists)throw new Error('العميل غير موجود.');
            const currentDebt=Math.max(0,Number(snapshot.data().debt)||0);
            if(amount>currentDebt)throw new Error('المبلغ المسدد أكبر من الدين المستحق.');
            remainingDebt=currentDebt-amount;
            transaction.update(customerRef,{debt:remainingDebt});
            transaction.set(paymentRef,{
                customerId:custId,customerName:snapshot.data().name||'',
                amount:amount,recordedBy:currentUserAuth.uid,
                date:firebase.firestore.FieldValue.serverTimestamp(),
                type:'customer-debt-payment'
            });
        });
        const index=allCustomers.findIndex(function(customer){return customer.id===custId;});
        if(index!==-1)allCustomers[index].debt=remainingDebt;
        await cacheData('customers',allCustomers);
        renderCustomersTable();
        showFlash('customersListDiv','تم تسجيل السداد وحفظه في سجل المدفوعات.',false);
    }catch(error){showFlash('customersListDiv',error.message||'تعذر تسجيل السداد.',true);}
};

function filterAndDisplayInvoices(){
    let filtered=[...allInvoicesCache];
    const now=new Date();
    if(invoicesFilter==='today'){
        const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
        const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
        filtered=filtered.filter(function(invoice){const date=toDate(invoice.date);return date&&date>=start&&date<end;});
    }else if(invoicesFilter==='yesterday'){
        const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
        const end=new Date(now.getFullYear(),now.getMonth(),now.getDate());
        filtered=filtered.filter(function(invoice){const date=toDate(invoice.date);return date&&date>=start&&date<end;});
    }else if(invoicesFilter==='custom'&&invSelectedDate){
        const day=makeLocalDay(invSelectedDate);
        filtered=filtered.filter(function(invoice){const date=toDate(invoice.date);return date&&date>=day.start&&date<=day.end;});
    }
    if(invoiceSearchNumber.trim()!==''){
        const number=Number(invoiceSearchNumber);
        if(Number.isFinite(number))filtered=filtered.filter(function(invoice){return String(invoice.invoiceNumber)===String(number);});
    }
    filtered.sort(function(a,b){return (toDate(b.date)||0)-(toDate(a.date)||0);});
    const container=document.getElementById('salesLogList');
    if(!container)return;
    if(!filtered.length){container.innerHTML='<p>⚠️ لا توجد فواتير ضمن آخر 5000 فاتورة محملة</p>';return;}
    const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    let html='';
    for(const invoice of filtered){
        const cancelled=invoice.cancelled===true;
        const customer=invoice.customerId?allCustomers.find(function(item){return item.id===invoice.customerId;}):null;
        const date=toDate(invoice.date);
        const dayName=date?dayNames[date.getDay()]:'—';
        const items=(invoice.items||[]).map(function(item){return escapeHtml(item.productName)+' ('+Number(item.quantity||0)+')';}).join(', ');
        html+='<div class="card '+(cancelled?'cancelled':'')+'"><div class="card-info"><strong>فاتورة رقم: '+escapeHtml(invoice.invoiceNumber)+' - '+dayName+'</strong><br>المنتجات: '+items+'<br>الإجمالي: '+Number(invoice.total||0).toFixed(2)+' ج.م<br>طريقة الدفع: '+escapeHtml(getPaymentMethodArabic(invoice.paymentMethod))+' | العميل: '+escapeHtml(customer?customer.name:'نقدي')+'<br>التاريخ: '+escapeHtml(formatDate(invoice.date))+' | الحالة: '+(cancelled?'ملغاة':'ناجحة')+'</div><div>'+(!cancelled?'<button class="btn-sm btn-danger" onclick="cancelInvoice(\''+escapeHtml(invoice.id)+'\')">إلغاء</button>':'')+'</div></div>';
    }
    container.innerHTML=html;
}

window.cancelInvoice=async(invoiceId)=>{
    if(!confirm('إلغاء الفاتورة؟ سيتم إعادة الكميات للمخزون.')) return;
    try{
        const local=allInvoicesCache.find(function(item){return item.id===invoiceId;});
        if(!isOnline()){
            if(!local||local.cancelled) throw new Error('الفاتورة غير موجودة محليًا أو سبق إلغاؤها.');
            await addPendingOp({type:'cancelInvoice',invoiceId:invoiceId,items:local.items});
            (local.items||[]).forEach(function(item){
                const product=allProducts.find(function(p){return p.id===item.productId;});
                if(product) product.qty=Number(product.qty||0)+Number(item.quantity||0);
            });
            if(local.customerId&&local.paymentMethod==='credit'&&Number(local.debtAdded)>0){
                const customer=allCustomers.find(function(c){return c.id===local.customerId;});
                if(customer) customer.debt=Math.max(0,Number(customer.debt||0)-Number(local.debtAdded));
            }
            local.cancelled=true;
            await Promise.all([cacheData('products',allProducts),cacheData('customers',allCustomers),cacheData('invoices',allInvoicesCache)]);
            filterAndDisplayInvoices();
            showFlash('salesLogList','تم تسجيل الإلغاء محليًا وسيُزامن عند عودة الإنترنت.',false);return;
        }
        const invoiceRef=getInvoicesCol().doc(invoiceId);
        await db.runTransaction(async function(transaction){
            const snap=await transaction.get(invoiceRef);
            if(!snap.exists) throw new Error('الفاتورة غير موجودة.');
            const invoice=snap.data();
            if(invoice.cancelled) throw new Error('الفاتورة ملغاة بالفعل.');
            const grouped=new Map();
            (invoice.items||[]).forEach(function(item){grouped.set(item.productId,(grouped.get(item.productId)||0)+Number(item.quantity));});
            const rows=[];
            for(const pair of grouped.entries()){
                const ref=getProductsCol().doc(pair[0]);
                rows.push({ref:ref,snap:await transaction.get(ref),quantity:pair[1]});
            }
            let customerRef=null,customerSnap=null;
            if(invoice.customerId&&invoice.paymentMethod==='credit'&&Number(invoice.debtAdded)>0){
                customerRef=getCustomersCol().doc(invoice.customerId);customerSnap=await transaction.get(customerRef);
            }
            rows.forEach(function(row){if(row.snap.exists) transaction.update(row.ref,{qty:Number(row.snap.data().qty||0)+row.quantity});});
            if(customerRef&&customerSnap&&customerSnap.exists) transaction.update(customerRef,{debt:Math.max(0,Number(customerSnap.data().debt||0)-Number(invoice.debtAdded||0))});
            transaction.update(invoiceRef,{cancelled:true,cancelledAt:firebase.firestore.FieldValue.serverTimestamp()});
        });
        if(local) local.cancelled=true;
        await cacheData('invoices',allInvoicesCache);
        await refreshFromFirestore(false);filterAndDisplayInvoices();
        showFlash('salesLogList','تم إلغاء الفاتورة وإعادة المخزون.',false);
    }catch(error){showFlash('salesLogList',error.message||'تعذر إلغاء الفاتورة',true);}
};

let _inventorySearchTimer=null;
function filterInventory(){
    const search=document.getElementById('inventorySearch')?.value.trim()||'';
    const container=document.getElementById('inventoryTableContainer'); if(!container) return;
    const localFiltered=allProducts.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||(p.barcode&&p.barcode.toLowerCase().includes(search.toLowerCase())));
    _renderInventoryTable(localFiltered,container);
    if(search&&isOnline()&&currentStoreId){
        clearTimeout(_inventorySearchTimer);
        _inventorySearchTimer=setTimeout(async()=>{
            try{
                const snap=await getProductsCol().orderBy('name').startAt(search).endAt(search+'\uf8ff').limit(50).get();
                let results=snap.docs.map(d=>({id:d.id,...d.data()}));
                const byB=allProducts.filter(p=>p.barcode&&p.barcode.toLowerCase().includes(search.toLowerCase())&&!results.find(r=>r.id===p.id));
                results=results.concat(byB).slice(0,50);
                const c2=document.getElementById('inventoryTableContainer'); if(c2) _renderInventoryTable(results,c2);
            }catch(e){}

}

async function fetchInvoicesForReport(startDate,endDate){
    if(!isOnline())throw new Error('التقارير التاريخية تحتاج اتصالًا بالإنترنت. البيانات المحفوظة محليًا قد لا تشمل كل الفواتير.');
    let query=getInvoicesCol();
    if(startDate)query=query.where('date','>=',firebase.firestore.Timestamp.fromDate(startDate));
    if(endDate)query=query.where('date','<=',firebase.firestore.Timestamp.fromDate(endDate));
    query=query.orderBy('date','desc');
    const all=[],pageSize=500;
    let last=null;
    while(true){
        let pageQuery=query.limit(pageSize);
        if(last)pageQuery=pageQuery.startAfter(last);
        const snap=await pageQuery.get();
        if(snap.empty)break;
        all.push(...snap.docs.map(function(doc){return Object.assign({id:doc.id},doc.data());}));
        last=snap.docs[snap.docs.length-1];
        if(snap.docs.length<pageSize)break;
    }
    return all;
}
function makeLocalDay(dateText){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dateText))throw new Error('صيغة التاريخ يجب أن تكون YYYY-MM-DD.');
    const parts=dateText.split('-').map(Number);
    const start=new Date(parts[0],parts[1]-1,parts[2],0,0,0,0);
    if(start.getFullYear()!==parts[0]||start.getMonth()!==parts[1]-1||start.getDate()!==parts[2])throw new Error('التاريخ غير صحيح.');
    const end=new Date(parts[0],parts[1]-1,parts[2],23,59,59,999);
    return {start:start,end:end};
}

function displayReportTable(invoices,title){
    const target=document.getElementById('reportResult');
    if(!target)return;
    if(!invoices.length){target.innerHTML='<p>لا توجد بيانات</p>';return;}
    let totalSales=0,totalProfit=0,hasHistoricalCostGaps=false;
    for(const invoice of invoices){
        const revenue=Number(invoice.total)||0;
        let costTotal=0;
        for(const item of (invoice.items||[])){
            const product=allProducts.find(function(p){return p.id===item.productId;});
            const unitCost=item.unitCost!==undefined?Number(item.unitCost):(Number(product&&product.cost)||0);
            if(item.unitCost===undefined)hasHistoricalCostGaps=true;
            costTotal+=unitCost*Number(item.quantity||0);
        }
        totalSales+=revenue;
        totalProfit+=revenue-costTotal;
    }
    let html='<h4>'+escapeHtml(title)+'</h4><p>إجمالي المبيعات: '+totalSales.toFixed(2)+' ج.م | إجمالي الربح التقريبي: '+totalProfit.toFixed(2)+' ج.م</p>';
    if(hasHistoricalCostGaps)html+='<p class="auth-note">تنبيه: بعض الفواتير القديمة لا تحتوي تكلفة الشراء وقت البيع؛ تم استخدام تكلفة المنتج الحالية لهذه الفواتير، لذلك أرباحها تقديرية.</p>';
    html+='<div class="table-responsive"><table class="data-table" id="reportPrintTable"><thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>المنتجات</th></tr></thead><tbody>';
    for(const invoice of invoices){
        const items=(invoice.items||[]).map(function(item){return escapeHtml(item.productName)+' ('+Number(item.quantity||0)+')';}).join(', ');
        html+='<tr><td>'+escapeHtml(invoice.invoiceNumber)+'</td><td>'+escapeHtml(formatDate(invoice.date))+'</td><td>'+Number(invoice.total||0).toFixed(2)+'</td><td style="text-align:right;">'+items+'</td></tr>';
    }
    html+='</tbody></table></div><button class="btn-sm" onclick="printReportTable()">🖨️ طباعة التقرير</button>';
    target.innerHTML=html;
}

async function sendRegistrationCode(){
    const storeName=document.getElementById('registerStoreName').value.trim();
    const email=document.getElementById('registerEmail').value.trim().toLowerCase();
    const password=document.getElementById('registerPassword').value;
    const confirmPassword=document.getElementById('registerPasswordConfirm').value;
    if(!storeName||!email||!password||!confirmPassword)return showAuthMessage('أكمل جميع البيانات أولًا.',true);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showAuthMessage('اكتب بريدًا إلكترونيًا صحيحًا.',true);
    if(password.length<8)return showAuthMessage('كلمة المرور يجب أن تكون 8 أحرف على الأقل.',true);
    if(password!==confirmPassword)return showAuthMessage('كلمتا المرور غير متطابقتين.',true);
    const button=document.getElementById('sendCodeButton');
    button.disabled=true;
    try{
        await functionsClient().httpsCallable('requestRegistrationCode')({email:email,storeName:storeName});
        document.getElementById('registrationCodeArea').style.display='block';

    }catch(error){
        console.error(error);
        showAuthMessage(error.message||'تعذر إرسال كود التحقق. حاول لاحقًا.',true);

}

async function loginUser(){

    catch(error){
        const invalid=error.code==='auth/user-not-found'||error.code==='auth/wrong-password'||error.code==='auth/invalid-credential';
        showAuthMessage(invalid?'البريد الإلكتروني أو كلمة المرور غير صحيحة.':(error.message||'تعذر تسجيل الدخول.'),true);
    }
}
async function requestPasswordReset(){
    const email=document.getElementById('loginEmail').value.trim().toLowerCase();
    if(!email)return showAuthMessage('اكتب بريدك الإلكتروني أولًا.',true);
    try{
        await auth.sendPasswordResetEmail(email);
        showAuthMessage('إذا كان البريد مسجلًا، فستصلك رسالة لإعادة تعيين كلمة المرور.');
    }catch(error){showAuthMessage('تعذر إرسال رسالة الاستعادة. تحقق من البريد وحاول مرة أخرى.',true);}
}
async function handleSignedInUser(user){
    if(authHandlingUid===user.uid)return;
    authHandlingUid=user.uid;
    try{
        await dbReadyPromise;
        const info=await ensureUserDocument(user.uid,user.email);
        currentUserAuth=user;userData=info;currentStoreId=info.storeId||null;
        currentRole=info.role;isAdminGlobal=currentRole==='admin';
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('dashboard').style.display='block';
        document.getElementById('storeTitle').innerHTML='<i class="fas fa-store"></i> '+escapeHtml(info.storeName||'المحل');
        if(!isAdminGlobal){
            await loadFromCacheThenSync();
            await loadStoreData(true);
        }
        await ensureInvoicesCache();
        await ensureMissingProductsCache();
        const queuedLocalOps=await getPendingOps();
        const legacyOps=queuedLocalOps.filter(function(op){return !op.storeId||!op.userId;});
        if(legacyOps.length){
            showFlash('productsLoadingBar','تنبيه: عثرنا على '+legacyOps.length+' عملية محفوظة من إصدار قديم. احتفظنا بها ولم نرسلها تلقائيًا حتى لا تختلط الفواتير أو بيانات متجر آخر؛ راجعها قبل الاعتماد.',true);
        }
        buildTabs();
        setTimeout(function(){syncPendingOps();},1000);
    }catch(error){
        console.error('Account initialization failed:',error);
        authHandlingUid=null;
        await auth.signOut();
        document.getElementById('loginScreen').style.display='flex';
        document.getElementById('dashboard').style.display='none';
        showAuthMessage(error.message||'تعذر فتح الحساب. تواصل مع الدعم.',true);
    }
}
async function clearAllCachedData(){
    // لا نمسح قائمة العمليات المحلية عند تسجيل الخروج؛ قد تحتوي مبيعات لم تتم مزامنتها.
    allProducts=[];allCustomers=[];allSuppliers=[];allInvoicesCache=[];allMissingProducts=[];
    currentUserAuth=null;userData=null;currentStoreId=null;currentRole=null;isAdminGlobal=false;
    authHandlingUid=null;missingProductsLoaded=false;currentProductPage=1;cart=[];lastReceiptData=null;
}
window.logoutUser=async function(){await clearAllCachedData();await auth.signOut();};
auth.onAuthStateChanged(async function(user){
    if(user) await handleSignedInUser(user);
    else{
        authHandlingUid=null;currentUserAuth=null;userData=null;currentStoreId=null;currentRole=null;isAdminGlobal=false;
        document.getElementById('loginScreen').style.display='flex';
        document.getElementById('dashboard').style.display='none';
    }
});
</script>
</body>
