<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMG.VID | عالم الأفلام</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --main-red: #e50914;
            --main-black: #0b0b0b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--main-black);
            color: white;
            margin: 0;
            padding: 0;
        }

        /* تنسيق الهيدر ومنع تداخل الكلام */
        header {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; width: 90%; z-index: 1000;
            height: 60px;
        }

        .logo-container img {
            height: 40px;
            width: auto;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .container {
            padding: 100px 5% 20px;
        }

        .section-title {
            border-right: 4px solid var(--main-red);
            padding-right: 10px;
            margin-bottom: 20px;
        }

        /* شبكة الأفلام */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            cursor: pointer;
        }

        .movie-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
        }

        /* المشغل */
        #player-layer {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,1);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 90%;
            height: 60%;
            border: 2px solid var(--main-red);
        }

        .close-btn {
            background: var(--main-red);
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="AMG.VID.png" alt="AMG.VID">
    </div>
    <nav>
        <ul>
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#">الأقسام</a></li>
            <li><a href="#">اتصل بنا</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <h2 class="section-title">أحدث الإضافات</h2>
    <div class="movie-grid" id="movie-display">
        </div>
</div>

<div id="player-layer">
    <div id="video-frame" style="width:100%; text-align:center;"></div>
    <button class="close-btn" onclick="closeMe()">إغلاق</button>
</div>

<script>
    // بيانات الأفلام
    const myMovies = [
        {
            name: "Joker: Folie à Deux 2024",
            img: "https://image.tmdb.org/t/p/w500/udDcl70jRpkJSnyUoT8asIuS3un.jpg",
            link: "https://vidoza.net/embed-xxxx.html"
        }
    ];

    const display = document.getElementById('movie-display');

    function render() {
        display.innerHTML = '';
        myMovies.forEach(m => {
            const item = document.createElement('div');
            item.className = 'movie-card';
            item.innerHTML = `
                <img src="${m.img}">
                <div class="movie-info">${m.name}</div>
            `;
            item.onclick = () => play(m.link);
            display.appendChild(item);
        });
    }

    function play(url) {
        document.getElementById('video-frame').innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
        document.getElementById('player-layer').style.display = 'flex';
    }

    function closeMe() {
        document.getElementById('player-layer').style.display = 'none';
        document.getElementById('video-frame').innerHTML = '';
    }

    render();
</script>

</body>
</html>
