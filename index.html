<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMG.VID | مشاهدة أحدث الأفلام والمسلسلات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <div class="logo">AMG<span>.VID</span></div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#"><i class="fas fa-home"></i> الرئيسية</a></li>
                    <li><a href="#"><i class="fas fa-film"></i> الأفلام</a></li>
                    <li><a href="#"><i class="fas fa-tv"></i> المسلسلات</a></li>
                </ul>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="ابحث عن فيلمك...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="movies-section">
            <div class="section-title">
                <h2><i class="fas fa-star"></i> المضاف حديثاً</h2>
            </div>
            <div class="movies-grid" id="movie-display">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
