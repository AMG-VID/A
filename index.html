<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يلا بينا افلام وبس || AMG-VID</title>
    <link rel="icon" type="image/png" href="icone.png">

    <style>
        :root {
            --bg-orange: #ff6600; 
            --primary-red: #cc0000;
            --pure-white: #ffffff;
            --deep-black: #000000;
            --caution-yellow: #ffcc00;
        }

        body {
            background-color: var(--bg-orange);
            color: var(--deep-black);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--deep-black);
            border-bottom: 5px solid var(--caution-yellow);
            padding: 30px 20px;
            text-align: center;
        }

        .logo {
            max-width: 180px;
            display: block;
            margin: 0 auto;
            border: 3px solid var(--pure-white);
            cursor: pointer;
        }

        .categories-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 50px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .category-card {
            background-color: var(--deep-black);
            color: var(--caution-yellow);
            padding: 50px 20px;
            text-align: center;
            border-radius: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .category-card:hover { transform: translateY(-10px); background-color: var(--primary-red); color: white; }

        .section-content { display: none; padding: 20px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        .active-section { display: block; }

        .section-header { text-align: center; margin-bottom: 30px; }
        .search-input {
            width: 80%; max-width: 500px; padding: 12px; border-radius: 25px;
            border: 3px solid var(--deep-black); font-size: 1rem; text-align: center; outline: none;
        }

        .back-btn {
            background: var(--deep-black); color: var(--caution-yellow); border: none;
            padding: 10px 25px; cursor: pointer; border-radius: 30px; font-weight: bold; margin-bottom: 15px;
        }

        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .movie-card { background-color: var(--deep-black); border-radius: 15px; overflow: hidden; transition: 0.3s; }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* نسبة 16:9 */
            height: 0;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .movie-info { padding: 15px; text-align: center; color: white; }
        footer { background-color: var(--deep-black); color: var(--caution-yellow); text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <img src="AMG.VID.png" alt="شعار الموقع" class="logo" onclick="showHome()">
    </header>

    <div id="homePage" class="categories-container">
        <div class="category-card" onclick="showSection('year2024')">أفلام 2024</div>
        <div class="category-card" onclick="showSection('year2025')">أفلام 2025</div>
        <div class="category-card" onclick="showSection('year2026')">أفلام 2026</div>
        <div class="category-card" onclick="showSection('allMovies')">جميع الأفلام</div>
    </div>

    <!-- قسم 2024 -->
    <div id="year2024" class="section-content">
        <div class="section-header">
            <button class="back-btn" onclick="showHome()">← العودة للرئيسية</button>
            <h2>قسم أفلام 2024</h2>
        </div>
        <div class="movies-grid">
            <div class="movie-card">
                <div class="video-container">
                    <iframe src="https://drive.google.com/file/1DlydZ2mezh3GxLupr7DnTPV0hTBt8z9n/preview" allow="autoplay" allowfullscreen></iframe>
                </div>
                <div class="movie-info"><h3>فيلم الدشاش</h3></div>
            </div>
        </div>
    </div>

    <!-- قسم جميع الأفلام -->
    <div id="allMovies" class="section-content">
        <div class="section-header">
            <button class="back-btn" onclick="showHome()">← العودة للرئيسية</button>
            <h2>جميع الأفلام</h2>
        </div>
        <div class="movies-grid">
            <div class="movie-card">
                <div class="video-container">
                    <iframe src="https://drive.google.com/file/1DlydZ2mezh3GxLupr7DnTPV0hTBt8z9n/preview" allow="autoplay" allowfullscreen></iframe>
                </div>
                <div class="movie-info"><h3>فيلم الدشاش</h3></div>
            </div>
        </div>
    </div>

    <!-- باقي الأقسام -->
    <div id="year2025" class="section-content"><div class="section-header"><button class="back-btn" onclick="showHome()">←</button><h2>2025</h2></div><p style="text-align:center">قريباً...</p></div>
    <div id="year2026" class="section-content"><div class="section-header"><button class="back-btn" onclick="showHome()">←</button><h2>2026</h2></div><p style="text-align:center">قريباً...</p></div>

    <footer><p>تم استخراج البيانات بواسطة نظام الفراعنة &copy; 2026</p></footer>

    <script>
        function showSection(id) {
            document.getElementById('homePage').style.display = 'none';
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active-section'));
            document.getElementById(id).classList.add('active-section');
        }
        function showHome() {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active-section'));
            document.getElementById('homePage').style.display = 'grid';
        }
    </script>
</body>
</html>
