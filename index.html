<script>
// ======================= PWA Service Worker =======================
(function setupPWA() {
    const manifestObj = {
        "name": "ManaraTech", "short_name": "ManaraTech", "start_url": ".",
        "display": "standalone", "theme_color": "#4c1d95", "background_color": "#eef2ff",
        "icons": [{ "src": "Icon.png", "sizes": "any", "type": "image/jpeg" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    let manifestLink = document.querySelector('link[rel="manifest"]');
    if (!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
    manifestLink.href = manifestURL;

    const swCode = `
const CACHE_NAME = 'manara-v3';
const urlsToCache = [
    './', './index.html', 'Icon.png',
    'https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap',
    'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css',
    'https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js',
    'https://cdn.jsdelivr.net/npm/idb@8.0.0/build/umd.js'
];
self.addEventListener('install', e => {
    e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(urlsToCache)).catch(()=>{}));
    self.skipWaiting();
});
self.addEventListener('activate', e => {
    e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => { if(k !== CACHE_NAME) return caches.delete(k); }))));
    self.clients.claim();
});
self.addEventListener('fetch', e => {
    e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).then(res => {
        if(res && res.status === 200 && e.request.method === 'GET') {
            const resClone = res.clone();
            caches.open(CACHE_NAME).then(c => c.put(e.request, resClone));
        }
        return res;
    }).catch(() => caches.match('./'))));
});`;
    const swBlob = new Blob([swCode], {type:'application/javascript'});
    const swURL = URL.createObjectURL(swBlob);
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(swURL).catch(e => console.warn('SW:', e));
    }
})();

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
});

// ======================= Firebase =======================
const firebaseConfig = {
    apiKey: "AIzaSyCYh6oC5nM2DZHgdOquHuo1so1DiQ7Gbs0",
    authDomain: "bakkala-system.firebaseapp.com",
    projectId: "bakkala-system",
    storageBucket: "bakkala-system.firebasestorage.app",
    messagingSenderId: "807660158854",
    appId: "1:807660158854:web:c3690293a27185f07fb607"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true, cacheSizeBytes: 104857600 }).catch(e => console.warn(e));

const QUERY_LIMITS = { products:15000, customers:1000, suppliers:500, invoices:500, missingProducts:200, supplierProducts:200 };

let idbReady = false, dbCache;
const openDB = async () => {
    if (!window.idb) return;
    dbCache = await idb.openDB('FatoraMousaOffline', 10, {
        upgrade(db) {
            if (!db.objectStoreNames.contains('pending')) db.createObjectStore('pending', { autoIncrement: true });
            if (!db.objectStoreNames.contains('cache')) db.createObjectStore('cache', { keyPath: 'key' });
        }
    });
    idbReady = true;
};
openDB();

async function cacheData(key, data) { if (idbReady && dbCache) await dbCache.put('cache', { key, data, timestamp: Date.now() }); }
async function getCachedData(key) { if (idbReady && dbCache) { const res = await dbCache.get('cache', key); return res?.data; } return null; }
async function addPendingOp(op) { if (idbReady && dbCache) await dbCache.add('pending', op); }
async function getPendingOps() { if (idbReady && dbCache) return await dbCache.getAll('pending'); return []; }
async function clearPendingOps() { if (idbReady && dbCache) await dbCache.clear('pending'); }

let currentUserAuth=null, userData=null, currentStoreId=null, currentRole=null, isAdminGlobal=false;
let allProducts=[], allCustomers=[], allSuppliers=[], allInvoicesCache=[], allMissingProducts=[];
let lastReceiptData=null, isSyncing=false, currentEditProductId=null, missingProductsLoaded=false;
let currentProductPage=1;
const productsPerPage=100;

async function loadFromCacheThenSync() {
    allProducts = await getCachedData('products') || [];
    allCustomers = await getCachedData('customers') || [];
    allSuppliers = await getCachedData('suppliers') || [];
    allInvoicesCache = await getCachedData('invoices') || [];
    allMissingProducts = await getCachedData('missingProducts') || [];
}
loadFromCacheThenSync();

let lastRefreshTime = 0;
const REFRESH_COOLDOWN = 5 * 60 * 1000;

function getStoreRef(){ return db.collection('stores').doc(currentStoreId); }
function getProductsCol(){ return getStoreRef().collection('products'); }
function getCustomersCol(){ return getStoreRef().collection('customers'); }
function getSuppliersCol(){ return getStoreRef().collection('suppliers'); }
function getInvoicesCol(){ return getStoreRef().collection('invoices'); }
function getCountersCol(){ return getStoreRef().collection('counters'); }
function getMissingProductsCol(){ return getStoreRef().collection('missingProducts'); }

async function refreshFromFirestore(showLoading=true) {
    if (!currentStoreId || isAdminGlobal) return;
    try {
        const loadingBar = document.getElementById('productsLoadingBar');
        if (showLoading && loadingBar) { loadingBar.style.display='flex'; loadingBar.innerHTML='<span class="search-spinner"></span> جاري تحميل المنتجات...'; }
        let allFetchedProducts=[], lastDoc=null;
        let keepFetching=true;
        while (keepFetching) {
            let query = getProductsCol().orderBy(firebase.firestore.FieldPath.documentId()).limit(500);
            if (lastDoc) query = query.startAfter(lastDoc);
            const snap = await query.get();
            if (snap.empty) break;
            allFetchedProducts = allFetchedProducts.concat(snap.docs.map(d=>({id:d.id,...d.data()})));
            lastDoc = snap.docs[snap.docs.length-1];
            if (showLoading && loadingBar) loadingBar.innerHTML=`<span class="search-spinner"></span> جاري تحميل المنتجات... ${allFetchedProducts.length} منتج`;
            if (snap.docs.length < 500 || allFetchedProducts.length >= QUERY_LIMITS.products) keepFetching=false;
        }
        if (showLoading && loadingBar) loadingBar.style.display='none';
        const [custSnap,suppSnap,invSnap,missingSnap] = await Promise.all([
            getCustomersCol().limit(QUERY_LIMITS.customers).get(),
            getSuppliersCol().limit(QUERY_LIMITS.suppliers).get(),
            getInvoicesCol().orderBy('date','desc').limit(QUERY_LIMITS.invoices).get(),
            getMissingProductsCol().limit(QUERY_LIMITS.missingProducts).get()
        ]);
        allProducts=allFetchedProducts;
        allCustomers=custSnap.docs.map(d=>({id:d.id,...d.data()}));
        allSuppliers=suppSnap.docs.map(d=>({id:d.id,...d.data()}));
        allInvoicesCache=invSnap.docs.map(d=>({id:d.id,...d.data()}));
        allMissingProducts=missingSnap.docs.map(d=>({id:d.id,...d.data()}));
        missingProductsLoaded=true;
        await Promise.all([cacheData('products',allProducts),cacheData('customers',allCustomers),cacheData('suppliers',allSuppliers),cacheData('invoices',allInvoicesCache),cacheData('missingProducts',allMissingProducts)]);
        if (document.getElementById('productsListArea')) renderProductsTable();
        if (document.getElementById('salesLogList')) filterAndDisplayInvoices();
        if (document.getElementById('otherContent')) loadOtherSubContent();
        if (document.getElementById('customersListDiv')) renderCustomersTable();
        if (document.getElementById('invoicesList')) applyInvoicesFilters();
    } catch(e) { console.warn(e); }
}

async function loadStoreData(forceRefresh=false) {
    if (isAdminGlobal || !currentStoreId) return;
    const now=Date.now();
    if (!forceRefresh && allProducts.length>0 && (now-lastRefreshTime)<REFRESH_COOLDOWN) return;
    await refreshFromFirestore(true);
    lastRefreshTime=now;
}

function showFlash(id,txt,err=false){
    let el=document.getElementById(id);
    if(!el){ el=document.createElement('div'); el.className='flash'; const t=document.getElementById('tabContent')||document.getElementById('dashboard'); if(t) t.prepend(el); else document.getElementById('app')?.prepend(el); }
    el.innerText=txt; el.style.backgroundColor=err?'#ffe0e0':'#e0f2fe'; el.style.color=err?'#b91c1c':'#065f46';
    setTimeout(()=>el.remove(),3000);
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function formatDate(ts){ return ts?.toDate ? ts.toDate().toLocaleString('ar-EG') : new Date(ts).toLocaleString('ar-EG'); }
function getPaymentMethodArabic(m){ return m==='cash'?'كاش':m==='visa'?'فيزا':m==='credit'?'آجل':m; }

async function ensureStoreDocument(sid,sname){
    const ref=db.collection('stores').doc(sid); const doc=await ref.get();
    if(!doc.exists) await ref.set({name:sname,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    return ref;
}
async function ensureUserDocument(uid,email){
    const userRef=db.collection('users').doc(uid); const doc=await userRef.get();
    if(doc.exists){
        if(doc.data().isActive===false) throw new Error('الحساب معطل');
        const data=doc.data();
        await ensureStoreDocument(data.storeId,data.storeName||'محل تجاري');
        return data;
    }
    let storeName=`محل ${email.split('@')[0]}`;
    let storeIdBase=storeName.replace(/\s/g,'').replace(/[^a-zA-Z0-9\u0600-\u06FF]/g,'');
    let storeId=`store_${storeIdBase}`;
    const existing=await db.collection('stores').doc(storeId).get();
    if(existing.exists) storeId=`store_${storeIdBase}_${Date.now()}`;
    await ensureStoreDocument(storeId,storeName);
    const newUser={email,role:'owner',storeId,storeName,isActive:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    await userRef.set(newUser);
    return newUser;
}

async function getNextInvoiceNumber(){
    const today=new Date(); today.setHours(0,0,0,0);
    const counterRef=getCountersCol().doc(`daily_${today.toISOString().split('T')[0]}`);
    return await db.runTransaction(async(transaction)=>{
        const snap=await transaction.get(counterRef);
        let n=1;
        if(snap.exists){ n=snap.data().current+1; transaction.update(counterRef,{current:firebase.firestore.FieldValue.increment(1)}); }
        else transaction.set(counterRef,{current:1,date:firebase.firestore.Timestamp.fromDate(today)});
        return n;
    });
}

async function ensureInvoicesCache(){ return allInvoicesCache; }

async function syncPendingOps(){
    if(!navigator.onLine||isSyncing) return;
    isSyncing=true;
    const pending=await getPendingOps();
    if(pending.length===0){ isSyncing=false; return; }
    for(let op of pending){
        try{
            if(op.type==='addInvoice'){
                await getInvoicesCol().add(op.data);
                const productIds=[...new Set(op.data.items.map(i=>i.productId))];
                const prodDocs=await Promise.all(productIds.map(pid=>getProductsCol().doc(pid).get()));
                const prodMap={};
                prodDocs.forEach(doc=>{if(doc.exists) prodMap[doc.id]=doc.data();});
                const batch=db.batch();
                for(let item of op.data.items){ if(prodMap[item.productId]!==undefined) batch.update(getProductsCol().doc(item.productId),{qty:firebase.firestore.FieldValue.increment(-item.quantity)}); }
                await batch.commit();
                if(op.data.customerId&&op.data.paymentMethod==='credit'&&op.data.debtAdded>0) await getCustomersCol().doc(op.data.customerId).update({debt:firebase.firestore.FieldValue.increment(op.data.debtAdded)});
            } else if(op.type==='addProduct'){
                const docRef=await getProductsCol().add(op.data);
                allProducts.push({id:docRef.id,...op.data}); await cacheData('products',allProducts);
            } else if(op.type==='cancelInvoice'){
                const invRef=getInvoicesCol().doc(op.invoiceId);
                const batch=db.batch(); batch.update(invRef,{cancelled:true});
                for(let item of op.items) batch.update(getProductsCol().doc(item.productId),{qty:firebase.firestore.FieldValue.increment(item.quantity)});
                if(op.customerId&&op.debtRemoved>0) batch.update(getCustomersCol().doc(op.customerId),{debt:firebase.firestore.FieldValue.increment(-op.debtRemoved)});
                await batch.commit();
            } else if(op.type==='addMissingProduct') await getMissingProductsCol().add(op.data);
            else if(op.type==='deleteMissingProduct') await getMissingProductsCol().doc(op.missingId).delete();
        }catch(e){ console.warn(e); }
    }
    await clearPendingOps();
    await refreshFromFirestore(true);
    if(document.getElementById('salesLogList')) filterAndDisplayInvoices();
    if(document.getElementById('otherContent')) loadOtherSubContent();
    isSyncing=false;
}

function buildTabs(){

        {id:'pos',name:'💰 نقطة البيع'},{id:'products',name:'📦 المنتجات'},

        {id:'salesLog',name:'📋 سجل المبيعات'},{id:'invoices',name:'📄 الفواتير'},
        {id:'other',name:'📦 أخرى'}
    ];
    cont.innerHTML=tabs.map(t=>`<button class="nav-btn" data-tab="${t.id}">${t.name}</button>`).join('');
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));

async function switchTab(tabId){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    const ab=document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
    if(ab) ab.classList.add('active');
    const cont=document.getElementById('tabContent');
    if(isAdminGlobal){ cont.innerHTML='<div class="flash">لوحة المشرف قيد التطوير</div>'; return; }
    await loadStoreData(false);
    if(tabId==='pos') await renderPosTab(cont);
    else if(tabId==='products') await renderProductsTab(cont);
    else if(tabId==='customers') await renderCustomersTab(cont);
    else if(tabId==='suppliers') await renderSuppliersTab(cont);
    else if(tabId==='salesLog') await renderSalesLogTab(cont);
    else if(tabId==='invoices') await renderInvoicesTab(cont);
    else if(tabId==='other') await renderOtherTab(cont);
}

let cart=[];
async function renderPosTab(container){
    cart=[]; lastReceiptData=null;
    let custOpt=`<option value="">بدون عميل</option>`+allCustomers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
    container.innerHTML=`
    <div style="background:#f8fafc;border-radius:32px;padding:20px;">
        <h3>💰 نقطة البيع السريعة</h3>
        <div class="pos-row">
            <input type="text" id="searchProduct" placeholder="🔍 باركود أو اسم" oninput="searchProductLive()">
            <select id="productSelect"><option>اختر منتج</option></select>
            <input type="number" id="cartQty" placeholder="الكمية" value="1">
            <button onclick="addToCart()" class="btn-sm">➕ أضف للسلة</button>
        </div>

        <div class="pos-row">
            <input type="text" id="searchCustomer" placeholder="🔍 بحث عن عميل" oninput="filterCustomers()">
            <select id="customerId">${custOpt}</select>
            <select id="paymentMethod"><option value="cash">كاش</option><option value="visa">فيزا</option><option value="credit">آجل</option></select>
        </div>
        <div class="pos-row">
            <input type="number" id="discountValue" placeholder="قيمة الخصم" value="0" step="0.01">
            <select id="discountType"><option value="fixed">قيمة ثابتة</option><option value="percent">نسبة %</option></select>
            <button onclick="applyDiscount()" class="btn-sm" style="background:#10b981;">تطبيق خصم</button>
        </div>
        <div class="pos-row">
            <input type="number" id="paidAmount" placeholder="المدفوع" oninput="updateChange()">
            <input type="text" id="changeAmount" placeholder="الباقي" readonly>
        </div>
        <div style="font-size:24px;font-weight:bold;" id="totalAmount">الإجمالي: 0 ج.م</div>
        <button onclick="confirmSale()" style="background:#10b981;">إتمام البيع</button>
        <div id="posFlash"></div>
        <div id="printReceiptArea" style="margin-top:10px;display:none;"><button onclick="printLastReceipt()" style="background:#22c55e;">🖨️ طباعة الفاتورة</button></div>
    </div>`;
    refreshProductsForPos();
    window.searchProductLive=()=>refreshProductsForPos();
    window.filterCustomers=()=>{
        let val=document.getElementById('searchCustomer').value.toLowerCase();
        let filtered=allCustomers.filter(c=>c.name.toLowerCase().includes(val));
        document.getElementById('customerId').innerHTML=`<option value="">بدون عميل</option>`+filtered.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
    };
    window.addToCart=()=>{
        let pid=document.getElementById('productSelect').value;
        if(!pid||pid==='لا يوجد') return;
        let qty=parseInt(document.getElementById('cartQty').value);
        if(qty<=0) return;
        let prod=allProducts.find(p=>p.id===pid);
        if(!prod||prod.qty<qty){ showFlash('posFlash','كمية غير متوفرة',true); return; }
        let existing=cart.find(i=>i.id===pid);
        if(existing) existing.qty+=qty;
        else cart.push({id:pid,name:prod.name,price:prod.priceRetail||prod.price,qty});
        renderCart();
    };
    window.renderCart=()=>{
        let cd=document.getElementById('cartItems'); let total=0;
        let h=`<h4>السلة</h4>`;
        cart.forEach((item,idx)=>{ total+=item.price*item.qty; h+=`<div class="card" style="padding:10px;">${item.name} x ${item.qty} = ${(item.price*item.qty).toFixed(2)} ج.م <button class="btn-sm btn-danger" onclick="removeFromCart(${idx})">حذف</button></div>`; });
        cd.innerHTML=h;
        document.getElementById('totalAmount').innerHTML=`الإجمالي: ${total.toFixed(2)} ج.م`;
        updateChange();
    };
    window.removeFromCart=(idx)=>{ cart.splice(idx,1); renderCart(); };
    window.updateChange=()=>{
        let t=cart.reduce((s,i)=>s+(i.price*i.qty),0);
        let dv=parseFloat(document.getElementById('discountValue').value)||0;
        let dt=document.getElementById('discountType').value;
        let disc=dt==='percent'?(t*dv/100):dv;
        let after=Math.max(0,t-disc);
        let paid=parseFloat(document.getElementById('paidAmount').value)||0;
        document.getElementById('changeAmount').value=(paid>after)?(paid-after).toFixed(2):0;
        document.getElementById('totalAmount').innerHTML=`الإجمالي: ${after.toFixed(2)} ج.م`;
    };
    window.applyDiscount=()=>updateChange();
    let _posTimer=null;
    async function refreshProductsForPos(){
        const val=document.getElementById('searchProduct').value.trim();
        const s=document.getElementById('productSelect');
        if(!val){ const lim=allProducts.slice(0,200); s.innerHTML=lim.map(p=>`<option value="${p.id}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('')||'<option>لا يوجد</option>'; return; }
        const lf=allProducts.filter(p=>(p.barcode&&p.barcode.includes(val))||p.name.includes(val));
        s.innerHTML=lf.map(p=>`<option value="${p.id}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('')||'<option>لا يوجد</option>';
        clearTimeout(_posTimer);
        _posTimer=setTimeout(async()=>{
            if(!isOnline()||!currentStoreId) return;
            try{
                const snap=await getProductsCol().orderBy('name').startAt(val).endAt(val+'\uf8ff').limit(20).get();
                let results=snap.docs.map(d=>({id:d.id,...d.data()}));
                const byB=allProducts.filter(p=>p.barcode&&p.barcode.includes(val)&&!results.find(r=>r.id===p.id));
                results=results.concat(byB).slice(0,30);
                const sc=document.getElementById('productSelect'); if(!sc) return;
                sc.innerHTML=results.map(p=>`<option value="${p.id}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('')||'<option>لا يوجد</option>';
            }catch(e){}
        },300);
    }
    renderCart();
}

async function confirmSale(){
    if(cart.length===0) return showFlash('posFlash','السلة فارغة',true);
    let cid=document.getElementById('customerId').value||null;
    let pm=document.getElementById('paymentMethod').value;
    let paid=parseFloat(document.getElementById('paidAmount').value)||0;
    let totalBefore=cart.reduce((s,i)=>s+(i.price*i.qty),0);
    let dv=parseFloat(document.getElementById('discountValue').value)||0;
    let dt=document.getElementById('discountType').value;
    let discountAmount=dt==='percent'?(totalBefore*dv/100):dv;
    let total=Math.max(0,totalBefore-discountAmount);
    let finalMethod=pm,change=0,debtAdded=0;
    if(cid&&paid<total){ finalMethod='credit'; debtAdded=total-paid; paid=total; change=0; showFlash('posFlash',`سيتم إضافة ${debtAdded} ج.م كدين`,false); }
    else if(finalMethod!=='credit'&&paid<total) return showFlash('posFlash','المدفوع أقل من الإجمالي',true);
    else if(finalMethod!=='credit'){ change=paid-total; if(change<0) return showFlash('posFlash','المدفوع أقل',true); }
    try{
        for(let item of cart){ let lp=allProducts.find(p=>p.id===item.id); if(!lp||lp.qty<item.qty) throw new Error(`المنتج ${item.name} غير متوفر`); }
        const invoiceNumber=await getNextInvoiceNumber();
        const invoiceData={invoiceNumber,items:cart.map(i=>({productId:i.id,productName:i.name,quantity:i.qty,unitPrice:i.price,total:i.price*i.qty})),total,discountAmount,discountType:dt==='percent'?'percent':'fixed',discountValue:dv,paymentMethod:finalMethod,customerId:cid,paidAmount:paid,changeAmount:change,userId:currentUserAuth.uid,cancelled:false,date:firebase.firestore.FieldValue.serverTimestamp(),debtAdded};
        if(!isOnline()){
            await addPendingOp({type:'addInvoice',data:invoiceData});
            if(cid&&debtAdded>0){ let cust=allCustomers.find(c=>c.id===cid); if(cust) cust.debt=(cust.debt||0)+debtAdded; await cacheData('customers',allCustomers); }
            showFlash('posFlash','✅ تم حفظ البيع محلياً',false);
            lastReceiptData={cartItems:[...cart],total,method:finalMethod,customerId:cid,change,debtAdded,invoiceNumber,discountAmount};
            document.getElementById('printReceiptArea').style.display='block';
            cart=[]; renderCart(); return;
        }
        const batch=db.batch();
        for(let item of cart) batch.update(getProductsCol().doc(item.id),{qty:firebase.firestore.FieldValue.increment(-item.qty)});
        const invoiceRef=getInvoicesCol().doc(); batch.set(invoiceRef,invoiceData);
        if(cid&&debtAdded>0) batch.update(getCustomersCol().doc(cid),{debt:firebase.firestore.FieldValue.increment(debtAdded)});
        await batch.commit();
        showFlash('posFlash',`✅ بيع ناجح بقيمة ${total} ج.م`,false);
        lastReceiptData={cartItems:[...cart],total,method:finalMethod,customerId:cid,change,debtAdded,invoiceNumber,discountAmount};
        document.getElementById('printReceiptArea').style.display='block';
        cart=[]; renderCart();
    }catch(err){ showFlash('posFlash',err.message,true); }
}

function directPrint(htmlContent){

    if(!iframe){ iframe=document.createElement('iframe'); iframe.id='printIframe'; iframe.style.cssText='position:absolute;width:0;height:0;border:none;'; document.body.appendChild(iframe); }
    const doc=iframe.contentWindow.document; doc.open(); doc.write(htmlContent); doc.close();
    iframe.contentWindow.focus(); iframe.contentWindow.print();
}

    let dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

    let tableHeaders=`<tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>`;
    let tableRows=cartItems.map(i=>`<tr><td style="text-align:right;">${escapeHtml(i.name)}</td><td>${i.qty}</td><td>${i.price.toFixed(2)}</td><td>${(i.qty*i.price).toFixed(2)}</td></tr>`).join('');

    footerInfo+=`<div class="info-row">طريقة الدفع: ${getPaymentMethodArabic(method)}</div><div class="info-row" style="font-weight:bold;">الإجمالي: ${total.toFixed(2)} ج.م</div>`;
    if(method!=='credit') footerInfo+=`<div class="info-row">المدفوع: ${(total+change).toFixed(2)} ج.م &nbsp; الباقي: ${change.toFixed(2)} ج.م</div>`;
    if(debtAdded>0) footerInfo+=`<div class="info-row">تم إضافة دين: ${debtAdded.toFixed(2)} ج.م</div>`;
    directPrint(generatePrintHTML('فاتورة بيع',headerInfo,tableHeaders,tableRows,footerInfo));
}

async function renderProductsTable(filteredList){
    const area=document.getElementById('productsListArea'); if(!area) return;
    const sourceList=filteredList!==undefined?filteredList:allProducts;
    if(!sourceList.length){ area.innerHTML='<p>لا توجد منتجات</p>'; return; }
    const totalProducts=sourceList.length;
    const totalPages=Math.ceil(totalProducts/productsPerPage);
    if(currentProductPage<1) currentProductPage=1;
    if(currentProductPage>totalPages) currentProductPage=totalPages;
    const startIdx=(currentProductPage-1)*productsPerPage;
    const pageProducts=sourceList.slice(startIdx,startIdx+productsPerPage);
    const searchBar=`<div class="filter-row" style="margin-bottom:8px;"><input type="text" id="productsTableSearch" placeholder="🔍 بحث سريع بالاسم أو الباركود" oninput="searchInProductsTable(this.value)" style="margin:0;"><button class="btn-sm" onclick="searchInProductsTable(document.getElementById('productsTableSearch')?.value||'')">بحث</button><button class="btn-sm" onclick="clearProductsTableSearch()">مسح</button></div>`;
    let html=`<div class="table-responsive"><table class="data-table"><thead><tr><th>الصورة</th><th>الاسم</th><th>باركود</th><th>سعر القطاعي</th><th>الكمية</th><th>الوحدة</th><th>حد التنبيه</th><th>إجراء</th></tr></thead><tbody>`;
    for(let p of pageProducts){
        let lsc=(p.qty<=(p.lowStockAlert||0))?'low-stock-row':'';
        html+=`<tr class="${lsc}"><td>${p.imageUrl?`<img src="${p.imageUrl}" width="40" height="40" style="border-radius:8px;">`:'-'}</td><td style="text-align:right;">${escapeHtml(p.name)}</td><td>${p.barcode||'-'}</td><td>${p.priceRetail} ج.م</td><td>${p.qty}</td><td>${p.unit}</td><td>${p.lowStockAlert||0}</td><td><button class="btn-sm" onclick="openEditProductModal('${p.id}')">✏️</button>${currentRole==='owner'?`<button class="btn-sm btn-danger" onclick="deleteProduct('${p.id}')">🗑️</button>`:''}</td></tr>`;
    }
    html+=`</tbody></table></div>`;
    html+=`<div class="pagination-controls"><button class="btn-sm" onclick="changeProductPage(-1)" ${currentProductPage<=1?'disabled style="opacity:0.4;"':''}>▶ السابق</button><span class="pagination-info">صفحة ${currentProductPage} من ${totalPages} | إجمالي: ${totalProducts}</span><button class="btn-sm" onclick="changeProductPage(1)" ${currentProductPage>=totalPages?'disabled style="opacity:0.4;"':''}>التالي ◀</button></div>`;
    area.innerHTML=searchBar+html;
}

window.changeProductPage=function(dir){
    currentProductPage+=dir;

    else renderProductsTable();
    setTimeout(()=>{ const si=document.getElementById('productsTableSearch'); if(si) si.value=sv; },0);
};

let _productSearchTimer=null;
window.searchInProductsTable=function(val){
    currentProductPage=1; clearTimeout(_productSearchTimer);
    if(!val||!val.trim()){ renderProductsTable(); return; }
    _productSearchTimer=setTimeout(async()=>{
        const term=val.trim();
        if(!isOnline()||!currentStoreId){
            renderProductsTable(allProducts.filter(p=>p.name.toLowerCase().includes(term.toLowerCase())||(p.barcode&&p.barcode.toLowerCase().includes(term.toLowerCase()))));
            setTimeout(()=>{ const si=document.getElementById('productsTableSearch'); if(si) si.value=val; },0); return;
        }
        try{
            const snap=await getProductsCol().orderBy('name').startAt(term).endAt(term+'\uf8ff').limit(50).get();
            let results=snap.docs.map(d=>({id:d.id,...d.data()}));
            const byB=allProducts.filter(p=>p.barcode&&p.barcode.toLowerCase().includes(term.toLowerCase())&&!results.find(r=>r.id===p.id));
            results=results.concat(byB).slice(0,50);
            renderProductsTable(results);
        }catch(e){ renderProductsTable(allProducts.filter(p=>p.name.toLowerCase().includes(term.toLowerCase())||(p.barcode&&p.barcode.toLowerCase().includes(term.toLowerCase())))); }
        setTimeout(()=>{ const si=document.getElementById('productsTableSearch'); if(si) si.value=val; },0);
    },400);
};

    container.innerHTML=`<h3>📋 سجل المبيعات</h3>

    await ensureInvoicesCache(); filterAndDisplayInvoices();
}
function filterAndDisplayInvoices(){
    let filtered=[...allInvoicesCache];
    const now=new Date();
    if(invoicesFilter==='today'){ const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()),e=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1); filtered=filtered.filter(f=>f.date&&f.date.toDate()>=s&&f.date.toDate()<e); }
    else if(invoicesFilter==='yesterday'){ const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1),e=new Date(now.getFullYear(),now.getMonth(),now.getDate()); filtered=filtered.filter(f=>f.date&&f.date.toDate()>=s&&f.date.toDate()<e); }
    else if(invoicesFilter==='custom'&&invSelectedDate){ const s=new Date(invSelectedDate); s.setHours(0,0,0,0); const e=new Date(invSelectedDate); e.setHours(23,59,59,999); filtered=filtered.filter(f=>f.date&&f.date.toDate()>=s&&f.date.toDate()<=e); }
    if(invoiceSearchNumber.trim()!==''){ const num=parseInt(invoiceSearchNumber); if(!isNaN(num)) filtered=filtered.filter(f=>f.invoiceNumber===num); }
    filtered.sort((a,b)=>(b.date?.toDate()||0)-(a.date?.toDate()||0));
    const cont=document.getElementById('salesLogList'); if(!cont) return;
    if(!filtered.length){ cont.innerHTML='<p>⚠️ لا توجد فواتير</p>'; return; }
    let html=''; const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    for(let inv of filtered){
        let canc=inv.cancelled===true;
        let cust=inv.customerId?allCustomers.find(c=>c.id===inv.customerId):null;
        let dayName=dayNames[inv.date.toDate().getDay()];
        let itemsList=inv.items.map(it=>`${it.productName} (${it.quantity})`).join(', ');
        html+=`<div class="card ${canc?'cancelled':''}"><div class="card-info"><strong>فاتورة رقم: ${inv.invoiceNumber} - ${dayName}</strong><br>المنتجات: ${itemsList}<br>الإجمالي: ${inv.total} ج.م<br>طريقة الدفع: ${getPaymentMethodArabic(inv.paymentMethod)} | العميل: ${cust?cust.name:'نقدي'}<br>التاريخ: ${formatDate(inv.date)} | الحالة: ${canc?'ملغاة':'ناجحة'}</div><div>${!canc?`<button class="btn-sm btn-danger" onclick="cancelInvoice('${inv.id}')">إلغاء</button>`:''}</div></div>`;
    }
    cont.innerHTML=html;
}
window.showTop10Weekly=()=>{
    const weekAgo=new Date(); weekAgo.setDate(weekAgo.getDate()-7);
    const pc={};
    for(let inv of allInvoicesCache){ if(inv.cancelled||!inv.date) continue; if(inv.date.toDate()>=weekAgo) for(let it of inv.items) pc[it.productName]=(pc[it.productName]||0)+it.quantity; }
    const sorted=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const div=document.getElementById('topProductsWeek');
    if(!sorted.length){ div.innerHTML='<p>لا توجد مبيعات</p>'; return; }
    div.innerHTML=`<h3>🏆 أكثر 10 منتجات مبيعاً بالأسبوع</h3><div class="grid-2">${sorted.map(([n,q])=>`<div class="stat-card">${escapeHtml(n)} : ${q} وحدة</div>`).join('')}</div>`;
};
window.setInvoicesFilter=(f)=>{ invoicesFilter=f; const p=document.getElementById('invCustomDatePicker'); if(p) p.style.display=f==='custom'?'inline-block':'none'; if(f!=='custom') invSelectedDate=''; filterAndDisplayInvoices(); };
window.setInvCustomDate=(d)=>{ invSelectedDate=d; filterAndDisplayInvoices(); };
window.setInvoiceSearchNumber=(num)=>{ invoiceSearchNumber=num; filterAndDisplayInvoices(); };
window.loadInvoicesLog=async()=>{ await ensureInvoicesCache(); filterAndDisplayInvoices(); };
window.cancelInvoice=async(invoiceId)=>{
    if(!confirm('إلغاء الفاتورة؟ سيتم إعادة الكميات للمخزون.')) return;
    try{
        const invRef=getInvoicesCol().doc(invoiceId); const invDoc=await invRef.get();
        if(!invDoc.exists||invDoc.data().cancelled) throw new Error('فاتورة غير موجودة');
        const inv=invDoc.data();
        if(!isOnline()){
            await addPendingOp({type:'cancelInvoice',invoiceId,items:inv.items,customerId:inv.customerId,debtRemoved:inv.debtAdded||0});
            for(let item of inv.items){ let prod=allProducts.find(p=>p.id===item.productId); if(prod) prod.qty+=item.quantity; }
            if(inv.customerId&&inv.paymentMethod==='credit'&&inv.debtAdded){ let cust=allCustomers.find(c=>c.id===inv.customerId); if(cust) cust.debt=Math.max(0,(cust.debt||0)-inv.debtAdded); }
            await cacheData('products',allProducts); await cacheData('customers',allCustomers);
            const idx=allInvoicesCache.findIndex(i=>i.id===invoiceId); if(idx!==-1) allInvoicesCache[idx].cancelled=true;
            await cacheData('invoices',allInvoicesCache); filterAndDisplayInvoices();
            showFlash('salesLogList','تم الإلغاء محلياً',false); return;
        }
        const batch=db.batch();
        for(let item of inv.items) batch.update(getProductsCol().doc(item.productId),{qty:firebase.firestore.FieldValue.increment(item.quantity)});
        if(inv.customerId&&inv.paymentMethod==='credit'&&inv.debtAdded) batch.update(getCustomersCol().doc(inv.customerId),{debt:firebase.firestore.FieldValue.increment(-inv.debtAdded)});
        batch.update(invRef,{cancelled:true}); await batch.commit();
        const idx=allInvoicesCache.findIndex(i=>i.id===invoiceId); if(idx!==-1) allInvoicesCache[idx].cancelled=true;
        await cacheData('invoices',allInvoicesCache); filterAndDisplayInvoices();
        showFlash('salesLogList','تم إلغاء الفاتورة',false);
    }catch(err){ showFlash('salesLogList',err.message,true); }
};

// ========== المخزون ==========
let _inventorySearchTimer=null;
function filterInventory(){
    const search=document.getElementById('inventorySearch')?.value.trim()||'';
    const container=document.getElementById('inventoryTableContainer'); if(!container) return;
    const localFiltered=allProducts.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||(p.barcode&&p.barcode.toLowerCase().includes(search.toLowerCase())));
    _renderInventoryTable(localFiltered,container);
    if(search&&isOnline()&&currentStoreId){
        clearTimeout(_inventorySearchTimer);
        _inventorySearchTimer=setTimeout(async()=>{
            try{
                const snap=await getProductsCol().orderBy('name').startAt(search).endAt(search+'\uf8ff').limit(50).get();
                let results=snap.docs.map(d=>({id:d.id,...d.data()}));
                const byB=allProducts.filter(p=>p.barcode&&p.barcode.toLowerCase().includes(search.toLowerCase())&&!results.find(r=>r.id===p.id));
                results=results.concat(byB).slice(0,50);
                const c2=document.getElementById('inventoryTableContainer'); if(c2) _renderInventoryTable(results,c2);
            }catch(e){}
        },400);
    }
}
function _renderInventoryTable(filtered,container){
    if(!filtered.length){ container.innerHTML='<p>لا توجد منتجات</p>'; return; }
    let html=`<div class="table-responsive"><table class="data-table"><thead><tr><th>المنتج</th><th>الباركود</th><th>الكمية</th><th>الوحدة</th><th>سعر القطاعي</th><th>حد التنبيه</th><th>إجراء</th></tr></thead><tbody>`;
    for(let p of filtered) html+=`<tr><td style="text-align:right;">${escapeHtml(p.name)}</td><td>${p.barcode||'-'}</td><td>${p.qty}</td><td>${p.unit}</td><td>${p.priceRetail} ج.م</td><td>${p.lowStockAlert||0}</td><td><button class="btn-sm" onclick="openEditProductModal('${p.id}')">✏️ تعديل</button></td></tr>`;
    html+=`</tbody></table></div>`;
    container.innerHTML=html;
}
window.resetInventoryFilter=()=>{ document.getElementById('inventorySearch').value=''; filterInventory(); };

async function ensureMissingProductsCache(){
    if(!missingProductsLoaded&&currentStoreId){
        const snap=await getMissingProductsCol().limit(QUERY_LIMITS.missingProducts).get();
        allMissingProducts=snap.docs.map(d=>({id:d.id,...d.data()})); missingProductsLoaded=true;
        await cacheData('missingProducts',allMissingProducts);
    }
}
async function refreshMissingProductsTable(){
    const div=document.getElementById('missingProductsList'); if(!div) return;
    if(!allMissingProducts.length){ div.innerHTML='<p>لا توجد منتجات ناقصة</p>'; return; }
    let html=`<div class="table-responsive"><table class="data-table" id="missingProductsTablePrint"><thead><tr><th>الاسم</th><th>الكمية</th><th>إجراء</th></tr></thead><tbody>`;
    for(let p of allMissingProducts) html+=`<tr><td style="text-align:right;">${escapeHtml(p.name)}</td><td>${p.quantity||'ـ'}</td><td><button class="btn-sm btn-danger" onclick="deleteMissingProduct('${p.id}')">🗑️</button></td></tr>`;
    html+=`</tbody></table></div>`;
    div.innerHTML=html;
}
window.printMissingProducts=()=>{
    const t=document.getElementById('missingProductsTablePrint'); if(!t) return;
    directPrint(generatePrintHTML('المنتجات الناقصة','',t.querySelector('thead').innerHTML,t.querySelector('tbody').innerHTML,''));
};
window.addMissingProduct=async()=>{
    let name=document.getElementById('missingProductName').value.trim(); if(!name) return;
    let qtyRaw=document.getElementById('missingProductQty').value;
    let quantity=qtyRaw?parseInt(qtyRaw):null;
    const data={name,quantity,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    if(!isOnline()){ await addPendingOp({type:'addMissingProduct',data}); allMissingProducts.push({id:'temp_'+Date.now(),...data}); refreshMissingProductsTable(); cacheData('missingProducts',allMissingProducts); showFlash('missingProductsList','تمت الإضافة محلياً',false); document.getElementById('missingProductName').value=''; document.getElementById('missingProductQty').value=''; return; }
    const docRef=await getMissingProductsCol().add(data); allMissingProducts.push({id:docRef.id,...data}); await cacheData('missingProducts',allMissingProducts); refreshMissingProductsTable();
    document.getElementById('missingProductName').value=''; document.getElementById('missingProductQty').value='';
};
window.deleteMissingProduct=async(id)=>{
    if(confirm('حذف؟')){
        if(!isOnline()){ await addPendingOp({type:'deleteMissingProduct',missingId:id}); allMissingProducts=allMissingProducts.filter(p=>p.id!==id); refreshMissingProductsTable(); return; }
        await getMissingProductsCol().doc(id).delete(); allMissingProducts=allMissingProducts.filter(p=>p.id!==id); await cacheData('missingProducts',allMissingProducts); refreshMissingProductsTable();
    }
};

function applyProductFilter(){
    let filtered=[...allProducts];
    let search=document.getElementById('filterSearch')?.value.toLowerCase()||'';
    let minQty=parseInt(document.getElementById('filterMinQty')?.value);
    let maxQty=parseInt(document.getElementById('filterMaxQty')?.value);
    if(search) filtered=filtered.filter(p=>p.name.toLowerCase().includes(search)||(p.barcode&&p.barcode.toLowerCase().includes(search)));
    if(!isNaN(minQty)) filtered=filtered.filter(p=>p.qty>=minQty);
    if(!isNaN(maxQty)) filtered=filtered.filter(p=>p.qty<=maxQty);
    const container=document.getElementById('filteredProductsList');
    if(!filtered.length){ container.innerHTML='<p>لا توجد منتجات</p>'; return; }
    let html='<div class="grid-2">';
    for(let p of filtered) html+=`<div class="card"><div class="card-info"><strong>${escapeHtml(p.name)}</strong><br>الباركود: ${p.barcode||'-'}<br>الكمية: ${p.qty} ${p.unit}<br>السعر: ${p.priceRetail} ج.م</div></div>`;
    html+=`</div>`;
    container.innerHTML=html;
}
window.resetProductFilter=()=>{ document.getElementById('filterSearch').value=''; document.getElementById('filterMinQty').value=''; document.getElementById('filterMaxQty').value=''; applyProductFilter(); };

window.calculateTopByTime=async()=>{
    let start=document.getElementById('startTime').value, end=document.getElementById('endTime').value;
    if(!start||!end) return showFlash('topByTimeResult','يرجى تحديد النطاق الزمني',true);
    const startDate=new Date(start), endDate=new Date(end);
    const productCount={};
    for(let inv of allInvoicesCache){ if(inv.cancelled||!inv.date) continue; const invDate=inv.date?.toDate(); if(invDate&&invDate>=startDate&&invDate<=endDate) for(let it of inv.items) productCount[it.productName]=(productCount[it.productName]||0)+it.quantity; }
    const sorted=Object.entries(productCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const resultDiv=document.getElementById('topByTimeResult');
    if(!sorted.length){ resultDiv.innerHTML='<p>لا توجد مبيعات في هذا النطاق</p>'; return; }
    let html=`<div class="table-responsive"><table class="data-table"><thead><tr><th>المنتج</th><th>الكمية المباعة</th></tr></thead><tbody>${sorted.map(([n,q])=>`<tr><td style="text-align:right;">${escapeHtml(n)}</td><td>${q} وحدة</td></tr>`).join('')}</tbody></table></div>`;
    resultDiv.innerHTML=html;
};

function displayReportTable(invoices,title){
    if(!invoices.length){ document.getElementById('reportResult').innerHTML='<p>لا توجد بيانات</p>'; return; }

    let html=`<h4>${title}</h4><p>إجمالي المبيعات: ${totalSales.toFixed(2)} ج.م | إجمالي الأرباح: ${totalProfit.toFixed(2)} ج.م</p><div class="table-responsive"><table class="data-table" id="reportPrintTable"><thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>المنتجات</th></tr></thead><tbody>`;
    for(let inv of invoices) html+=`<tr><td>${inv.invoiceNumber}</td><td>${formatDate(inv.date)}</td><td>${inv.total.toFixed(2)}</td><td style="text-align:right;">${inv.items.map(it=>`${it.productName}(${it.quantity})`).join(', ')}</td></tr>`;

    document.getElementById('reportResult').innerHTML=html;
}

    document.getElementById('salesReportResult').innerHTML=html;
}
window.printSalesTable=()=>{ const t=document.getElementById('salesPrintTable'); if(!t) return; directPrint(generatePrintHTML('تقرير المبيعات اليومية','',t.querySelector('thead').innerHTML,t.querySelector('tbody').innerHTML,'')); };

window.changePassword=async()=>{
    const old=document.getElementById('oldPassword').value, new1=document.getElementById('newPassword1').value, new2=document.getElementById('newPassword2').value, msg=document.getElementById('passwordMsg');
    if(!old||!new1||!new2){ msg.style.display='block'; msg.innerText='املأ الحقول'; setTimeout(()=>msg.style.display='none',3000); return; }
    if(new1!==new2){ msg.style.display='block'; msg.innerText='كلمتا المرور غير متطابقتين'; setTimeout(()=>msg.style.display='none',3000); return; }
    if(new1.length<6){ msg.style.display='block'; msg.innerText='6 أحرف كحد أدنى'; setTimeout(()=>msg.style.display='none',3000); return; }
    try{
        const user=auth.currentUser;
        const cred=firebase.auth.EmailAuthProvider.credential(user.email,old);
        await user.reauthenticateWithCredential(cred); await user.updatePassword(new1);
        msg.style.display='block'; msg.style.backgroundColor='#d1fae5'; msg.innerText='✅ تم تغيير كلمة المرور'; setTimeout(()=>msg.style.display='none',3000);
    }catch(e){ msg.style.display='block'; msg.innerText=e.code==='auth/wrong-password'?'كلمة المرور القديمة خاطئة':'حدث خطأ'; setTimeout(()=>msg.style.display='none',3000); }
};

// ========== تسجيل الدخول ==========
async function handleSignedInUser(user){
    try{
        const info=await ensureUserDocument(user.uid,user.email);
        currentUserAuth=user; userData=info; currentStoreId=info.storeId; currentRole=info.role; isAdminGlobal=(currentRole==='admin');
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('dashboard').style.display='block';
        document.getElementById('storeTitle').innerHTML=`<i class="fas fa-store"></i> ${info.storeName||'المحل'}`;
        if(!isAdminGlobal) await loadStoreData(true);
        await ensureInvoicesCache(); await ensureMissingProductsCache();
        buildTabs();
        setTimeout(()=>syncPendingOps(),1000);
    }catch(e){ console.error(e); await auth.signOut(); location.reload(); }
}
async function loginUser(){
    const id=document.getElementById('loginId').value.trim();
    const pwd=document.getElementById('loginPassword').value;
    if(!id||!pwd){ document.getElementById('loginError').innerText='أدخل اسم المستخدم وكلمة المرور'; return; }
    try{ const cred=await auth.signInWithEmailAndPassword(id+"@bkalla.com",pwd); await handleSignedInUser(cred.user); }
    catch(e){ document.getElementById('loginError').innerText='فشل الدخول - تأكد من البيانات'; }
}
async function clearAllCachedData(){
    try{ if(idbReady&&dbCache){ await dbCache.clear('cache'); await dbCache.clear('pending'); } }catch(e){ console.warn(e); }
    allProducts=[]; allCustomers=[]; allSuppliers=[]; allInvoicesCache=[]; allMissingProducts=[];
    currentUserAuth=null; userData=null; currentStoreId=null; currentRole=null; isAdminGlobal=false;
    missingProductsLoaded=false; currentProductPage=1; cart=[]; lastReceiptData=null;
}
window.logoutUser=async()=>{ await clearAllCachedData(); await auth.signOut(); location.reload(); };
auth.onAuthStateChanged(async(u)=>{ if(u) await handleSignedInUser(u); else{ document.getElementById('loginScreen').style.display='flex'; document.getElementById('dashboard').style.display='none'; } });
</script>
