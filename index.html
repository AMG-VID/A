<script>
// ======================= الوضع الداكن / الفاتح =======================
function toggleTheme() {
    if (document.body.classList.contains('dark')) {
        document.body.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-moon"></i> داكن';
    } else {
        document.body.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-sun"></i> فاتح';
    }
}
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeToggleBtn') && (document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-sun"></i> فاتح');
}

// ======================= PWA Setup =======================
(function setupPWA() {
    const manifestObj = {
        "name": "فاتورة موسي",
        "short_name": "فاتورة موسي",
        "start_url": ".",
        "display": "standalone",
        "theme_color": "#4c1d95",
        "background_color": "#eef2ff",
        "icons": [{ "src": "Icon.png", "sizes": "any", "type": "image/jpeg", "purpose": "any maskable" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    let manifestLink = document.querySelector('link[rel="manifest"]');
    if (!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
    manifestLink.href = manifestURL;
    
    const swCode = `const CACHE_NAME='mahlati-v3';const urlsToCache=['./','./index.html','Icon.png','https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap','https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css','https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js','https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js','https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js'];self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(urlsToCache))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.map(k=>{if(k!==CACHE_NAME)return caches.delete(k)})))));`;
    const swBlob = new Blob([swCode], {type:'application/javascript'});
    const swURL = URL.createObjectURL(swBlob);
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register(swURL).catch(e=>console.warn(e)); }
})();

// ======================= Offline storage (IndexedDB) =======================
let idbReady = false;
let pendingOpsDB;
const openDB = async () => {
    if (!window.idb) return;
    pendingOpsDB = await idb.openDB('FatoraMousaOffline', 1, {
        upgrade(db) {
            if (!db.objectStoreNames.contains('pending')) db.createObjectStore('pending', { autoIncrement: true });
            if (!db.objectStoreNames.contains('cache')) db.createObjectStore('cache', { keyPath: 'key' });
        }
    });
    idbReady = true;
};
openDB();

// Cache data locally for offline view
async function cacheData(key, data) { if (idbReady) await pendingOpsDB.put('cache', { key, data, timestamp: Date.now() }); }
async function getCachedData(key) { if (idbReady) { const res = await pendingOpsDB.get('cache', key); return res?.data; } return null; }
async function addPendingOp(op) { if (idbReady) await pendingOpsDB.add('pending', op); }
async function getPendingOps() { if (idbReady) return await pendingOpsDB.getAll('pending'); return []; }
async function clearPendingOps() { if (idbReady) await pendingOpsDB.clear('pending'); }

let currentUserAuth=null, userData=null, currentStoreId=null, currentRole=null, isAdminGlobal=false;
let allProducts=[], allCustomers=[], allSuppliers=[], allInvoicesCache=[]; // مخزون الفواتير كاملة
let lastReceiptData=null;

// تحميل البيانات المخزنة محلياً أولاً
async function loadLocalCache() {
    const cachedProds = await getCachedData('products');
    if (cachedProds) allProducts = cachedProds;
    const cachedCust = await getCachedData('customers');
    if (cachedCust) allCustomers = cachedCust;
    const cachedSupp = await getCachedData('suppliers');
    if (cachedSupp) allSuppliers = cachedSupp;
    const cachedInvoices = await getCachedData('invoices');
    if (cachedInvoices) allInvoicesCache = cachedInvoices;
}
loadLocalCache();

function showFlash(id,txt,err=false){
    let el=document.getElementById(id);
    if(!el){ el=document.createElement('div'); el.className='flash'; const t=document.getElementById('tabContent')||document.getElementById('dashboard'); if(t) t.prepend(el); else document.getElementById('app')?.prepend(el); }
    el.innerText=txt; el.style.backgroundColor=err?'#ffe0e0':'#e0f2fe'; el.style.color=err?'#b91c1c':'#065f46';
    setTimeout(()=>el.remove(),3500);
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
function formatDate(ts){ return ts?.toDate ? ts.toDate().toLocaleString('ar-EG') : new Date(ts).toLocaleString('ar-EG'); }

function getStoreRef(){ return db.collection('stores').doc(currentStoreId); }
function getProductsCol(){ return getStoreRef().collection('products'); }
function getCustomersCol(){ return getStoreRef().collection('customers'); }
function getSuppliersCol(){ return getStoreRef().collection('suppliers'); }
function getInvoicesCol(){ return getStoreRef().collection('invoices'); }  // استخدام مجموعة الفواتير بدلاً من sales
function getInventoryCol(){ return getStoreRef().collection('inventoryTransactions'); }

async function ensureStoreDocument(sid,sname){
    const ref=db.collection('stores').doc(sid);
    const doc=await ref.get();
    if(!doc.exists) await ref.set({ name:sname, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
    return ref;
}
async function ensureUserDocument(uid,email){
    const userRef=db.collection('users').doc(uid);
    const doc=await userRef.get();
    if(doc.exists){
        if(doc.data().isActive===false) throw new Error('الحساب معطل');
        const data=doc.data();
        await ensureStoreDocument(data.storeId, data.storeName||'محل تجاري');
        return data;
    }
    const newStoreId=`store_${Date.now()}_${Math.floor(Math.random()*10000)}`;
    const storeName=`محل ${email.split('@')[0]}`;
    await ensureStoreDocument(newStoreId,storeName);
    const newUser={ email, role:'owner', storeId:newStoreId, storeName, isActive:true, createdAt:firebase.firestore.FieldValue.serverTimestamp() };
    await userRef.set(newUser);
    return newUser;
}
async function loadStoreData(){
    if(isAdminGlobal||!currentStoreId) return;
    const [p,c,s] = await Promise.all([getProductsCol().get(), getCustomersCol().get(), getSuppliersCol().get()]);
    allProducts = p.docs.map(d=>({id:d.id,...d.data()}));
    allCustomers = c.docs.map(d=>({id:d.id,...d.data()}));
    allSuppliers = s.docs.map(d=>({id:d.id,...d.data()}));
    await cacheData('products', allProducts);
    await cacheData('customers', allCustomers);
    await cacheData('suppliers', allSuppliers);
}
async function ensureInvoicesCache(){
    if(allInvoicesCache.length===0 && currentStoreId){
        const snap = await getInvoicesCol().get();
        allInvoicesCache = snap.docs.map(d=>({id:d.id,...d.data()}));
        await cacheData('invoices', allInvoicesCache);
    }
    return allInvoicesCache;
}

// مزامنة العمليات المعلقة عند العودة للاتصال
async function syncPendingOps() {
    if (!navigator.onLine) return;
    const pending = await getPendingOps();
    if (pending.length === 0) return;
    for (let op of pending) {
        try {
            if (op.type === 'addInvoice') {
                await getInvoicesCol().add(op.data);
                // تحديث المخزون لكل منتج (تم تحديثه محلياً بالفعل، لكن للتأكد نعيده)
                for (let item of op.data.items) {
                    const prodRef = getProductsCol().doc(item.productId);
                    const prodDoc = await prodRef.get();
                    if (prodDoc.exists) await prodRef.update({ qty: prodDoc.data().qty - item.quantity });
                }
                if (op.data.customerId && op.data.paymentMethod === 'credit' && op.data.debtAdded > 0) {
                    const custRef = getCustomersCol().doc(op.data.customerId);
                    const custDoc = await custRef.get();
                    await custRef.update({ debt: (custDoc.data().debt || 0) + op.data.debtAdded });
                }
            } else if (op.type === 'addProduct') {
                await getProductsCol().add(op.data);
            } else if (op.type === 'cancelInvoice') {
                const invoiceRef = getInvoicesCol().doc(op.invoiceId);
                await invoiceRef.update({ cancelled: true });
                for (let item of op.items) {
                    const prodRef = getProductsCol().doc(item.productId);
                    const prodDoc = await prodRef.get();
                    if (prodDoc.exists) await prodRef.update({ qty: (prodDoc.data().qty || 0) + item.quantity });
                }
                if (op.customerId && op.debtRemoved > 0) {
                    const custRef = getCustomersCol().doc(op.customerId);
                    const custDoc = await custRef.get();
                    await custRef.update({ debt: Math.max(0, (custDoc.data().debt || 0) - op.debtRemoved) });
                }
            }
        } catch(e) { console.warn('sync failed', e); }
    }
    await clearPendingOps();
    await ensureInvoicesCache();
    if (document.getElementById('salesLogList')) filterAndDisplayInvoices();
    if (document.getElementById('tabContent') && document.getElementById('salesLogList')) filterAndDisplayInvoices();
    showFlash('tabContent', '✅ تمت مزامنة العمليات المعلقة مع السحابة', false);
}
window.addEventListener('online', async () => {
    document.getElementById('statusBar').innerHTML = '🌐 متصل - جاري المزامنة...';
    document.getElementById('statusBar').style.backgroundColor = '#d1fae5';
    await syncPendingOps();
    document.getElementById('statusBar').innerHTML = '🌐 متصل';
    setTimeout(() => { if(document.getElementById('statusBar').innerHTML === '🌐 متصل') document.getElementById('statusBar').style.backgroundColor = '#d1fae5'; }, 2000);
    location.reload();
});
window.addEventListener('offline', () => {
    document.getElementById('statusBar').innerHTML = '📡 غير متصل - سيتم حفظ البيانات محلياً';
    document.getElementById('statusBar').style.backgroundColor = '#fee2e2';
});
function isOnline() { return navigator.onLine; }

function buildTabs(){
    const cont=document.getElementById('navTabs');
    let tabs=isAdminGlobal?[{id:'adminPanel',name:'📊 لوحة التحكم'}]:[
        {id:'pos',name:'💰 نقطة البيع'},{id:'products',name:'📦 المنتجات'},
        {id:'customers',name:'👥 العملاء'},{id:'suppliers',name:'🏭 الموردين'},
        {id:'salesLog',name:'📋 سجل المبيعات'},{id:'invoices',name:'📄 الفواتير'},
        {id:'other',name:'📦 أخرى'}
    ];
    cont.innerHTML=tabs.map(t=>`<button class="nav-btn" data-tab="${t.id}">${t.name}</button>`).join('');
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));
    if(tabs.length) switchTab(tabs[0].id);
}
async function switchTab(tabId){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    const ab=document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
    if(ab) ab.classList.add('active');
    const cont=document.getElementById('tabContent');
    if(isAdminGlobal){ cont.innerHTML='<div class="flash">لوحة المشرف قيد التطوير</div>'; return; }
    await loadStoreData();
    if(tabId==='pos') await renderPosTab(cont);
    else if(tabId==='products') await renderProductsTab(cont);
    else if(tabId==='customers') await renderCustomersTab(cont);
    else if(tabId==='suppliers') await renderSuppliersTab(cont);
    else if(tabId==='salesLog') await renderSalesLogTab(cont);
    else if(tabId==='invoices') await renderInvoicesTab(cont);
    else if(tabId==='other') await renderOtherTab(cont);
}

// ======================= نقطة البيع =======================
let cart=[];
async function renderPosTab(container){
    cart=[]; lastReceiptData=null;
    let custOpt=`<option value="">بدون عميل</option>`+allCustomers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
    container.innerHTML=`
        <div style="background:#f8fafc; border-radius:32px; padding:20px;">
            <h3>💰 نقطة البيع السريعة</h3>
            <div class="pos-row">
                <input type="text" id="searchProduct" placeholder="🔍 باركود أو اسم المنتج" oninput="searchProductLive()">
                <select id="productSelect"><option>اختر منتج</option></select>
                <input type="number" id="cartQty" placeholder="الكمية" value="1">
                <button onclick="addToCart()" class="btn-sm">➕ أضف للسلة</button>
            </div>
            <div id="cartItems"></div>
            <div class="pos-row">
                <input type="text" id="searchCustomer" placeholder="🔍 بحث عن عميل" oninput="filterCustomers()">
                <select id="customerId">${custOpt}</select>
                <select id="paymentMethod"><option value="cash">كاش</option><option value="visa">فيزا</option><option value="credit">آجل</option></select>
                <input type="number" id="paidAmount" placeholder="المدفوع" oninput="updateChange()">
                <input type="text" id="changeAmount" placeholder="الباقي" readonly>
            </div>
            <div style="font-size:24px; font-weight:bold;" id="totalAmount">الإجمالي: 0 ج.م</div>
            <button onclick="confirmSale()" style="background:#10b981;">إتمام البيع</button>
            <div id="posFlash"></div>
            <div id="printReceiptArea" style="margin-top:10px; display:none;"><button onclick="printLastReceipt()" style="background:#22c55e; width:auto; padding:8px 20px;">🖨️ طباعة الفاتورة</button></div>
        </div>`;
    const sel=document.getElementById('productSelect');
    sel.innerHTML=allProducts.map(p=>`<option value="${p.id}" data-price="${p.priceRetail||p.price}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('');
    if(allProducts.length===0) sel.innerHTML='<option>لا توجد منتجات</option>';
    window.searchProductLive=()=>{
        let val=document.getElementById('searchProduct').value;
        let filtered=allProducts.filter(p=>(p.barcode&&p.barcode.includes(val))||p.name.includes(val));
        let s=document.getElementById('productSelect');
        s.innerHTML=filtered.map(p=>`<option value="${p.id}" data-price="${p.priceRetail||p.price}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('');
        if(filtered.length===0) s.innerHTML='<option>لا يوجد</option>';
    };
    window.filterCustomers=()=>{
        let val=document.getElementById('searchCustomer').value.toLowerCase();
        let filtered=allCustomers.filter(c=>c.name.toLowerCase().includes(val));
        let options=`<option value="">بدون عميل</option>`+filtered.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} (دين: ${c.debt||0})</option>`).join('');
        document.getElementById('customerId').innerHTML=options;
    };
    window.addToCart=()=>{
        let sel=document.getElementById('productSelect');
        let pid=sel.value;
        if(!pid||pid==='لا يوجد') return;
        let qty=parseInt(document.getElementById('cartQty').value);
        if(qty<=0) return;
        let prod=allProducts.find(p=>p.id===pid);
        if(!prod||prod.qty<qty){ showFlash('posFlash','كمية غير متوفرة',true); return; }
        let existing=cart.find(i=>i.id===pid);
        if(existing) existing.qty+=qty;
        else cart.push({id:pid,name:prod.name,price:prod.priceRetail||prod.price,qty});
        renderCart();
    };
    window.renderCart=()=>{
        let cd=document.getElementById('cartItems');
        let total=0;
        let h=`<h4>السلة</h4>`;
        cart.forEach((item,idx)=>{
            total+=item.price*item.qty;
            h+=`<div class="card" style="padding:10px;">${item.name} x ${item.qty} = ${(item.price*item.qty).toFixed(2)} ج.م <button class="btn-sm btn-danger" onclick="removeFromCart(${idx})">حذف</button></div>`;
        });
        cd.innerHTML=h;
        document.getElementById('totalAmount').innerHTML=`الإجمالي: ${total.toFixed(2)} ج.م`;
        updateChange();
    };
    window.removeFromCart=(idx)=>{ cart.splice(idx,1); renderCart(); };
    window.updateChange=()=>{
        let t=cart.reduce((s,i)=>s+(i.price*i.qty),0);
        let paid=parseFloat(document.getElementById('paidAmount').value)||0;
        document.getElementById('changeAmount').value=(paid>t)?(paid-t).toFixed(2):0;
    };
    renderCart();
}

async function confirmSale(){
    if(cart.length===0) return showFlash('posFlash','السلة فارغة',true);
    let cid=document.getElementById('customerId').value||null;
    let pm=document.getElementById('paymentMethod').value;
    let paid=parseFloat(document.getElementById('paidAmount').value)||0;
    let total=cart.reduce((s,i)=>s+(i.price*i.qty),0);
    let finalMethod=pm, change=0, debtAdded=0;
    if(cid && paid<total){ finalMethod='credit'; debtAdded=total-paid; paid=total; change=0; showFlash('posFlash',`سيتم إضافة ${debtAdded} ج.م كدين على العميل`,false); }
    else if(finalMethod!=='credit' && paid<total) return showFlash('posFlash','المدفوع أقل من الإجمالي',true);
    else if(finalMethod!=='credit'){ change=paid-total; if(change<0) return showFlash('posFlash','المدفوع أقل من الإجمالي',true); }
    try{
        // التحقق من الكميات
        for(let item of cart){
            let prodRef=getProductsCol().doc(item.id);
            let prodSnap=await prodRef.get();
            if(!prodSnap.exists || prodSnap.data().qty < item.qty) throw new Error(`المنتج ${item.name} غير متوفر`);
        }
        const invoiceData = {
            items: cart.map(item=>({ productId: item.id, productName: item.name, quantity: item.qty, unitPrice: item.price, total: item.price*item.qty })),
            total: total,
            paymentMethod: finalMethod,
            customerId: cid,
            paidAmount: paid,
            changeAmount: change,
            userId: currentUserAuth.uid,
            cancelled: false,
            date: firebase.firestore.FieldValue.serverTimestamp(),
            debtAdded: debtAdded
        };
        if(!isOnline()){
            await addPendingOp({ type: 'addInvoice', data: invoiceData });
            // تحديث الكميات محلياً
            for(let item of cart){
                let prod=allProducts.find(p=>p.id===item.id);
                if(prod) prod.qty -= item.qty;
            }
            if(cid && debtAdded>0){
                let cust=allCustomers.find(c=>c.id===cid);
                if(cust) cust.debt = (cust.debt||0) + debtAdded;
            }
            await cacheData('products', allProducts);
            await cacheData('customers', allCustomers);
            showFlash('posFlash','تم حفظ البيع محلياً (غير متصل) - سيتم المزامنة لاحقاً',false);
            lastReceiptData = { cartItems: [...cart], total, method: finalMethod, customerId: cid, change, debtAdded };
            document.getElementById('printReceiptArea').style.display='block';
            cart=[]; renderCart();
            return;
        }
        const batch=db.batch();
        for(let item of cart){
            const prodRef=getProductsCol().doc(item.id);
            batch.update(prodRef, { qty: firebase.firestore.FieldValue.increment(-item.qty) });
        }
        const invoiceRef=getInvoicesCol().doc();
        batch.set(invoiceRef, invoiceData);
        if(cid && debtAdded>0){
            const custRef=getCustomersCol().doc(cid);
            batch.update(custRef, { debt: firebase.firestore.FieldValue.increment(debtAdded) });
        }
        await batch.commit();
        showFlash('posFlash',`✅ بيع ناجح بقيمة ${total} ج.م`,false);
        lastReceiptData = { cartItems: [...cart], total, method: finalMethod, customerId: cid, change, debtAdded };
        document.getElementById('printReceiptArea').style.display='block';
        await loadStoreData();
        await ensureInvoicesCache();
        const sel=document.getElementById('productSelect'); if(sel) sel.innerHTML=allProducts.map(p=>`<option value="${p.id}" data-price="${p.priceRetail||p.price}">${p.name} - ${p.priceRetail||p.price} ج.م (متوفر ${p.qty})</option>`).join('');
        cart=[]; renderCart();
    }catch(err){ showFlash('posFlash',err.message,true); }
}

let invoicesFilter='all', invSelectedDate='';
async function renderSalesLogTab(container){
    container.innerHTML=`<h3>📋 سجل المبيعات</h3><div class="pos-row"><button class="btn-sm ${invoicesFilter==='all'?'active':''}" onclick="setInvoicesFilter('all')">📋 الكل</button><button class="btn-sm ${invoicesFilter==='today'?'active':''}" onclick="setInvoicesFilter('today')">📅 اليوم</button><button class="btn-sm ${invoicesFilter==='yesterday'?'active':''}" onclick="setInvoicesFilter('yesterday')">📆 الأمس</button><button class="btn-sm ${invoicesFilter==='custom'?'active':''}" onclick="setInvoicesFilter('custom')">📅 تاريخ</button><input type="date" id="invCustomDatePicker" style="display:${invoicesFilter==='custom'?'inline-block':'none'}" onchange="setInvCustomDate(this.value)"><button class="btn-sm btn-secondary" onclick="loadInvoicesLog()">تحديث</button></div><div id="salesLogList">جاري التحميل...</div><hr><h3>🏆 أكثر 10 منتجات مبيعًا خلال الأسبوع</h3><div id="topProductsWeek">جاري التحميل...</div>`;
    await ensureInvoicesCache(); filterAndDisplayInvoices(); calculateTopProductsWeekFromInvoices();
}
function filterAndDisplayInvoices(){
    const cont=document.getElementById('salesLogList'); if(!cont) return;
    let filtered=[...allInvoicesCache];
    const now=new Date();
    if(invoicesFilter==='today'){ const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()), e=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1); filtered=filtered.filter(f=>f.date&&f.date.toDate()>=s&&f.date.toDate()<e); }
    else if(invoicesFilter==='yesterday'){ const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1), e=new Date(now.getFullYear(),now.getMonth(),now.getDate()); filtered=filtered.filter(f=>f.date&&f.date.toDate()>=s&&f.date.toDate()<e); }
    else if(invoicesFilter==='custom' && invSelectedDate){ const s=new Date(invSelectedDate); s.setHours(0,0,0,0); const e=new Date(invSelectedDate); e.setHours(23,59,59,999); filtered=filtered.filter(f=>f.date&&f.date.toDate()>=s&&f.date.toDate()<=e); }
    filtered.sort((a,b)=>(b.date?.toDate()||0)-(a.date?.toDate()||0));
    if(filtered.length===0){ cont.innerHTML='<p>⚠️ لا توجد فواتير في هذا التاريخ</p>'; return; }
    let html='';
    for(let inv of filtered){
        let canc=inv.cancelled===true;
        let cust=inv.customerId?allCustomers.find(c=>c.id===inv.customerId):null;
        let itemsList = inv.items.map(it=>`${it.productName} (${it.quantity})`).join(', ');
        html+=`<div class="card ${canc?'cancelled':''}"><div class="card-info"><strong>فاتورة رقم: ${inv.id.slice(-6)}</strong><br>المنتجات: ${itemsList}<br>الإجمالي: ${inv.total} ج.م<br>طريقة الدفع: ${inv.paymentMethod} | العميل: ${cust?cust.name:'نقدي'}<br>التاريخ: ${formatDate(inv.date)} | الحالة: ${canc?'ملغاة':'ناجحة'}</div><div>${!canc?`<button class="btn-sm btn-danger" onclick="cancelInvoice('${inv.id}')">إلغاء الفاتورة</button>`:''}</div></div>`;
    }
    cont.innerHTML=html;
}
function calculateTopProductsWeekFromInvoices(){
    const cont=document.getElementById('topProductsWeek'); if(!cont) return;
    const weekAgo=new Date(); weekAgo.setDate(weekAgo.getDate()-7);
    const pc={};
    for(let inv of allInvoicesCache){
        if(inv.cancelled===true) continue;
        if(!inv.date) continue;
        const invDate=inv.date.toDate();
        if(invDate>=weekAgo){
            for(let it of inv.items){
                pc[it.productName]=(pc[it.productName]||0)+it.quantity;
            }
        }
    }
    const sorted=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,10);
    if(sorted.length===0){ cont.innerHTML='<p>لا توجد مبيعات خلال الأسبوع الماضي</p>'; return; }
    cont.innerHTML=sorted.map(([n,q])=>`<div class="card"><div class="card-info">${escapeHtml(n)} : ${q} وحدة</div></div>`).join('');
}
window.setInvoicesFilter=(f)=>{ invoicesFilter=f; const p=document.getElementById('invCustomDatePicker'); if(p) p.style.display=f==='custom'?'inline-block':'none'; if(f!=='custom') invSelectedDate=''; filterAndDisplayInvoices(); };
window.setInvCustomDate=(d)=>{ invSelectedDate=d; filterAndDisplayInvoices(); };
window.loadInvoicesLog=async()=>{ await ensureInvoicesCache(); filterAndDisplayInvoices(); calculateTopProductsWeekFromInvoices(); };

window.cancelInvoice=async(invoiceId)=>{
    if(!confirm('إلغاء هذه الفاتورة؟ سيتم إعادة جميع الكميات للمخزون وخصم الدين إن وجد.')) return;
    try{
        const invRef=getInvoicesCol().doc(invoiceId);
        const invDoc=await invRef.get();
        if(!invDoc.exists || invDoc.data().cancelled) throw new Error('لا يمكن الإلغاء');
        const inv=invDoc.data();
        const batch=db.batch();
        for(let item of inv.items){
            const prodRef=getProductsCol().doc(item.productId);
            batch.update(prodRef, { qty: firebase.firestore.FieldValue.increment(item.quantity) });
        }
        if(inv.customerId && inv.paymentMethod==='credit' && inv.debtAdded){
            const custRef=getCustomersCol().doc(inv.customerId);
            batch.update(custRef, { debt: firebase.firestore.FieldValue.increment(-inv.debtAdded) });
        }
        batch.update(invRef, { cancelled: true });
        await batch.commit();
        const idx=allInvoicesCache.findIndex(i=>i.id===invoiceId);
        if(idx!==-1) allInvoicesCache[idx].cancelled=true;
        await cacheData('invoices', allInvoicesCache);
        filterAndDisplayInvoices();
        calculateTopProductsWeekFromInvoices();
        showFlash('salesLogList','تم إلغاء الفاتورة وإعادة الكميات',false);
    }catch(err){ showFlash('salesLogList',err.message,true); }
};

// ======================= فواتير اليوم (عرض الفواتير المجمعة) =======================
async function renderInvoicesTab(container){
    await ensureInvoicesCache();
    const now=new Date();
    const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
    const today=allInvoicesCache.filter(inv=>inv.date&&inv.date.toDate()>=start&&inv.date.toDate()<end);
    const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    const dayName=days[now.getDay()];
    let html=`<h3>📄 فواتير اليوم - ${dayName}</h3>`;
    if(today.length===0) html+='<p>لا توجد فواتير اليوم</p>';
    else for(let inv of today){
        let canc=inv.cancelled===true;
        let cust=inv.customerId?allCustomers.find(c=>c.id===inv.customerId):null;
        let itemsList = inv.items.map(it=>`${it.productName} (${it.quantity})`).join(', ');
        html+=`<div class="card ${canc?'cancelled':''}"><div class="card-info"><strong>فاتورة رقم: ${inv.id.slice(-6)}</strong><br>المنتجات: ${itemsList}<br>الإجمالي: ${inv.total} ج.م<br>طريقة الدفع: ${inv.paymentMethod}<br>العميل: ${cust?cust.name:'نقدي'}<br>الوقت: ${inv.date?.toDate().toLocaleTimeString('ar-EG')}</div><div>${!canc?`<button class="btn-sm btn-danger" onclick="cancelInvoice('${inv.id}')">🔄 إرجاع</button>`:'<span class="btn-sm">ملغاة</span>'} <button class="btn-sm" onclick="printInvoice('${inv.id}')">🖨️ طباعة</button></div></div>`;
    }
    container.innerHTML=html;
}

async function renderDaySalesWithStatsFromInvoices(container, dayType){
    await ensureInvoicesCache();
    const now=new Date();
    let start,end,dayName;
    const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    if(dayType==='today'){
        start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
        end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
        dayName=days[now.getDay()];
        container.innerHTML=`<h3>📆 مبيعات اليوم (${dayName})</h3><div id="daySalesList"></div><div id="dayStats"></div>`;
    }else{
        start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
        end=new Date(now.getFullYear(),now.getMonth(),now.getDate());
        const yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
        dayName=days[yest.getDay()];
        container.innerHTML=`<h3>📆 مبيعات الأمس (${dayName})</h3><div id="daySalesList"></div><div id="dayStats"></div>`;
    }
    const filtered=allInvoicesCache.filter(inv=>!inv.cancelled && inv.date && inv.date.toDate()>=start && inv.date.toDate()<end);
    const listDiv=document.getElementById('daySalesList');
    if(filtered.length===0){ listDiv.innerHTML='<p>لا توجد مبيعات</p>'; document.getElementById('dayStats').innerHTML=''; return; }
    let totalSales=0, totalProfit=0, html='';
    for(let inv of filtered){
        totalSales+=inv.total;
        for(let it of inv.items){
            const prod=allProducts.find(p=>p.id===it.productId);
            const cost=prod?.cost||0;
            totalProfit+=it.total-(cost*it.quantity);
        }
        html+=`<div class="card"><div class="card-info">فاتورة ${inv.id.slice(-6)} - الإجمالي: ${inv.total} ج.م (${inv.items.length} منتج)</div></div>`;
    }
    listDiv.innerHTML=html;
    document.getElementById('dayStats').innerHTML=`<div class="card" style="background:#e0f2fe;"><div class="card-info"><strong>📊 إجمالي المبيعات: ${totalSales.toFixed(2)} ج.م</strong><br><strong>💰 إجمالي الأرباح: ${totalProfit.toFixed(2)} ج.م</strong></div></div>`;
}
window.calculateHottestProductsFromInvoices=async()=>{
    const start=new Date(document.getElementById('startTime').value);
    const end=new Date(document.getElementById('endTime').value);
    if(isNaN(start)||isNaN(end)) return showFlash('hottestResult','يرجى تحديد النطاق الزمني',true);
    await ensureInvoicesCache();
    const pc={};
    for(let inv of allInvoicesCache){
        if(inv.cancelled) continue;
        const invDate=inv.date?.toDate();
        if(invDate && invDate>=start && invDate<=end){
            for(let it of inv.items){
                pc[it.productName]=(pc[it.productName]||0)+it.quantity;
            }
        }
    }
    const sorted=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const resultDiv=document.getElementById('hottestResult');
    if(sorted.length===0){ resultDiv.innerHTML='<p>لا توجد مبيعات في هذا النطاق</p>'; return; }
    resultDiv.innerHTML=sorted.map(([n,q])=>`<div class="card"><div class="card-info">${escapeHtml(n)} : ${q} وحدة</div></div>`).join('');
};
async function renderReportsInside(container){
    await loadStoreData();
    await ensureInvoicesCache();
    let profit=0, ps={};
    for(let inv of allInvoicesCache){
        if(inv.cancelled) continue;
        for(let it of inv.items){
            const prod=allProducts.find(p=>p.id===it.productId);
            const cost=prod?.cost||0;
            profit+=it.total-(cost*it.quantity);
            ps[it.productName]=(ps[it.productName]||0)+it.quantity;
        }
    }
    let best=Object.keys(ps).length?Object.keys(ps).reduce((a,b)=>ps[a]>ps[b]?a:b):'لا يوجد';
    let low=allProducts.filter(p=>p.qty<=(p.lowStockAlert||0)).map(p=>p.name).join(', ')||'لا يوجد';
    container.innerHTML=`<div class="grid-2"><div class="stat-card">💰 إجمالي الأرباح: ${profit.toFixed(2)} ج.م</div><div class="stat-card">🏆 الأكثر مبيعاً: ${best}</div><div class="stat-card">⚠️ منتجات منخفضة المخزون: ${low}</div></div><button class="btn-secondary" onclick="renderReportsInside(document.getElementById('otherContent'))">تحديث</button>`;
}

window.changePassword=async()=>{
    const old=document.getElementById('oldPassword').value, new1=document.getElementById('newPassword1').value, new2=document.getElementById('newPassword2').value, msg=document.getElementById('passwordMsg');
    if(!old||!new1||!new2){ msg.style.display='block'; msg.style.backgroundColor='#ffe0e0'; msg.style.color='#b91c1c'; msg.innerText='الرجاء ملء جميع الحقول'; setTimeout(()=>msg.style.display='none',3000); return; }
    if(new1!==new2){ msg.style.display='block'; msg.style.backgroundColor='#ffe0e0'; msg.style.color='#b91c1c'; msg.innerText='كلمة المرور الجديدة غير متطابقة'; setTimeout(()=>msg.style.display='none',3000); return; }
    if(new1.length<6){ msg.style.display='block'; msg.style.backgroundColor='#ffe0e0'; msg.style.color='#b91c1c'; msg.innerText='كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل'; setTimeout(()=>msg.style.display='none',3000); return; }
    const user=auth.currentUser;
    try{
        const cred=firebase.auth.EmailAuthProvider.credential(user.email,old);
        await user.reauthenticateWithCredential(cred);
        await user.updatePassword(new1);
        msg.style.display='block'; msg.style.backgroundColor='#e0f2fe'; msg.style.color='#065f46'; msg.innerText='✅ تم تغيير كلمة المرور بنجاح';
        document.getElementById('oldPassword').value=''; document.getElementById('newPassword1').value=''; document.getElementById('newPassword2').value='';
        setTimeout(()=>msg.style.display='none',3000);
    }catch(e){
        msg.style.display='block'; msg.style.backgroundColor='#ffe0e0'; msg.style.color='#b91c1c';
        msg.innerText=e.code==='auth/wrong-password'?'كلمة المرور القديمة خاطئة':'حدث خطأ، حاول مرة أخرى';
        setTimeout(()=>msg.style.display='none',3000);
    }
};

async function handleSignedInUser(user){
    try{
        const info=await ensureUserDocument(user.uid,user.email);
        currentUserAuth=user; userData=info; currentStoreId=info.storeId; currentRole=info.role; isAdminGlobal=(currentRole==='admin');
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('dashboard').style.display='block';
        document.getElementById('storeTitle').innerHTML=`<i class="fas fa-store"></i> ${info.storeName||'المحل'}`;
        if(!isAdminGlobal) await loadStoreData();
        await ensureInvoicesCache();
        buildTabs();
        // عرض حالة الاتصال
        if(!navigator.onLine) document.getElementById('statusBar').innerHTML = '📡 غير متصل - سيتم حفظ البيانات محلياً';
        else document.getElementById('statusBar').innerHTML = '🌐 متصل';
    }catch(e){ console.error(e); await auth.signOut(); location.reload(); }
}
async function loginUser(){
    const id=document.getElementById('loginId').value.trim();
    const pwd=document.getElementById('loginPassword').value;
    if(!id||!pwd){ document.getElementById('loginError').innerText='الرجاء إدخال ID وكلمة المرور'; return; }
    const email=id+"@bkalla.com";
    try{ const cred=await auth.signInWithEmailAndPassword(email,pwd); await handleSignedInUser(cred.user); }
    catch(e){ document.getElementById('loginError').innerText='فشل الدخول: تحقق من ID وكلمة المرور'; }
}
window.logoutUser=async()=>{ await auth.signOut(); location.reload(); };
auth.onAuthStateChanged(async(u)=>{ if(u) await handleSignedInUser(u); else { document.getElementById('loginScreen').style.display='flex'; document.getElementById('dashboard').style.display='none'; } });
</script>
