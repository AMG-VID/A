<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMG.VID - منصة الفيديو</title>
    <style>
        /* --- CSS (التنسيق) --- */
        :root {
            --bg-color: #0f172a; /* لون خلفية غامق مريح */
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8; /* لون أزرق سماوي للتمييز */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 2rem 5%; /* زيادة الـ padding لإعطاء مساحة للشعار الجديد */
            display: flex;
            flex-direction: column; /* ترتيب العناصر عموديًا في الـ header */
            align-items: center; /* توسيط العناصر أفقيًا */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 1.5rem; /* مسافة بين الشعار وشريط البحث */
        }

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center; /* توسيط الشعار */
        }

        .logo-image {
            max-height: 80px; /* تحديد أقصى ارتفاع للشعار */
            width: auto; /* الحفاظ على أبعاد الصورة */
        }

        .search-box {
            position: relative;
            width: 100%; /* اجعل شريط البحث يأخذ المساحة المتاحة */
            max-width: 500px; /* تحديد أقصى عرض لشريط البحث */
        }

        input#searchInput {
            width: 100%;
            padding: 12px 20px; /* زيادة التباعد الداخلي قليلاً */
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
            transition: border 0.3s;
            font-size: 1rem;
        }

        input#searchInput:focus {
            border-color: var(--accent);
        }

        main {
            padding: 2rem 5%;
            flex-grow: 1; /* السماح لـ main بأخذ المساحة المتبقية */
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #334155;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .thumbnail {
            width: 100%;
            height: 160px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .info {
            padding: 15px;
        }

        .info h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
        }

        .info p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin: 0;
        }

        /* رسالة عند عدم وجود نتائج */
        #noResults {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: var(--text-dim);
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="AMG.VID.png" alt="AMG.VID Logo" class="logo-image">
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيديوهات...">
        </div>
    </header>

    <main>
        <div class="video-grid" id="videoGrid">
            </div>
        <div id="noResults">عذراً، لم نجد فيديوهات تطابق بحثك.</div>
    </main>

    <script>
        /* --- JavaScript (التفاعل) --- */

        // قاعدة بيانات تجريبية (يمكنك إضافة روابط يوتيوب هنا لاحقاً)
        const videoData = [
            { id: 1, title: "تطوير تطبيقات الأندرويد", category: "برمجة", icon: "📱" },
            { id: 2, title: "أساسيات لغة بايثون", category: "تعليم", icon: "🐍" },
            { id: 3, title: "تحليل الشبكات المتقدم", category: "سيكيورتي", icon: "🛡️" },
            { id: 4, title: "شرح أوامر Termux", category: "أدوات", icon: "💻" },
            { id: 5, title: "تعديل ملفات النظام BuildProp", category: "موبايل", icon: "⚙️" },
            { id: 6, title: "تصميم واجهات المستخدم UI", category: "تصميم", icon: "🎨" },
        ];

        const videoGrid = document.getElementById('videoGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        // دالة رسم البطاقات
        function renderVideos(list) {
            videoGrid.innerHTML = '';
            if (list.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            list.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail">${video.icon}</div>
                    <div class="info">
                        <h3>${video.title}</h3>
                        <p>${video.category}</p>
                    </div>
                `;
                videoGrid.appendChild(card);
            });
        }

        // محرك البحث
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = videoData.filter(v => 
                v.title.toLowerCase().includes(term) || 
                v.category.toLowerCase().includes(term)
            );
            renderVideos(filtered);
        });

        // التشغيل المبدئي
        renderVideos(videoData);
    </script>
</body>
</html>
